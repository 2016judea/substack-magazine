<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aidan Jude — Selected writing 2024</title>
<style>
/* Aidan Jude · Selected writing · 2024.  Letter trim 816x1056 css px, 12px (0.125in) bleed a side.
   Display: Bricolage Grotesque (condensed 75 wdth, 700/800). Text: Newsreader (opsz 10 / 36). Both OFL. */
@font-face{font-family:DispX;src:url(fonts/Display-XBold.ttf)}
@font-face{font-family:DispB;src:url(fonts/Display-Bold.ttf)}
@font-face{font-family:LabS;src:url(fonts/Label-Semi.ttf)}
@font-face{font-family:LabR;src:url(fonts/Label-Reg.ttf)}
@font-face{font-family:Txt;src:url(fonts/Text-Reg.ttf)}
@font-face{font-family:Txt;src:url(fonts/Text-Bold.ttf);font-weight:700}
@font-face{font-family:Txt;src:url(fonts/Text-Italic.ttf);font-style:italic}
@font-face{font-family:DeckI;src:url(fonts/Deck-Italic.ttf)}
@font-face{font-family:Deck;src:url(fonts/Deck-Reg.ttf)}
@font-face{font-family:DeckI;src:url(fonts/Deck-BoldItalic.ttf);font-weight:700}
@font-face{font-family:Txt;src:url(fonts/Text-BoldItalic.ttf);font-weight:700;font-style:italic}
@font-face{font-family:Fb;src:url(fonts/Fallback-Bar.ttf);unicode-range:U+2015}
@font-face{font-family:Fb;src:url(fonts/Fallback-Emoji.ttf);unicode-range:U+1F680}
:root{--ink:#151413;--red:#D33A22;--grey:#6d6a66;--paper:#ffffff;--rule:#151413;--onink:#F3EEE6;--L:18px}
@page{size:8.75in 11.25in;margin:0}
html,body{margin:0;padding:0;background:#8a8784}
body{font-synthesis:none;font-family:Txt,Fb;color:var(--ink);-webkit-font-smoothing:antialiased;font-kerning:normal;font-variant-ligatures:common-ligatures}
strong,b{font-weight:700}
code{font-family:inherit;font-size:inherit}
.cr em{font-style:normal}
.pull em,.lit .q em,.op-deck em,.toc .st em{font-family:Deck,Fb;font-style:normal}
#book{display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px 0}
.pg{position:relative;width:840px;height:1080px;overflow:hidden;background:var(--paper);flex:none;break-after:page}
.trim{position:absolute;left:12px;top:12px;width:816px;height:1056px}
@media print{html,body{background:none}#book{display:block;padding:0}#book>.pg{margin:0}#book>.pg:last-child{break-after:auto}}
/* ---------- flowing blocks ---------- */
.b{box-sizing:border-box;width:336px;margin:0}
.p{font-size:13.2px;line-height:18px;text-align:justify;hyphens:auto;-webkit-hyphens:auto;text-indent:1.15em;hyphenate-limit-chars:6 3 3}
.p.ni{text-indent:0}
.p code,.li code{font-family:Txt,Fb}
.h2{padding-top:18px}
.h2 .rule{height:3px;background:var(--ink);margin-bottom:9px;width:100%}
.h2 .ht{font-family:DispB,Fb;font-size:25px;line-height:26px;letter-spacing:-.005em;padding-bottom:3px}
.h4{padding-top:18px;font-family:LabS,Fb;font-size:10.5px;line-height:18px;letter-spacing:.13em;text-transform:uppercase;color:var(--red)}
.bq{font-style:italic;font-size:13.2px;line-height:18px;padding-left:18px;padding-right:6px;text-align:left;hyphens:auto;border-left:2px solid var(--red);margin-left:1px}
.bq.first{padding-top:0}
.bqwrap-top{padding-top:18px}
.li{position:relative;font-size:13.2px;line-height:18px;text-align:left;hyphens:auto}
.li .mk{display:inline-block;width:22px;margin-left:-22px;font-family:LabS,Fb;font-size:10.5px;color:var(--red)}
.vl{font-size:13.2px;line-height:18px;text-align:left;white-space:pre-wrap;padding-left:18px;text-indent:0}
.vl.riff{padding-left:0}
.gap{height:18px}
.hr{height:18px;position:relative}
.hr::after{content:"";position:absolute;left:0;width:48px;top:8px;height:2px;background:var(--ink)}
.fig img{display:block}
.fig .cr,.op-art .cr,.span-img .cr,.lit .cr{font-family:LabR,Fb;font-size:9px;line-height:12px;color:var(--grey);padding-top:6px;letter-spacing:.01em}
.pull{width:696px;box-sizing:border-box;border-top:3px solid var(--ink);padding-top:14px;font-family:DeckI,Fb;font-size:31px;line-height:36px;color:var(--red);letter-spacing:-.005em}
.pull.his{color:var(--ink)}
.span-img img{display:block}
/* ---------- placed pages ---------- */
.col{position:absolute;overflow:hidden}
.col>.b{position:absolute;left:0}
.folio{position:absolute;bottom:38px;font-family:LabS,Fb;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);line-height:12px;white-space:nowrap}
.folio .n{color:var(--ink);font-family:DispX,Fb;font-size:15px;letter-spacing:0;vertical-align:-1px}
.folio .sep{display:inline-block;width:14px}
/* ---------- opener ---------- */
.op{position:absolute;width:696px}
.op-top{display:flex;justify-content:space-between;align-items:baseline;border-top:6px solid var(--red);padding-top:9px;font-family:LabS,Fb;font-size:10.5px;line-height:18px;letter-spacing:.13em;text-transform:uppercase}
.op-top .d{color:var(--red)}
.op-top .s{color:var(--grey);text-align:right;max-width:470px}
.op-title{font-family:DispX,Fb;font-weight:normal;margin:0;white-space:nowrap;line-height:.84;letter-spacing:-.015em;padding-top:16px}
.op-row{display:flex;gap:24px;align-items:flex-end;margin-top:18px}
.op-row.stack{flex-direction:column;align-items:flex-start;gap:18px}
.op-deck{font-family:DeckI,Fb;font-size:30px;line-height:34px;flex:1;min-width:0;padding-bottom:2px}
.op-art{flex:none}
.op-art img{display:block}
/* ---------- literature ---------- */
.pg.lit{background:var(--ink);color:var(--onink)}
.lit .head{position:absolute;font-family:LabS,Fb;font-size:10.5px;line-height:18px;letter-spacing:.13em;text-transform:uppercase;color:var(--red);border-top:6px solid var(--red);padding-top:9px;width:696px}
.lit .head .m{float:right;color:#9b958d}
.lit .body{position:absolute;width:600px}
.lit .q{font-family:DeckI,Fb;color:var(--onink)}
.lit .q .gapl{display:block}
.lit .q .ln{display:block;padding-left:1.1em;text-indent:-1.1em}
.lit .att{display:block;font-family:LabS,Fb;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-top:22px;font-style:normal}
.lit .q p{margin:0 0 .5em}
.lit figure{margin:0 0 30px}
.lit figure.after{margin:30px 0 0}
.lit .cr{color:#9b958d}
.lit .so{position:absolute;font-family:Txt,Fb;font-style:italic;font-size:11px;line-height:15px;color:#a8a29a;width:420px}
.lit .so p{margin:0}
/* ---------- covers & contents ---------- */
.pg.cover{background:var(--red);color:#FFF4EA}
.cover .mast{position:absolute;left:0;width:816px;text-align:center;font-family:DispX,Fb;line-height:1;white-space:nowrap;letter-spacing:-.01em}
.cover .sub{position:absolute;left:0;width:816px;text-align:center;font-family:LabS,Fb;font-size:15px;letter-spacing:.16em;text-transform:uppercase}
.cover .by{position:absolute;left:0;width:816px;text-align:center;font-family:DispB,Fb;font-size:22px;letter-spacing:.01em}
.cover .cnt{position:absolute;left:0;width:816px;text-align:center;font-family:LabS,Fb;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.pg.back{background:var(--ink);color:var(--onink)}
.back .nm{position:absolute;left:0;width:816px;text-align:center;font-family:DispB,Fb;font-size:27px}
.back .from{position:absolute;left:0;width:816px;text-align:center;font-family:LabR,Fb;font-size:11.5px;letter-spacing:.06em;color:#bfb8ae}
.toc{position:absolute;width:696px}
.toc .yr{font-family:DispX,Fb;color:var(--red);line-height:.8;white-space:nowrap;letter-spacing:-.02em}
.toc .lab{display:flex;justify-content:space-between;border-top:6px solid var(--ink);padding-top:9px;margin-top:18px;font-family:LabS,Fb;font-size:10.5px;line-height:18px;letter-spacing:.13em;text-transform:uppercase}
.toc .lab .g{color:var(--grey)}
.toc .row{display:grid;grid-template-columns:62px 1fr;column-gap:14px;border-top:1px solid #cfcac3;padding:8px 0 9px}
.toc .row:first-of-type{border-top:0}
.toc .pn{font-family:DispX,Fb;font-size:34px;line-height:32px;color:var(--red)}
.toc .t{font-family:DispB,Fb;font-size:25px;line-height:26px}
.toc .t .dt{font-family:LabS,Fb;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--grey);margin-left:12px;vertical-align:4px}
.toc .st{font-family:DeckI,Fb;font-size:16px;line-height:19px;margin-top:2px}
.toc .sx{font-family:LabR,Fb;font-size:9.5px;line-height:13px;color:var(--grey);margin-top:4px;letter-spacing:.02em}
#measure{position:absolute;left:-5000px;top:0;visibility:hidden}
</style>
</head>
<body>
<div id="book"></div>
<div id="measure"></div>
<script>
const CFG = /*ISSUE*/null;
const L = 18, W = 816, H = 1056, TOP = 66, AREA = 900, BOTTOM = TOP + AREA, INNER = 72, OUTER = 48, TW = 696, COLW = 336, GUT = 24;
const PPI = 200, PX = 96;              // print target: 200 ppi effective
const $ = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const M = document.getElementById("measure"), BOOK = document.getElementById("book");
const curly = (s) => s.replace(/'(\d\d)\b/g, "’$1").replace(/(\w)'(\w)/g, "$1’$2");
const LOG = [], CHECK = [];
const textW = (e) => { const r = document.createRange(); r.selectNodeContents(e); return r.getBoundingClientRect().width; };

/* ---------- block elements ---------- */
function maxW(it, cap) { return Math.min(cap, Math.floor(it.w / PPI * PX)); }   // widest it can print at >= 200 ppi
function isSpanImg(it) { return it.t === "img" && it.w >= 1400 && it.w / it.h >= 1.3; }
function figure(it, cls, wcap, scale = 1, hcap = 1e9) {
  const f = $("div", cls);
  let w = maxW(it, wcap);
  let h = w * it.h / it.w;
  if (h > hcap) { h = hcap; w = h * it.w / it.h; }
  w = Math.round(w * scale); h = Math.round(w * it.h / it.w);
  const im = $("img"); im.src = it.src; im.style.width = w + "px"; im.style.height = h + "px"; im.dataset.nat = it.w; f.appendChild(im);
  if (it.credit) f.appendChild($("div", "cr", it.credit));
  return f;
}
function block(it, ctx) {
  let e;
  switch (it.t) {
    case "p": e = $("div", "b p" + (it.noindent || it.label ? " ni" : ""), it.html); if (it.label) e.dataset.keepLast = 1; break;
    case "h2": e = $("div", "b h2"); e.appendChild($("div", "rule")); e.appendChild($("div", "ht", it.html)); e.dataset.keep = 1; break;
    case "h4": e = $("div", "b h4", it.html); e.dataset.keep = 1; break;
    case "bq": e = $("div", "b bq", it.html); if (it.first) e.style.marginTop = "0"; break;
    case "li": e = $("div", "b li", it.html); e.style.paddingLeft = (22 + 18 * it.depth) + "px"; { const m = $("span", "mk", it.mark); e.prepend(m); } break;
    case "vl": e = $("div", "b vl" + (ctx.riff ? " riff" : ""), it.text); e.dataset.grp = it.grp; break;
    case "gap": e = $("div", "b gap"); e.dataset.grp = it.grp; e.dataset.gap = 1; break;
    case "hr": e = $("div", "b hr"); break;
    case "img": e = figure(it, "b fig", COLW, ctx.scale || 1, 420); e.dataset.solid = 1; break;
    default: throw new Error("block " + it.t);
  }
  e.dataset.t = it.t;
  return e;
}
function spanEl(it, scale) {
  if (it.t === "pull") { const e = $("div", "pull" + (it.his ? " his" : ""), it.html); return e; }
  const e = figure(it, "span-img", TW, scale, 470); return e;
}
/* ---------- vertical rhythm: pad every block to a whole number of lines ---------- */
function snap(e, top = 0) {
  const h = e.getBoundingClientRect().height;
  const r = Math.ceil((h - 0.5) / L) * L - h;
  if (r > 0.01) e.style.paddingBottom = (parseFloat(getComputedStyle(e).paddingBottom) + r) + "px";
}
/* spacing rules that need neighbours: space above/below a group of block quotes, lists, verse, figures */
function spaceAround(seq) {
  for (let i = 0; i < seq.length; i++) {
    const e = seq[i], t = e.dataset.t, prev = seq[i - 1], next = seq[i + 1];
    const pt = prev && prev.dataset.t, nt = next && next.dataset.t;
    const groupStart = (t === "bq" && pt !== "bq") || (t === "li" && pt !== "li") || (t === "vl" && pt !== "vl" && pt !== "gap") || t === "img" || t === "hr";
    const groupEnd = (t === "bq" && nt !== "bq") || (t === "li" && nt !== "li") || (t === "vl" && nt !== "vl" && nt !== "gap") || t === "img" || t === "hr";
    if (groupStart && pt && pt !== "h2" && pt !== "h4") e.style.paddingTop = (parseFloat(getComputedStyle(e).paddingTop) + L) + "px";
    else if (groupStart && (pt === "h2" || pt === "h4") && t !== "img") e.style.paddingTop = "0px";
    if (t === "img" && (pt === "h2" || pt === "h4")) e.style.paddingTop = "9px";
    if (groupEnd && nt && nt !== "h2" && nt !== "h4") e.style.paddingBottom = (parseFloat(getComputedStyle(e).paddingBottom) + L) + "px";
  }
}
/* ---------- atoms: the lines and unbreakable pieces of one galley ---------- */
function atomsOf(gal) {
  const g0 = gal.getBoundingClientRect().top, kids = [...gal.children], A = [];
  let gid = 0;
  kids.forEach((e, bi) => {
    const r = e.getBoundingClientRect(), cs = getComputedStyle(e);
    const top = r.top - g0 + parseFloat(cs.paddingTop), bot = r.bottom - g0 - parseFloat(cs.paddingBottom);
    const t = e.dataset.t;
    if (e.dataset.gap) return;
    if (t === "p" || t === "bq" || t === "li" || t === "vl") {
      const n = Math.max(1, Math.round((bot - top) / L));
      const sub = "s" + bi, grp = e.dataset.grp || sub;
      for (let k = 0; k < n; k++) A.push({ top: top + k * L, bot: top + (k + 1) * L, bi, sub, grp, k, n, keep: !!e.dataset.keepLast && k === n - 1 });
    } else {
      A.push({ top, bot, bi, sub: "s" + bi, grp: "s" + bi, k: 0, n: 1, keep: !!e.dataset.keep, solid: true });
    }
  });
  // group-level counts for verse groups (each line of a poem may be its own block)
  const gc = {}; A.forEach((a) => { gc[a.grp] = (gc[a.grp] || 0) + 1; });
  const gi = {}; A.forEach((a) => { a.gk = gi[a.grp] = (gi[a.grp] ?? -1) + 1; a.gn = gc[a.grp]; });
  return A;
}
// may a column end after atom i?
function legal(A, i) {
  if (i >= A.length - 1) return true;
  const a = A[i], b = A[i + 1];
  if (a.keep) return false;
  if (a.sub === b.sub) { if (a.k + 1 < 2 || a.n - (a.k + 1) < 2) return false; }
  else if (a.grp === b.grp) { if (a.gk + 1 < 2 || a.gn - (a.gk + 1) < 2) return false; }
  if (i > 0 && A[i - 1].keep && a.n === 1) return false;        // heading + one line at a column foot
  if (i > 0 && A[i - 1].keep && a.k === 0 && a.n >= 1) return false;
  return true;
}
/* ---------- pages ---------- */
const pages = [];   // {kind, el, trim, left?, month?}
function newPg(kind) {
  const pg = $("div", "pg " + kind), tr = $("div", "trim"); pg.appendChild(tr); BOOK.appendChild(pg);
  const o = { kind, el: pg, trim: tr, idx: pages.length }; pages.push(o); return o;
}
const isLeft = (idx) => idx % 2 === 1;           // page 1 (idx 0) is the cover, a right-hand page
const xOf = (idx) => (isLeft(idx) ? OUTER : INNER);

/* lay out one month. post.items carry ii (index) and optional sc (picture scale).
   returns {made, fill, pages, issues}: an issue is a picture that left a hole because it would not fit. */
function layMonth(post, opts) {
  const made = [], issues = [];
  const scale = opts.scale || 1, slack = opts.slack || 0;
  const seq = []; let cur = null;
  const ctx = { scale, riff: post.slug === "november-24" };
  post.items.forEach((it, q) => { if (it.t === "p") { const pv = post.items[q - 1]; it.noindent = !pv || pv.t !== "p"; } });
  for (const it of post.items) {
    const span = it.t === "pull" || isSpanImg(it);
    if (span) { cur = null; seq.push({ span: true, it }); }
    else { if (!cur) { cur = { span: false, items: [] }; seq.push(cur); } cur.items.push(it); }
  }
  M.innerHTML = "";
  for (const s of seq) {
    if (s.span) { const e = spanEl(s.it, scale * (s.it.sc || 1)); M.appendChild(e); snap(e); s.el = e; s.h = e.getBoundingClientRect().height; continue; }
    const gal = $("div"); gal.style.width = COLW + "px"; M.appendChild(gal);
    const els = s.items.map((it) => { const e = block(it, { ...ctx, scale: scale * (it.sc || 1) }); e.dataset.ii = it.ii; return e; });
    els.forEach((e) => gal.appendChild(e));
    spaceAround(els); els.forEach((e) => snap(e));
    s.gal = gal; s.els = els; s.A = atomsOf(gal);
  }
  let pg = null, y = 0, pageBottom = BOTTOM, lastSpan = false;
  const floats = [];          // pull quotes only: a picture never leaves its place in the text
  const open = () => {
    pg = newPg("body"); pg.month = post; made.push(pg); y = TOP; pageBottom = BOTTOM - slack * L; lastSpan = false;
    while (floats.length && placeSpan(floats[0])) floats.shift();
  };
  pg = newPg("body opener"); pg.month = post; made.push(pg);
  // the opener leaves at least 14 lines for the essay to begin on the same page: the picture gives way (ppi only rises)
  let op = opener(post), hcap = 400;
  for (let k = 0; k < 6; k++) {
    op.style.left = xOf(pg.idx) + "px"; op.style.top = TOP + "px"; pg.trim.appendChild(op);
    const over = op.getBoundingClientRect().height + 6 + L - (AREA - (opts.opLines || 14) * L);
    if (over <= 0) break;
    const ih = op.querySelector(".op-art img").getBoundingClientRect().height;
    op.remove(); hcap = Math.max(200, ih - over - 2); op = opener(post, hcap);
  }
  const oh = Math.ceil((op.getBoundingClientRect().height + 6) / L) * L + L;
  y = TOP + oh; pageBottom = BOTTOM - slack * L;
  if (BOTTOM - y < 9 * L) open();
  function placeSpan(s, last) {
    const gapA = y > TOP ? L : 0, room = pageBottom - y - gapA - (s.it.t === "pull" && !last ? 5 * L : 0);
    if (s.h > room) return false;
    y += gapA;
    const el = s.el.cloneNode(true); el.style.position = "absolute"; el.style.left = xOf(pg.idx) + "px"; el.style.top = y + "px";
    pg.trim.appendChild(el); y += s.h; lastSpan = true; return true;
  }
  function placeCols(s, ranges) {
    const x0 = xOf(pg.idx), g0 = s.gal.getBoundingClientRect().top;
    ranges.forEach(([a, b], c) => {
      if (a > b) return;
      const A = s.A, sTop = A[a].top, eBot = A[b].bot;
      const col = $("div", "col"); col.style.left = (x0 + c * (COLW + GUT)) + "px"; col.style.top = y + "px";
      col.style.width = COLW + "px"; col.style.height = (eBot - sTop) + "px";
      const bis = new Set(); for (let q = a; q <= b; q++) bis.add(A[q].bi);
      for (const bi of bis) {
        const src = s.els[bi], r = src.getBoundingClientRect();
        const cl = src.cloneNode(true); cl.style.top = (r.top - g0 - sTop) + "px"; col.appendChild(cl);
        CHECK.push([cl, r.height, post.slug]);
      }
      pg.trim.appendChild(col);
    });
  }
  const holeAt = (s, j, room) => {           // a column ended early because the next piece is a picture
    const A = s.A; if (j + 1 >= A.length || room < 4 * L) return;
    const nx = A[j + 1]; if (!nx.solid) return;
    const e = s.els[nx.bi]; if (e.dataset.t !== "img") return;
    issues.push({ ii: +e.dataset.ii, kind: "col", room, need: nx.bot - nx.top });
  };
  for (const s of seq) {
    if (s.span) {
      if (lastSpan) {}
      if (placeSpan(s)) continue;
      if (s.it.t === "pull") { issues.push({ ii: s.it.ii, kind: "pull" }); floats.push(s); continue; }
      issues.push({ ii: s.it.ii, kind: "span", room: pageBottom - y - L, need: s.h });
      open(); if (!placeSpan(s)) { LOG.push("span too tall " + post.slug); placeSpan(s); }
      continue;
    }
    const A = s.A, iN = A.length - 1; let i = 0;
    while (i <= iN) {
      if (lastSpan) { y += L; lastSpan = false; }
      const R = pageBottom - y;
      if (R < 3 * L) { open(); continue; }
      const t0 = A[i].top;
      let best = null;
      for (let j = i; j <= iN; j++) {
        if (!legal(A, j)) continue;
        const h1 = A[j].bot - t0, h2 = j < iN ? A[iN].bot - A[j + 1].top : 0, h = Math.max(h1, h2);
        // shortest band; on a tie the first column is the longer one
        if (!best || h < best.h - 0.1 || (Math.abs(h - best.h) < 0.1 && h1 > best.h1)) best = { j, h, h1 };
      }
      if (best && best.h <= R + 0.1) { placeCols(s, [[i, best.j], [best.j + 1, iN]]); y += best.h; i = iN + 1; break; }
      let j1 = -1; for (let j = i; j <= iN; j++) if (legal(A, j) && A[j].bot - t0 <= R + 0.1) j1 = j;
