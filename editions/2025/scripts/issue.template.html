<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Aidan Jude — Selected writing 2025</title>
<style>
/* Fonts, all SIL OFL: Instrument Sans + Instrument Serif (Instrument), IBM Plex Mono (IBM). */
@font-face{font-family:IS;src:url(../fonts/InstrumentSans-400.ttf);font-weight:400;font-style:normal}
@font-face{font-family:IS;src:url(../fonts/InstrumentSans-500.ttf);font-weight:500;font-style:normal}
@font-face{font-family:IS;src:url(../fonts/InstrumentSans-600.ttf);font-weight:600;font-style:normal}
@font-face{font-family:IS;src:url(../fonts/InstrumentSans-400Italic.ttf);font-weight:400;font-style:italic}
@font-face{font-family:IS;src:url(../fonts/InstrumentSans-500Italic.ttf);font-weight:500;font-style:italic}
@font-face{font-family:IS;src:url(../fonts/InstrumentSans-600Italic.ttf);font-weight:600;font-style:italic}
@font-face{font-family:ISerif;src:url(../fonts/InstrumentSerif-Regular.ttf);font-style:normal}
@font-face{font-family:ISerif;src:url(../fonts/InstrumentSerif-Italic.ttf);font-style:italic}
@font-face{font-family:Mono;src:url(../fonts/IBMPlexMono-Regular.ttf);font-weight:400;font-style:normal}
@font-face{font-family:Mono;src:url(../fonts/IBMPlexMono-Medium.ttf);font-weight:500 700;font-style:normal}
@font-face{font-family:Mono;src:url(../fonts/IBMPlexMono-Italic.ttf);font-weight:400 700;font-style:italic}
:root{--ink:#111111;--paper:#ffffff;--ground:#2E3A2F;--onground:#F4F1EA}
@page{size:840px 1080px;margin:0}
html,body{margin:0;padding:0}
body{background:#cfcfcf;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#book{display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px 0}
@media print{body{background:none}#book{display:block;padding:0}}
.sheet{width:840px;height:1080px;position:relative;overflow:hidden;background:var(--paper);break-after:page;page-break-after:always}
.sheet.ground{background:var(--ground)}
.trim{position:absolute;left:12px;top:12px;width:816px;height:1056px}
.it{position:absolute;margin:0;color:var(--ink);font-kerning:normal;font-variant-ligatures:common-ligatures;text-rendering:geometricPrecision}
img.it{display:block;object-fit:cover}
img.it.edge{outline:.75px solid #b8b8b8;outline-offset:-.75px}
/* his words */
.body,.li{font:400 14px/20px IS;letter-spacing:.002em;text-align:left;hyphens:manual;text-wrap:pretty}
.split{text-wrap:wrap}
.body b,.li b,.h4 b,.sec b{font-weight:600}
.li{padding-left:var(--ind);box-sizing:border-box}
.li .mk{position:absolute;left:calc(var(--ind) - 16px);top:0;font:400 14px/20px IS}
.li .mk.ol{font:400 11px/20px Mono}
.h4{font:600 14px/20px IS}
/* the rail */
.sec{font:600 14px/20px IS;letter-spacing:-.003em}
.date{font:500 11.5px/20px Mono;letter-spacing:.02em}
.cr{font:400 9.4px/13px Mono;color:#2a2a2a;letter-spacing:.01em}
.cr b{font-weight:500}
.rule{height:0;border-top:.75px solid var(--ink)}
.hr{height:0;border-top:.75px solid var(--ink)}
/* other voices, set off */
.quote{font:italic 400 19px/24px ISerif;letter-spacing:.004em;text-wrap:pretty}
.quote b{font-weight:400}
.pull{font:400 25px/30px ISerif;letter-spacing:.002em;text-wrap:pretty}
.pull b{font-weight:400}
.verse{font:italic 400 19px/24px ISerif;white-space:pre-wrap}
.verse .lead{font:400 14px/24px Mono;white-space:pre}
.attr{font:400 10.5px/16px Mono;letter-spacing:.01em}
.attr b{font-weight:500}
/* structure */
.fo{font:400 10px/12px Mono;letter-spacing:.04em}
.ot{font:500 60px/72px IS;letter-spacing:-.028em}
.os{font:400 17px/23px IS;letter-spacing:-.002em;text-wrap:balance}
.on{font:500 11.5px/20px Mono;letter-spacing:.02em}
.od{font:400 10px/14px Mono;letter-spacing:.03em}
.ct-t{font:500 21px/24px IS;letter-spacing:-.012em}
.ct-s{font:400 13px/18px IS}
.ct-n{font:400 11.5px/24px Mono;letter-spacing:.02em}
.ct-d{font:400 10px/18px Mono;letter-spacing:.03em}
.loc text{font:400 7.5px Mono;letter-spacing:.06em;fill:var(--ink)}
.cov{color:var(--onground);white-space:nowrap}
.mast{font:500 140px/1 IS;letter-spacing:-.035em}
.csub{font:400 14.7px/1 Mono;letter-spacing:.08em}
.cname{font:500 17.3px/1 IS;letter-spacing:-.005em}
.ccount{font:400 12px/1 Mono;letter-spacing:.06em}
#measure{position:absolute;left:-5000px;top:0;visibility:hidden}
#measure .it{position:relative}
</style></head>
<body>
<div id="measure"></div>
<div id="book"></div>

</body></html>
