rature"}, {"t": "p", "v": "“What does it mean that those trees and mountains out there are not magic, but real?”", "cls": "pull"}, {"t": "p", "v": "I’d yell, pointing outdoors.", "cls": "pull"}, {"t": "img", "src": "img/september-25-03.jpg", "w": 1088, "h": 300, "cap": "", "mw": 400, "mh": 440}, {"t": "p", "v": "— Jack Kerouac (Dharma Bums)"}], "mode": "two"}, {"slug": "sept-25-pt2", "title": "SEPT 25 — PT2", "deck": "Upward.", "eyebrow": "September 25, 2025", "mov": "2025", "blocks": [{"t": "img", "src": "img/sept-25-pt2-00.jpg", "w": 2432, "h": 1622, "cap": "", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "||| Foremost |||"}, {"t": "li", "v": "<span class=\"lp\">Cities with no rain.</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\"><em>Nova Eboraca, Columbia, Excelsior.</em></span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\"><em>New York, </em></span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\"><em>America, </em></span>", "ord": false, "n": 1, "d": 2}, {"t": "li", "v": "<span class=\"lp\"><em>Ever Upward.</em></span>", "ord": false, "n": 1, "d": 3}, {"t": "li", "v": "<span class=\"lp\">What is man? </span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">He’s just a collection of chemicals, </span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">with delusions of grandeur.</span>", "ord": false, "n": 2, "d": 1}, {"t": "li", "v": "<span class=\"lp\">— Ayn Rand (Atlas Shrugged)</span>", "ord": false, "n": 1, "d": 2}, {"t": "h3", "v": "Periclean Athens"}, {"t": "li", "v": "<span class=\"lp\">He attends the <strong>Ekklesia</strong> (Assembly) on the Pnyx Hill. Thousands of Athenians gather, sitting on stone benches, as speakers mount the bema to argue policy.</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">If it’s festival season, he heads to the <strong>Theater of Dionysus</strong>. Thousands pack the stone tiers to watch new tragedies or comedies.</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Festivals are constant. <strong>The</strong> <strong>Panathenaia</strong> celebrates Athena with athletic contests and poetry. A grand procession to the Acropolis, carrying a robe for the goddess’ statue.</span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">At home, he eats bread, olives, figs, and fish with his family. Wine is mixed with water at a <strong>symposium</strong>, where friends recline, sing, play games, and debate philosophy late into the night.</span>", "ord": false, "n": 4, "d": 0}, {"t": "img", "src": "img/sept-25-pt2-01.jpg", "w": 2432, "h": 1618, "cap": "vicuna", "mw": 707.5, "mh": 600}, {"t": "h3", "v": "Hegelian Ascetic"}, {"t": "p", "v": "Man is the highest manifestation of the absolute,"}, {"t": "li", "v": "<span class=\"lp\">(thereby art should pay more attention to man).</span>", "ord": false, "n": 1, "d": 0}, {"t": "img", "src": "img/sept-25-pt2-02.jpg", "w": 1388, "h": 2048, "cap": "l3mon", "mw": 707.5, "mh": 600}, {"t": "h3", "v": "Gwen"}, {"t": "p", "v": "She has these bursts in energy", "cls": "lit"}, {"t": "p", "v": "with upward mobility.", "cls": "lit"}], "mode": "one"}, {"slug": "oct-25", "title": "OCT 25", "deck": "Banking, flight, and film exposure", "eyebrow": "October 28, 2025", "mov": "2025", "blocks": [{"t": "img", "src": "img/oct-25-00.jpg", "w": 2432, "h": 1612, "cap": "pavpavych", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "The Big Banks (have only gotten bigger)"}, {"t": "p", "v": "In 2009, we saw the worldwide economy collapse as a result of over-leveraging the American mortgage industry. This was both the fault of 1) regulatory capture and 2) sheer ignorance. In the aftermath, we saw a new wave of oversight brought down upon American financial institutions:"}, {"t": "li", "v": "<span class=\"lp\">The Dodd-Frank Act</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Requires systemically important financial institutions (SIFIs) to hold higher capital buffers and undergo annual “stress tests” to ensure resilience during economic downturns</span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Increases oversight on credit rating agencies — like Moody’s and S&amp;P — which were criticized for their role in assigning inflated ratings to risky securities during the crisis</span>", "ord": false, "n": 2, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Basel III Framework</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">A certain percentage of a bank’s capital must now remain liquid </span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">And there is a now limit on how much can be borrowed against at any given time</span>", "ord": false, "n": 2, "d": 1}, {"t": "p", "v": "Now all of this may sound good. But let’s consider the number of banks\u0001\u0003 \u0004\u0002which\u0001\u0003 fail \u0004\u0002each year:"}, {"t": "img", "src": "img/oct-25-01.jpg", "w": 960, "h": 720, "cap": "", "mw": 707.5, "mh": 600}, {"t": "p", "v": "As well as the number of \u0001\u0003new banks\u0004\u0002 being opened:"}, {"t": "img", "src": "img/oct-25-02.jpg", "w": 960, "h": 720, "cap": "Reference", "mw": 707.5, "mh": 600}, {"t": "p", "v": "So in the aftermath of 2009, we have a large number of banks which have failed. And at the same time, less of them are opening due to an increase in federal regulation. Which means there are fewer and fewer banks controlling more and more of American financials."}, {"t": "p", "v": "Big Tech."}, {"t": "p", "v": "Big Pharma."}, {"t": "p", "v": "Big Oil."}, {"t": "p", "v": "And now Big Banks (which have only gotten bigger)."}, {"t": "h3", "v": "Human Flight (and perspective)"}, {"t": "p", "v": "Do you ever stop and consider what mankind has achieved in the past hundred years? For millennia we crawled, walked, and ran. Never making it higher than the treetops and the cliffs. Then two men obsessed with the mechanics of flight combined the physiology of birds with the industrial motor and created what would ultimately enable our liftoff."}, {"t": "p", "v": "What’s next?"}, {"t": "h3", "v": "Artisans"}, {"t": "p", "v": "Sculptors. Pianists. Master builders and architects."}, {"t": "p", "v": "The long term creatives."}, {"t": "img", "src": "img/oct-25-03.jpg", "w": 724, "h": 658, "cap": "Saint Peter’s Basilica (designed by Michelangelo)", "mw": 707.5, "mh": 600}, {"t": "h3", "v": "Film Exposure"}, {"t": "p", "v": "It all comes down to how much light is needed to activate your film."}, {"t": "h4", "v": "\u0003Low Exposure:\u0004"}, {"t": "img", "src": "img/oct-25-04.jpg", "w": 1818, "h": 1228, "cap": "", "mw": 707.5, "mh": 600}, {"t": "h4", "v": "\u0003Medium Exposure:\u0004"}, {"t": "img", "src": "img/oct-25-05.jpg", "w": 1818, "h": 1228, "cap": "", "mw": 707.5, "mh": 600}, {"t": "h4", "v": "\u0003High Exposure:\u0004"}, {"t": "img", "src": "img/oct-25-06.jpg", "w": 1818, "h": 1228, "cap": "", "mw": 707.5, "mh": 600}, {"t": "p", "v": "It’s a matter of finding the right amount of light,"}, {"t": "p", "v": "to capture what’s in front of you."}], "mode": "one"}, {"slug": "nov-25-draft", "title": "NOV 25", "deck": "No edits.", "eyebrow": "November 15, 2025", "mov": "2025", "blocks": [{"t": "img", "src": "img/nov-25-draft-00.jpg", "w": 2432, "h": 1630, "cap": "h110an", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Plumbing the depths of a feeling,"}, {"t": "img", "src": "img/nov-25-draft-01.jpg", "w": 2432, "h": 1660, "cap": "uncleslow", "mw": 707.5, "mh": 600}, {"t": "h3", "v": "Shooting w/Direction"}, {"t": "li", "v": "<span class=\"lp\">“Smile with your eyes.”</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Blue steel. Sheer cheekbones. Unfazed. </span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Joy (needs to be candid). Get the subject to laugh. </span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Angled. Background first. Subject in minimized foreground. </span>", "ord": false, "n": 4, "d": 0}, {"t": "h3", "v": "Moby Dick"}, {"t": "p", "v": "Everyone laughs when I tell ‘em it’s my favorite book. But the language. It’s like reading something written by James Madison or Thomas Jefferson. Published right after the Revolutionary War. Captures the merriment of America. That pioneer wonder."}, {"t": "img", "src": "img/nov-25-draft-02.jpg", "w": 1500, "h": 974, "cap": "rebekahdepretis", "mw": 707.5, "mh": 600}, {"t": "h3", "v": "Flowers on your doorstep."}, {"t": "img", "src": "img/nov-25-draft-03.jpg", "w": 1857, "h": 2800, "cap": "dormanpeter", "mw": 707.5, "mh": 600}, {"t": "h3", "v": "A Few More Ideas"}, {"t": "li", "v": "<span class=\"lp\"><em>tabula rasa</em></span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">scraped tablet</span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">blank slate</span>", "ord": false, "n": 1, "d": 2}, {"t": "li", "v": "<span class=\"lp\">The 1960s were Greek.</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Positive manifestation. Confidence bespoke confidence. </span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Teaching at a school out in the cornfields,</span>", "ord": false, "n": 4, "d": 0}, {"t": "li", "v": "<span class=\"lp\">shooting film at dusk.</span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Women and their love for horses. Recurrent spirit. </span>", "ord": false, "n": 5, "d": 0}, {"t": "img", "src": "img/nov-25-draft-04.jpg", "w": 2432, "h": 1612, "cap": "jamwonks", "mw": 707.5, "mh": 600}], "mode": "one"}, {"slug": "dec-25", "title": "DEC 25", "deck": "Great authors, market cap, and living with my brother", "eyebrow": "December 10, 2025", "mov": "2025", "blocks": [{"t": "img", "src": "img/dec-25-00.jpg", "w": 739, "h": 957, "cap": "Small Portrait by Kay Sage", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Humanity’s Most Prolific Writers"}, {"t": "p", "v": "In the literature community, it’s widely accepted that Homer, Shakespeare, Milton, and Dante are the most influential writers of all time (setting aside the Bible and its contributors). Whereas when you move into modern times, its an oft-debated subject. In no particular order:"}, {"t": "p", "v": "\u0003James Joyce\u0004 — known for revolutionizing stream-of-consciousness. In the academic community he is often cited as the greatest of all time. Most known for \u0001Ulysses\u0002 and \u0001Dubliners\u0002 (I’d start with \u0001Dubliners\u0002 if interested)."}, {"t": "img", "src": "img/dec-25-01.jpg", "w": 855, "h": 1297, "cap": "", "mw": 400, "mh": 440}, {"t": "p", "v": "\u0003Ernest Hemingway\u0004 — known for his no-frills prose, undeniably influenced a generation of writers. Most known for \u0001The Old Man and the Sea\u0002, but his earlier works are the most touted in the literature community (\u0001A\u0002 \u0001Farewell to Arms\u0002 is essential, but my personal favorite is \u0001The Sun Also Rises\u0002)."}, {"t": "img", "src": "img/dec-25-02.jpg", "w": 779, "h": 980, "cap": "", "mw": 400, "mh": 440}, {"t": "p", "v": "\u0003Herman Melville\u0004 — outside of pious academics (think Harvard and Dartmouth PhDs) Melville is considered to have achieved the greatest work of English literature with \u0001Moby Dick\u0002. Although the French believe \u0001Pierre\u0002 to be the better novel."}, {"t": "img", "src": "img/dec-25-03.jpg", "w": 1461, "h": 1801, "cap": "", "mw": 400, "mh": 440}, {"t": "p", "v": "Notable others:"}, {"t": "li", "v": "<span class=\"lp\">Female wise, Flannery O’Connor (<em>The Violent Bear It Away</em>) and Joan Didion (<em>Play It As It Lays</em>) come to mind</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Post-modernists such as David Foster Wallace (<em>Infinite Jest</em>), Thomas Pynchon (<em>Gravity’s Rainbow</em>), and Cormac McCarthy (<em>Blood Meridian</em>) also make waves</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">And I’ll throw in poets, just because: </span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Shakespeare (obviously)</span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">John Keats</span>", "ord": false, "n": 2, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Percy Shelly</span>", "ord": false, "n": 3, "d": 1}, {"t": "li", "v": "<span class=\"lp\">T.S. Eliot</span>", "ord": false, "n": 4, "d": 1}, {"t": "h3", "v": "Living with my brother"}, {"t": "p", "v": "The interplay of being the older sibling, yet still brothers."}, {"t": "p", "v": "Catch myself making him tea. Offering him books and artwork. Ideas to chew on. Shooting photography with him. Originally as a subject, but more and more wanting his perspective behind the lens. Surprises me with his creativity."}, {"t": "h3", "v": "Sports and Market Cap"}, {"t": "p", "v": "In the MLB, each team is limited by how much their owner is willing to spend (a theme ever present in \u0001Moneyball\u0002). Whereas in the NFL, each team is capped on how much they can spend."}, {"t": "p", "v": "This is why the same two teams always win the world series (the Yankees and the Dodgers). Major market teams. Doting owners. And also why the NFL remains more competitive. Limited cap space. An even playing field."}, {"t": "h3", "v": "Buddhism"}, {"t": "p", "v": "Been growing more interested. The idea of an ego entity, and true inner peace stemming from the removal of self. That all things are interconnected — one and the same. Certainly shared themes with Christianity. But seems less rooted in morality and more in shared experience. Finding a grounded presence."}, {"t": "p", "v": "Something I seek more of in my older age."}, {"t": "h3", "v": "Christmas Plans"}, {"t": "p", "v": "First time hosting, ever in the history of Christmas. Zane and I brainstormed. Formal dress attire. Big tree and warm lights. Drinks from a shaker, full effort."}, {"t": "p", "v": "Never get dressed up anymore. Nostalgic for the 1950s. Watching too much Mad Men."}, {"t": "img", "src": "img/dec-25-04.jpg", "w": 1151, "h": 1536, "cap": "Vogue Gorilla with Miss Harper by Eduardo Paolozzi", "mw": 400, "mh": 440}, {"t": "h3", "v": "The AI Bubble — Further"}, {"t": "p", "v": "Referencing an article from Michael Burry last week:"}, {"t": "li", "v": "<span class=\"lp\"><em>The big target for private credit now is AI data centers and anything inside them or in the immediate vicinity.</em></span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\"><em>Private credit has exploded post-GFC and is non-bank financing. The lenders are generally private credit funds sponsored by the big private equity firms, and the space has grown like a weed because it is lightly regulated. Not usually a good sign.</em></span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\"><em>The big hyperscalers are richer than many countries, so why are they using so much private credit for the development of data centers? That is a very good question.</em></span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\"><em>I’ll give you a hint…there is a duration mismatch of catastrophic proportions between the asset and the loan.</em></span>", "ord": false, "n": 3, "d": 0}, {"t": "h3", "v": "The Ages of Stone, Bronze, Iron (and Steel)"}, {"t": "p", "v": "\u0001This is an essay I wrote a couple years ago — back when I had like 5 people reading this (lol) — but one I often come back to. Wanted to re-share.\u0002"}, {"t": "p", "v": "I stumbled across the ideas of Danish antiquarian Christian Thomsen when reading \u0001A Gentleman in Moscow\u0002. Thomsen organized man and his tools by-use of the three age system. This essentially means to break down the epochs of mankind into three distinct ages. The Age of Stone. The Age of Bronze. The Age of Iron."}, {"t": "p", "v": "The Stone Age was that of a rough and blunted man. Crafting tools and homes from shear rock as a means of survival. Then came the Bronze Age with the discovery of metallurgy. The elite of society fashioning coins and crowns. A furthering of the grandiose few. Of the bourgeois. Finally the advent of the modern age and that of iron. The steam engine, printing press, and gun. A trinity wrought from the efforts of the same bourgeois who lead the Bronze Age — but to egalitarian consequence — for it was the proletariat who ascended this age."}, {"t": "p", "v": "Alas, now we live in a new era. A new age. That of planes, skyscrapers, and rockets. The Age of Steel. Who will rise?"}, {"t": "dept", "v": "Some Literature"}, {"t": "p", "v": "A quote from each of the aforementioned:"}, {"t": "p", "v": "\u0001And then I asked him with my eyes to ask again yes and then he asked me would I yes and his heart was going like mad and yes I said yes I will yes. — James Joyce (Ulysses)\u0002", "cls": "q"}, {"t": "brk"}, {"t": "p", "v": "\u0001Because we would not wear any clothes because it was so hot and the window open and the swallows flying over the roofs of the houses and when it was dark afterward and you went to the window very small bats hunting over the houses and close down over the trees and we would drink the capri and the door locked and it hot and only a sheet and the whole night and we would both love each other all night in the hot night in Milan. That was how it ought to be. - Ernest Hemingway (A Farewell to Arms)\u0002", "cls": "q"}, {"t": "brk"}, {"t": "p", "v": "\u0001“I have heard,” murmured Starbuck, gazing down the scuttle, “that in violent fevers, men, all ignorance, have talked in ancient tongues; and that when the mystery is probed, it turns out always that in their wholly forgotten childhood those ancient tongues had been really spoken in their hearing by some lofty scholars. So, to my fond faith, poor Pip, in this strange sweetness of his lunacy, brings heavenly vouchers of all our heavenly homes. Where learned he that, but there? - Herman Melville (Moby Dick)\u0002", "cls": "q"}], "mode": "two"}, {"slug": "dec-25-pt2", "title": "DEC 25 — PT2", "deck": "Train Dreams.", "eyebrow": "December 27, 2025", "mov": "2025", "blocks": [{"t": "img", "src": "img/dec-25-pt2-00.png", "w": 1049, "h": 720, "cap": "", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Dream Diary"}, {"t": "p", "v": "Sleeping in a cabin with a million other women. Being shown to the top bunk and told “\u0001this is where you sleep\u0002”. A blonde coming to me in the night, “\u0001you’re dreaming\u0002” she says."}, {"t": "img", "src": "img/dec-25-pt2-01.jpg", "w": 1867, "h": 2800, "cap": "oeggen", "mw": 707.5, "mh": 600}, {"t": "h3", "v": "Amazon IQ"}, {"t": "li", "v": "<span class=\"lp\">Automated staffing at outbound dock doors. Optimizing who works where based on inbound volume projections. </span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Package sorters stationed throughout the building. Chutes connecting them via conveyor belts. Complex logical software determines which package goes down which chute.</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\"><strong>Container Builders</strong> at the bottom stack packages</span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Grouping by VSM (visual sortation marker) </span>", "ord": false, "n": 1, "d": 2}, {"t": "li", "v": "<span class=\"lp\">Those with broken labels get sent to problem solve</span>", "ord": false, "n": 2, "d": 2}, {"t": "li", "v": "<span class=\"lp\"><strong>Waterspiders</strong> move pallets to outbound dock doors</span>", "ord": false, "n": 2, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Staging pallets based on projected trailer arrival time</span>", "ord": false, "n": 1, "d": 2}, {"t": "li", "v": "<span class=\"lp\"><strong>Loaders</strong> bring pallets onto trailers</span>", "ord": false, "n": 3, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Organizing them based on delivery stop order</span>", "ord": false, "n": 1, "d": 2}, {"t": "p", "v": "The worldwide marketplace."}, {"t": "h3", "v": "AI —> The Social Media Effect"}, {"t": "p", "v": "Social media is getting better at targeted ads. That’s the clear winner of this AI stuff. A more fine tuned control of content given AI can make anything nowadays. Not only better memes, but better advertisements. Better marketing."}, {"t": "p", "v": "Meta and TikTok capitalizing for profit. Showing the same advertisement/meme/reel to a group of like-minded people. Get ‘em wanting the same product. Ordering the same Christmas gifts."}, {"t": "p", "v": "Why so many of my friends have seen the same memes lately."}, {"t": "h3", "v": "Out West"}, {"t": "p", "v": "Now I gotta tell you all about the romance of Northwest logging,", "cls": "pull"}, {"t": "img", "src": "img/dec-25-pt2-02.jpg", "w": 1440, "h": 980, "cap": "", "mw": 707.5, "mh": 600}, {"t": "p", "v": "like you keep talking about railroading, you shoulda seen the little narrow-gauge railways up there and those cold winter mornings with snow and your belly fulla pancakes and syrup and black coffee, boy, and you raise your doublebitted ax to your morning’s first log there’s nothing like it.", "cls": "pull"}, {"t": "img", "src": "img/dec-25-pt2-03.jpg", "w": 1440, "h": 980, "cap": "— Dharma Bums (Jack Kerouac)", "mw": 707.5, "mh": 600}, {"t": "h3", "v": "with train dreams"}, {"t": "p", "v": "Sometimes he woke to hear the sound of the Spokane International fading up the valley,", "cls": "pull"}, {"t": "img", "src": "img/dec-25-pt2-04.jpg", "w": 1440, "h": 980, "cap": "", "mw": 707.5, "mh": 600}, {"t": "p", "v": "and realized he’d been hearing the locomotive as he dreamed.", "cls": "pull"}, {"t": "img", "src": "img/dec-25-pt2-05.jpg", "w": 1440, "h": 980, "cap": "— Train Dreams (Denis Johnson)", "mw": 707.5, "mh": 600}], "mode": "one"}, {"slug": "nyc", "title": "NYC", "deck": "Texting a buddy.", "eyebrow": "January 22, 2026", "mov": "2026", "blocks": [{"t": "img", "src": "img/nyc-00.jpg", "w": 1078, "h": 728, "cap": "", "mw": 707.5, "mh": 520}, {"t": "p", "v": "Was gonna mention last night, but remember how I was trying to convince you and Zane to take a sporadic trip to NYC? Also asked a couple other friends, but they couldn’t get the time off work."}, {"t": "img", "src": "img/nyc-01.jpg", "w": 1078, "h": 728, "cap": "", "mw": 707.5, "mh": 600}, {"t": "p", "v": "So a couple weeks ago I booked a flight on a Thursday and left that same Saturday lol. Was there Sat-Tues solo."}, {"t": "img", "src": "img/nyc-02.jpg", "w": 1078, "h": 728, "cap": "", "mw": 707.5, "mh": 600}, {"t": "p", "v": "Stayed in a hostel in midtown Manhattan and worked remote from coffee shops. Wandered around upper east/west sides shooting photography."}, {"t": "img", "src": "img/nyc-03.jpg", "w": 1078, "h": 728, "cap": "", "mw": 707.5, "mh": 600}, {"t": "img", "src": "img/nyc-04.jpg", "w": 1078, "h": 728, "cap": "", "mw": 707.5, "mh": 600}, {"t": "p", "v": "Trying out restaurants."}, {"t": "img", "src": "img/nyc-05.jpg", "w": 1078, "h": 728, "cap": "", "mw": 707.5, "mh": 600}, {"t": "img", "src": "img/nyc-06.jpg", "w": 1078, "h": 728, "cap": "", "mw": 707.5, "mh": 600}, {"t": "p", "v": "Was honestly a blast. Such a good reset. And kinda glad I went solo (no offense). Just journaling and reflecting and exploring. Very present. Let the camera lead me around."}, {"t": "img", "src": "img/nyc-07.jpg", "w": 1078, "h": 728, "cap": "", "mw": 707.5, "mh": 600}], "mode": "one"}, {"slug": "feb-26", "title": "FEB 26", "deck": "Journal Entries.", "eyebrow": "February 16, 2026", "mov": "2026", "blocks": [{"t": "img", "src": "img/feb-26-00.jpg", "w": 2432, "h": 1612, "cap": "moongrowl", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Notes from reading Freud"}, {"t": "h4", "v": "Interpretation of Dreams"}, {"t": "li", "v": "<span class=\"lp\">The wishful fantasy of entire nations results in myth. Folk psychology. </span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">All children eventually realize that their mother is certainly their mother (having they came from her body). But the father less certain. </span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">The dreaming of different parents. Those grand-er. Not as a matter of replacing them, but rather to exalt them. Reminiscing over happy times long past. Projected via fantasy. </span>", "ord": false, "n": 3, "d": 0}, {"t": "h4", "v": "\u0003Analyzing Da Vinci\u0004"}, {"t": "li", "v": "<span class=\"lp\">Vasari recounts that in his last hour of life, Leonardo Da Vinci reproached himself for having offended God and mankind by failing in his duty as artist. </span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">The relation between obsessional neurosis and the compulsive nature of trivial activities. </span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Da Vinci loved his mother more than any other woman, thereby homosexual :p</span>", "ord": false, "n": 3, "d": 0}, {"t": "h3", "v": "Gym — Monday"}, {"t": "li", "v": "<span class=\"lp\">Face pulls with a band. </span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Reverse peck deck. </span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Lateral raises. </span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Assisted dips.</span>", "ord": false, "n": 4, "d": 0}, {"t": "h3", "v": "Realization"}, {"t": "p", "v": "Do everything with 10% less internal momentum. You’re constantly giving 100%. Wear yourself out."}, {"t": "p", "v": "And if that still feels overwhelming, give 20% less."}, {"t": "p", "v": "Operate on what you have."}, {"t": "h4", "v": "Further"}, {"t": "p", "v": "Taking care of yourself allows you to operate at higher capacities."}, {"t": "p", "v": "Fall into these cycles where I’m not taking care of myself. Yet giving too much."}, {"t": "p", "v": "Burn myself out."}, {"t": "img", "src": "img/feb-26-01.jpg", "w": 1680, "h": 2800, "cap": "zorki", "mw": 400, "mh": 440}, {"t": "h3", "v": "On a wave is"}, {"t": "p", "v": "more than riding it and recognizing how big or how graceful it is. It’s this state of unhindered presence. No in-moment error correction."}, {"t": "p", "v": "I looked up and saw the birds and thought oh so beautiful."}], "mode": "two"}, {"slug": "mar-25", "title": "MAR 26", "deck": "Hegel, Blood Meridian, and shots from space", "eyebrow": "March 3, 2026", "mov": "2026", "blocks": [{"t": "h3", "v": "Hegelian Ascetic"}, {"t": "li", "v": "<span class=\"lp\"><strong>Subjective spirit</strong>: the individual psyche/<wbr/>mind (consciousness, self-consciousness, reason). </span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\"><strong>Objective spirit</strong>: social practices and institutions (right, morality, ethical life, state) as the public “objectification” of freedom. </span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\"><strong>Absolute spirit</strong>: art, religion, philosophy as cultural modes in which spirit becomes explicitly self-interpreting.</span>", "ord": false, "n": 3, "d": 0}, {"t": "p", "v": "The aim of spirit-as-consciousness is to make appearance match it’s essence."}, {"t": "p", "v": "To raise mere certainty to truth."}, {"t": "h3", "v": "Re-reading Blood Meridian"}, {"t": "p", "v": "\u0001In the morning they crossed a bed of thunderstones clustered on that heath like the ossified eggs of some primal groundbird.\u0002", "cls": "q"}, {"t": "p", "v": "\u0001Beyond the fire it was cold and the night was clear and the stars were falling. The old hunter pulled his blanket about him. I wonder if there’s other worlds like this, he said. Or if this is the only one.\u0002", "cls": "q"}, {"t": "img", "src": "img/mar-25-00.jpg", "w": 799, "h": 800, "cap": "Vessels — Josh Dorman", "mw": 707.5, "mh": 600}, {"t": "h4", "v": "And some discussion on the ending sequence:"}, {"t": "p", "v": "The little girl gone missing at the end, after her bear was killed, was it the judge? Seems related to the judge killing the idiot.\u0005\u0005The Judge preys on children throughout the novel (there are multiple hints and references to missing children whenever he appears). Whenever children disappear in proximity to him, violence follows.\u0005\u0005A child disappears.\u0005The Judge remains.\u0005The Judge dances.\u0005\u0005He survives. The innocent does not.\u0005\u0005The bear and the girl matter symbolically too."}, {"t": "li", "v": "<span class=\"lp\">The bear = something wild, ancient, mythic.</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">It’s reduced to spectacle.</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">It’s shot for entertainment.</span>", "ord": false, "n": 3, "d": 0}, {"t": "h3", "v": "Space"}, {"t": "p", "v": "Clearest photo of Venus ever rendered."}, {"t": "img", "src": "img/mar-25-01.png", "w": 918, "h": 1478, "cap": "", "mw": 707.5, "mh": 600}, {"t": "p", "v": "And our first image of \u0003another\u0004 multi-planet solar system."}, {"t": "img", "src": "img/mar-25-02.png", "w": 680, "h": 680, "cap": "", "mw": 707.5, "mh": 600}], "mode": "one"}, {"slug": "apr-25", "title": "MAR 26 PT2", "deck": "", "eyebrow": "March 24, 2026", "mov": "2026", "blocks": [{"t": "img", "src": "img/apr-25-00.jpg", "w": 1440, "h": 1800, "cap": "", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Top of Mind:"}, {"t": "li", "v": "<span class=\"lp\">Greek philosophy. </span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">The closest understanding we have to the developmental mind. </span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Sourcing of western ideals — Socrates and Plato and Cicero. </span>", "ord": false, "n": 2, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Wanting to do the work lately. Less second guessing. </span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">A reframing of perspective. </span>", "ord": false, "n": 3, "d": 0}, {"t": "img", "src": "img/apr-25-01.jpg", "w": 2432, "h": 1578, "cap": "", "mw": 707.5, "mh": 600}, {"t": "p", "v": "\u0001You left shoes to fill in my heart.\u0002", "cls": "q"}, {"t": "h3", "v": "Many early American intellectuals and founders were influenced by Deism."}, {"t": "p", "v": "\u0003Deism\u0004 is the belief that:"}, {"t": "li", "v": "<span class=\"lp\">A <strong>creator (God)</strong> exists</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">The creator <strong>established natural laws</strong> that govern the universe</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">God <strong>does not intervene</strong> in human affairs through miracles or revelation</span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\"><strong>Reason and observation of nature</strong> — not scripture — are the primary ways to understand God</span>", "ord": false, "n": 4, "d": 0}, {"t": "p", "v": "It emerged strongly during the \u0003Enlightenment (17th–18th centuries)\u0004."}, {"t": "p", "v": "Think of the metaphor commonly used then:"}, {"t": "p", "v": "God as the \u0003watchmaker\u0004 who builds the universe, winds it up, and lets it run.\u0005", "cls": "pull"}, {"t": "img", "src": "img/apr-25-02.jpg", "w": 1200, "h": 804, "cap": "", "mw": 707.5, "mh": 600}], "mode": "one"}, {"slug": "jun-26", "title": "JUN 26", "deck": "All heart.", "eyebrow": "June 14, 2026", "mov": "2026", "blocks": [{"t": "img", "src": "img/jun-26-00.jpg", "w": 1544, "h": 1024, "cap": "", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Genuine Presence"}, {"t": "p", "v": "That feeling when you’re seriously in the moment. Opening up the birdcage in your chest. Everything getting in."}, {"t": "p", "v": "Going for a walk and catching someone experience absolute joy. From a third person perspective. No idea the circumstances, but still hits you in the chest. Walk away with a smile."}, {"t": "p", "v": "Mowing the lawn on a perfect summer day."}, {"t": "p", "v": "Giving your grandpa a hug."}, {"t": "p", "v": "What I aspire to."}, {"t": "h3", "v": "Self Manifestation"}, {"t": "li", "v": "<span class=\"lp\">Worrying about the future, about what could possibly go wrong, takes you away from the present moment (into a realm of concern)</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Whereas thinking positively, <strong>optimistically</strong>, and assuming your actions — when done with genuine kindness and regard for others’ wellbeing — can only bring about good things</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Regaling in the present moment:</span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Remaining _present_</span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">(which may sound a bit hippie/<wbr/>yogi/<wbr/>meditative)</span>", "ord": false, "n": 2, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Is thereby the best way to manifest a vision. </span>", "ord": false, "n": 3, "d": 1}, {"t": "p", "v": "Assume good things are coming. That the world is conspiring in your favor."}, {"t": "p", "v": "This is the way."}, {"t": "p", "v": "My soul can find no staircase to Heaven", "cls": "pull"}, {"t": "p", "v": "unless it be through Earth’s loveliness.", "cls": "pull"}, {"t": "h3", "v": "St. Paul"}, {"t": "p", "v": "Remember when there were small towns in big cities? Where you had neighbors and even a sense of community on your block? Where local dive bars and ice cream parlors were actively frequented?"}, {"t": "p", "v": "This is St. Paul."}, {"t": "p", "v": "I’ve only been here six years, but the sense of community feels like something out of 1920’s Brooklyn. There’s a local baseball team that everyone follows more closely than their MLB counterpart. And catholic churches with their latticed spires and Episcopal run-ins with enormous glass windows casting its penitents in a Godly glow."}, {"t": "p", "v": "Idk. Buying a house brought forth an unforeseen level of community in a world that’s so desperately lacking."}, {"t": "h3", "v": "Journal"}, {"t": "p", "v": "Went on a blind date with a cultural anthropologist last night. From Bosnia. A med student (and so sharp). Very few people who can keep me on my toes."}, {"t": "p", "v": "Got ice cream and went for a walk up Summit. Humid as all hell. Minnesota in July."}, {"t": "p", "v": "Told me bout her parents and the early years. Her Mom getting a care package from the American Red Cross."}, {"t": "p", "v": "“I was a miracle to them.”"}, {"t": "h3", "v": "Journal"}, {"t": "p", "v": "Jack’s wedding. Shooting film after dinner."}, {"t": "p", "v": "Perfect lighting, an interesting venue (and suggestible friends)."}, {"t": "p", "v": "X in that little black thing. The number of times we made uncomfortable eye contact. Both of us mature enough to recognize it couldn’t ever work."}, {"t": "p", "v": "Doesn’t disappear those feelings though."}, {"t": "img", "src": "img/jun-26-01.jpg", "w": 2432, "h": 1512, "cap": "", "mw": 707.5, "mh": 520}], "mode": "two"}, {"slug": "jun-26-pt2", "title": "JUN 26 — PT2", "deck": "", "eyebrow": "June 18, 2026", "mov": "2026", "blocks": [{"t": "p", "v": "It was not necessary to have been even a virtuous man: the wicked man, as well as the good man, became a god; but he retained in the second life all the bad inclinations which had tormented him in the first."}, {"t": "h4", "v": "\u0003The bride was usually placed upon a car; her face was covered with a veil, and on her head was a crown.\u0004"}, {"t": "p", "v": "At Sparta, the legislation of \u0001Lyrurgus\u0002 deprived the man who did not marry of all the rights of citizenship."}, {"t": "h3", "v": "Hydrogen is a highly combustible gas —"}, {"t": "li", "v": "<span class=\"lp\">Operate on your resolutions.</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">The price system is how a society uses knowledge no one possesses in full. Millions of private scraps compressed to single signal. When oil grows scarce, the price rises. </span>", "ord": false, "n": 2, "d": 0}, {"t": "h3", "v": "Dream Diary"}, {"t": "p", "v": "On a remote island chain in the pacific (Caribbean?). There’s an Aussie my age living in a cottage. Under authority of the local baron. Told her I don’t know how to swim."}, {"t": "img", "src": "img/jun-26-pt2-00.jpg", "w": 1873, "h": 2800, "cap": "", "mw": 400, "mh": 440}, {"t": "h4", "v": "\u0003Where is your soul at?\u0004"}, {"t": "p", "v": "The things that passion you present."}], "mode": "two"}, {"slug": "jun-26-pt3", "title": "JUN 26 — PT3", "deck": "", "eyebrow": "June 28, 2026", "mov": "2026", "blocks": [{"t": "img", "src": "img/jun-26-pt3-00.jpg", "w": 1536, "h": 1024, "cap": "", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "How falling into a black hole is reminiscent of retained consciousness in the afterlife"}, {"t": "p", "v": "Black holes imply infinite gravity, a destruction of matter by all counts. But the laws of matter and particles don’t support this. Once a particle gets small enough, it starts acting in peculiar ways. Refuses to break down and starts disappearing. And reappearing in others (quantum entanglement)."}, {"t": "p", "v": "Gravity on the infinite scale applied to matter pushes particles into different space times. Will occasionally run across our fabric and we’ll see a particle blip."}, {"t": "p", "v": "If you fall into a black hole, there are infinite parallel universes you could be projected into. While you could die, there is a higher likelihood that your particles will be compressed in to a random enough stream where you retain self in a different weave of the spacetime."}, {"t": "h3", "v": "Pink Houses"}, {"t": "p", "v": "\u0001Hey, darlin’\u0005I can remember when you could stop a clock\u0002"}], "mode": "two"}, {"slug": "big-sky-journals-1", "title": "Big Sky Journals — 1", "deck": "", "eyebrow": "July 2, 2026", "mov": "2026", "blocks": [{"t": "img", "src": "img/big-sky-journals-1-00.jpg", "w": 1818, "h": 1228, "cap": "", "mw": 707.5, "mh": 520}, {"t": "h4", "v": "June 30"}, {"t": "p", "v": "Out in MT solo. A week ahead of the gang. Staying in a motel in downtown Bozeman. Breakfast from the co-op across the street. Sleeping in late. Waiting for the weather to clear then driving up the mountain. Stopping in fly shops and chatting with the locals. Caught a young brownie, let him slither thru my hand back into the river. Had a rainbow on but lost it when it jumped. Shirtless on some rock from the dawn of time. On the side of that riverbank."}, {"t": "h4", "v": "July 1"}, {"t": "p", "v": "Checked out of the motel. Bookstore and finding a Faulkner I’ve been meaning to read. Go Down Moses. Drove the Gallatin up towards Big Sky, looking for somewhere to fish. Got rained on. Had a trout on the line right as the sun came out. Big brownie. He jumped and I lost him. Smart. So disappointed though. I wanted to take a picture :p"}, {"t": "h4", "v": "July 2"}, {"t": "p", "v": "Camped out last night, smoked a J and listened to the lull of the river. First time I’ve been genuinely bored in a long time. No cell service. No Instagram reels. No Claude."}, {"t": "p", "v": "Instead read some Faulkner from my sleeping bag. Tucked into my tent for the evening. Teriyaki beef sticks and paranoid a grizzly bear was gonna eat my ass."}, {"t": "p", "v": "Slept like shit. But woke at dawn and grabbed an energy drink from Conoco. Pulled off and restrung my rod. Walked down to the river and threw a spoon into the early morning light glancing off the water. Caught 4 rainbow trout in the matter of an hour."}, {"t": "p", "v": "More of this."}], "mode": "two"}, {"slug": "big-sky-journals-2", "title": "Big Sky Journals — 2", "deck": "", "eyebrow": "July 6, 2026", "mov": "2026", "blocks": [{"t": "img", "src": "img/big-sky-journals-2-00.jpg", "w": 1818, "h": 1228, "cap": "", "mw": 707.5, "mh": 520}, {"t": "h4", "v": "\u000307/04\u0004"}, {"t": "p", "v": "Pulled off in a field north of Yellowstone. Sunbathed. Hydrated. Cigarette and Randy Travis."}, {"t": "p", "v": "Take a shower and get ready for live music in Big Sky. Zane and Darren already have beer in the fridge. Thrifted a strapped cooler for $5. Load it up."}, {"t": "p", "v": "Free hot dogs and $2.50 PBRs. A few hundred people. Locals and travelers alike. Dua Lipa and Stevie Wonder on the airwaves. Lots of young people. Parents with kids. Show ‘em how to dance."}, {"t": "p", "v": "Meet a fellow Minnesotan, Riley from Brainerd. Out here workin construction. Doing very well for himself at a young age working in the trades. Double fisting huckberry lemonades all night. Hasn’t learned how to take it slow."}, {"t": "p", "v": "Back to the hotel and the boys just feining. Nitty Gritty Dirt Band on the radio."}, {"t": "p", "v": "Arnold Palmer with ginseng and honey before bed."}, {"t": "p", "v": "Not enough sleep."}, {"t": "h4", "v": "\u000307/05\u0004"}, {"t": "p", "v": "Check out of the hotel and load up the truck. A few hours of fishing."}, {"t": "p", "v": "Keehn lands at 11. Blake and Kenley in from LA. Meet them on the river and fish for another couple hours. They show me their sprinter van. Nomad life."}, {"t": "p", "v": "Head back into town to check-in to the Airbnb. Peyton there waiting — just rolled in. Good timing. Been too long."}, {"t": "p", "v": "Walk down the street and get tacos and tequila. Josey and Alex roll in from Colorado."}, {"t": "p", "v": "The gang’s all here."}, {"t": "h4", "v": "\u000307/06\u0004"}, {"t": "p", "v": "Too little sleep. Too good of a time last night."}, {"t": "p", "v": "Said we’d be up by 5 but you know how that things goes. Out of bed by 6:15. Load up the trucks and head down to the gas station. Breakfast sandwiches and energy drinks get the boys movin."}, {"t": "p", "v": "On the water. Freezing my ass off in waders, but the trout jumping. Pull an 8 inch brown from across stream. Try on the fly rod. Work on my casting. Finding the desired tempo."}, {"t": "p", "v": "A day snatching rainbows."}], "mode": "two"}, {"slug": "big-sky-journals-3", "title": "Big Sky Journals — 3", "deck": "", "eyebrow": "July 10, 2026", "mov": "2026", "blocks": [{"t": "img", "src": "img/big-sky-journals-3-00.jpg", "w": 1818, "h": 1228, "cap": "", "mw": 707.5, "mh": 520}, {"t": "h4", "v": "\u000307/07\u0004"}, {"t": "p", "v": "Golfing in the AM. Peyton and Blake and Kenley 5 under on the front. My group 7 over. Chalk it up to the view. Beautiful distraction."}, {"t": "p", "v": "Back to the Airbnb for a nap. Pack it up and split groups. Zane, Darren, Peyton and I head north and into a slot canyon. Storm Castle on the rise. Find a bend in the creek and spend a couple hours throwing spinners."}, {"t": "p", "v": "Stop at the liquor store on the way back. Reload beer."}, {"t": "p", "v": "Week’s worth of cleaned trout in a frying pan with butter, egg, and flour. Asparagus and baked potatoes and chocolate cake."}, {"t": "p", "v": "The group of us out on that back patio. Food in the center. Passing plates and calling out for what we want. “\u0001More trout.\u0002” “\u0001More potatoes.\u0002”"}, {"t": "p", "v": "Look left and the sky’s gone orange. Family dinner at elevation."}, {"t": "h4", "v": "\u000307/08\u0004"}, {"t": "p", "v": "Load up the truck. Ride Portal Creek 4 miles out with 5 boys in the cab."}, {"t": "p", "v": "Find an old 7Up can from the 1950s. Contemplate its origins."}, {"t": "p", "v": "Throw rocks into the gulley. Aiming for a common log. Boyish behavior."}, {"t": "p", "v": "Say goodbye to Keehn and Josey. Wives back in Wichita await them."}, {"t": "p", "v": "Fish the mouth of Swan Creek. Where the cold outflows meet the Gallatin and caddis rise."}, {"t": "p", "v": "Thunder rumbles and the sky threatens rain."}, {"t": "p", "v": "Double rainbow on the drive home."}, {"t": "h4", "v": "\u000307/09\u0004"}, {"t": "p", "v": "Casting the river and bored after not catching anything for hours and looking up and seeing those mountains and the layered pines and the infinite sky expanse in that Montana road of moon."}], "mode": "two"}, {"slug": "big-sky-journals-4", "title": "Big Sky Journals — 4", "deck": "", "eyebrow": "July 15, 2026", "mov": "2026", "blocks": [{"t": "img", "src": "img/big-sky-journals-4-00.jpg", "w": 1818, "h": 1228, "cap": "", "mw": 707.5, "mh": 520}, {"t": "h4", "v": "07/12"}, {"t": "p", "v": "Out here solo. Peyton back to Fargo. Darren and Zane on a plane back to the cities."}, {"t": "p", "v": "Drove around at dusk. Passed a wedding reception and pulled off on a gravel. The sound of music and people having fun."}, {"t": "p", "v": "Stopped at the gas station and chicken scratched some groceries. Came back to my car and there’s this old white golden retriever sitting in the drivers seat. Drank some Gatorade and listened to some music with him. Just vibing."}, {"t": "h4", "v": "07/13"}, {"t": "p", "v": "Wandering around fishing and drinking electrolytes and long mountain shadows down the canyon."}, {"t": "h4", "v": "07/14"}, {"t": "p", "v": "14 hours on the road. Some music and podcasts and phone calls — but mostly silence and meditation. Empty the brain."}, {"t": "p", "v": "Felt like forever getting to North Dakota but then Minnesota creeps up quick. Past Fargo and into the northern heartland and the rich green. Ponds and lakes left and right."}, {"t": "p", "v": "Home again."}], "mode": "two"}, {"slug": "aug-26", "title": "AUG 26", "deck": "Early bird gets the worm.", "eyebrow": "August 4, 2026", "mov": "2026", "blocks": [{"t": "img", "src": "img/aug-26-00.jpg", "w": 1000, "h": 1348, "cap": "Evening Song , 1938 by Franz Sedlacek", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Lucid Dreaming"}, {"t": "p", "v": "The general idea is that whenever you wake from a dream you write it down. Whatever you can remember. And then before bed each night, you re-read your “dream diary” with the intent of priming your subconscious. To make it easier to fall back into said dreams."}, {"t": "h4", "v": "\u0003Here’s a real dream I had — \u0004"}, {"t": "p", "v": "I’m standing waist deep in snow atop a mountain ridge in the middle of the night. Below me is a cabin. I make my way down and knock on the door. An old woman opens. She lets me in. Rows-upon-rows of bunk beds. She leads me to the far corner of the lot. \"This is where you sleep.” I climb into the top bunk and fall asleep. In the middle of the night, I’m awoken by a young girl with blonde hair looking up at me"}, {"t": "p", "v": "— \u0003“you’re dreaming” she says.\u0004 And then I woke up."}, {"t": "h3", "v": "[X] Apply For Research Grant"}, {"t": "p", "v": "These are formalized CTAs (call to action) for proprietors. That signal what the government thinks the workforce should be investing in. The \u0003ACL Caregivers Grant\u0004 for example. Build something to benefit aging caregivers. The people who are taking care of elderly people. It’s a research award for incentivized work. And the back door here is that either 1) no market exists or 2) a smaller market with less variables DOES exist. Which is fine — it’s easier to control. Too many infinite markets exist in today’s world. Reels is an infinite market for example. Every moment something better comes along. Trying to compete here is impossible because there is no margin. Everyone must grind their niche the hard way. But if you move down to a smaller market, less supply and demand, those problems tend to be more specific and thereby easier to solve. Feels akin to Game Theory. Stand in the market square and be sold too every 10 seconds? Or go down an alleyway and find a smaller market. Zoom in."}, {"t": "p", "v": "Made possible by sativa."}, {"t": "h3", "v": "I just did long division in my head and I had to check with a calculator and turns out I was right and I don’t even remember how I solved it. Brain just flipped a switch and inference-d. Returned the answer without me having to know the details. Impressed myself. It was “2156 people have viewed your Instagram Ad and 26 have clicked into your website. What is your conversation rate?” Which is 26 / 1067 = 2.43%. I looked at the two numbers and my brain just grokked the answer and I was like damn bro."}, {"t": "p", "v": "Dear Professor Olsen-Smith and the \u0001Melville’s Marginalia Online\u0002 team,"}, {"t": "p", "v": "I’m a longtime Melville reader, and I wanted to write and say thank you. I recently discovered \u0001Melville’s Marginalia Online\u0002 while revisiting Shakespeare’s tragedies, and finding it turned something I already knew in the abstract — that Melville marked up his own Shakespeare heavily while writing \u0001\u0003Moby-Dick\u0004\u0002 — into something I could actually see: his pencil, his handwriting, his “\u0001Terrific\u0002!” scrawled next to Cornwall’s line right before Gloucester is blinded in \u0001\u0003King Lear\u0004\u0002. That’s an extraordinary thing to have made freely available, and I don’t think projects like this get told often enough how much they matter to someone outside the academy."}, {"t": "p", "v": "I got curious enough to build something with it. Using your public XML archive for Volume 7 alongside Folger’s free digital text of \u0001\u0003King Lear\u0004\u0002, I put together a personal, print-ready edition of the play with Melville’s actual marks reproduced in the margins at the lines where he made them — his underlines and scores rendered as marginal marks, and his three written comments as sidenotes."}, {"t": "p", "v": "Thank you for making this material public. It has changed how I read the play."}, {"t": "p", "v": "Best,"}, {"t": "p", "v": "Aidan."}], "mode": "two"}, {"slug": "aug-26-aa5", "title": "AUG 26 — PT2", "deck": "I have to resist the West Virginia urge to drive around and smoke cigarettes in my car.", "eyebrow": "August 27, 2026", "mov": "2026", "blocks": [{"t": "img", "src": "img/aug-26-aa5-00.jpg", "w": 817, "h": 1080, "cap": "Timoclea Kills the Captain of Alexander the Great, 1659 — Elisabetta Sirani", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Fine-tuned AI Build"}, {"t": "p", "v": "Share an interactive AI working session with a potential customer. One that we have preloaded with their data (everything we have on them) and a list of tools (eg. skills) that they can invoke in-browser to get started. Once in the browser, they are entirely running on Anthropic API token cost (which I am footing the bill for). But we kickstart their session with our DuckDB / substrate data. And the skills don’t have access to call our DB in real time, but it’s enough data to get the user started. And then they can take the working session where they want. I could see that working off an Ad. Make them simply enter a number to run a skill on their business and they are immediately impressed by its usefulness. And dive deeper or pose their own custom question. Pre-loaded with structured data we have on them so it has something useful to start with. And access to Anthropic SDK native tooling like web search as it branches off from our basis."}, {"t": "p", "v": "This allows us to 1) get something in front of business owners they can immediately use and 2) track what they do, what their sessions encodes (eg. the problems SMB owners are working on) and 3) what data they need us to mine custom for them, to make the base AI model we offer at session start even better and useful from the jump to them. And we can always make $$ off a product like this. Allow so many free messages per day kinda thing."}, {"t": "p", "v": "I want you to scope this build as a new design. And keep in mind we have an MCP now. It might be worth incorporating that methodology into our build out. The MCP that undergirds this product can be used to optimize our base AI. And we iteratively open-source (or at some point charge) for the MCP too."}, {"t": "p", "v": "For now though, everything is free. I want to build it out, test it, and then run a new Meta Ad in NYC or LA that advertises “\u0001Try our custom new AI!\u0002”"}, {"t": "img", "src": "img/aug-26-aa5-01.jpg", "w": 1080, "h": 806, "cap": "Untitled (Le Quai des brumes) — Francine van Hove", "mw": 400, "mh": 440}, {"t": "h3", "v": "Call her. A dating app."}, {"t": "p", "v": "After every first date you journal about it in this new dating app. You post it. Your buddies can subscribe and they get to comment on your first date experience. Hold you accountable and give real feedback. The creator is allowed to give one update on what he ended up doing — eg. “what happened”. But it’s for small groups. Just your buddies. The 2 people you let in. Or the 5. Geared at improving dating. To go for it. And I think it’s a good exercise in general — journaling. Helps me empty my brain. What do the people think? Download the Substack app and give me feedback — reply to this post in the comments."}, {"t": "p", "v": "I wanna fuel creative discourse, is truly what I’m realizing here.I should just post my first date experiences here on Substack and ask my community what they think. Upvote or downvote 😂 But would want to avoid that becoming toxic. Or reflecting poorly on the other because it’s public, and anyone can read it. Which is why I need somewhere to have small group discussions. And dating is the perfect case study for this concept!!🦕"}, {"t": "p", "v": "I think the author of the “first date experience” should have to post it, and be locked out for 2 weeks before they can give the “what happened” — to avoid the scenario where his buddies talk him out of it in-the-moment (in my mind, that is what makes “are we dating the same guy” so toxic…it’s negatively minded)."}, {"t": "p", "v": "Platform is free. For public benefit. I could host it for free on Vercel and Notion. It’s not about the money. It’s about incentivizing men to “call the damn girl back.” I feel like this is common amongst my friends, girls I know who can’t go on more than a date or two at a time. And it’s this same reason, men aren’t initiating enough. It’s not that you have to ask every girl out, it’s that when you do wanna ask a girl out you should just do it."}, {"t": "p", "v": "Which is why I called."}, {"t": "img", "src": "img/aug-26-aa5-02.jpg", "w": 1021, "h": 1400, "cap": "theopisti_p", "mw": 400, "mh": 440}, {"t": "h4", "v": "\u0003How do you get people back into reading? I can only describe my own experience. 10th grade English class with Mr Young’s and reading JD Salinger’s The Catcher in the Rye. Changed my perspective on reading. Not for entertainment, but for spiritual exploration.\u0004"}, {"t": "p", "v": "Fast forward and I’m 20 and move to London to study abroad and fall headlong into infinite free time in the cultural hubcap of the world — city-center London. 4 days a week I’d walk the Thames to class and stop by the book vendor under the bridge. Find a new paperback from an author I’d been exploring. Take their ideas back to my dorm room for examination."}, {"t": "p", "v": "In these 6 months I read Steinbeck, Joyce, Fitzgerald, Nietzsche and explored 1800s romantic poetry with Keats, Shelley, and Lord Byron. Like drinking world culture through a spigot. And to a young mind, instrumental."}, {"t": "p", "v": "To this day I try and read consistently. Not as good about it as I once was, but still tackle 15-20 difficult books every year."}, {"t": "brk"}, {"t": "h4", "v": "\u0003I have to quit my job this week. And go unemployed until I become a millionaire.\u0004"}, {"t": "p", "v": "I’m sick of the parachute. The safety net always underneath me."}, {"t": "p", "v": "I need 5k a month in expenses and no way to pay it. THATS WHAT I TRULY NEED. Force myself to operate in a survival mindset."}, {"t": "p", "v": "Every time in my life when I have been pushed to the brink, where I’ve had impossible weight to carry — I’ve delivered. Can carry incredible weight, but my load is light these days working a cushy tech job. Sitting behind a computer all day."}, {"t": "p", "v": "NO LONGER."}, {"t": "p", "v": "I want all the pressure. I wanna see my savings hit 0."}, {"t": "p", "v": "Too long since last tested."}], "mode": "two"}, {"slug": "sept-26", "title": "SEPT 26", "deck": "Gotten so good at texting and driving that I’ve forgotten how to do math", "eyebrow": "September 16, 2026", "mov": "2026", "blocks": [{"t": "img", "src": "img/sept-26-00.jpg", "w": 1170, "h": 756, "cap": "malik_", "mw": 707.5, "mh": 520}, {"t": "p", "v": "Did I request thee, Maker, from my clay"}, {"t": "p", "v": "To mould me man? Did I solicit thee"}, {"t": "p", "v": "From darkness to promote me?"}, {"t": "p", "v": "— Milton, Paradise Lost", "cls": "q"}, {"t": "p", "v": "Cheap motels and conversations with strangers in small towns in the outskirts of British Columbia. That wild goddess steeped in billowing robes on the far corner of the new world."}, {"t": "p", "v": "— Aidan", "cls": "q"}, {"t": "p", "v": "She said she wasn’t ready to settle down and I sure as hell woulda liked to talk it out but she got in her car and drove off and that’s the last I seen her."}, {"t": "p", "v": "— Ryan (Welsh bricklayer I met last night)", "cls": "q"}, {"t": "p", "v": "I carried her over my shoulder"}, {"t": "p", "v": "Cause she was barefoot and we were crossing some brush on our way down to the river."}], "mode": "two"}, {"slug": "canadian-contiki", "title": "Canadian Contiki", "deck": "Travel Vlog", "eyebrow": "September 24, 2026", "mov": "2026", "blocks": [{"t": "img", "src": "img/canadian-contiki-00.jpg", "w": 1818, "h": 1228, "cap": "", "mw": 707.5, "mh": 520}, {"t": "h4", "v": "\u0003Sept 14th\u0004"}, {"t": "p", "v": "Whistler Village talking to Clare about photography and quitting my job and asking if I can take her photo."}, {"t": "p", "v": "First day on the trip and met probably twenty new people and at the bar and seeing new people and not knowing who who to talk to and surrounded by Aussies. They are everywhere and know how to drink far better than I do. And how to have non-chalant conversations and frankly in some ways I don’t know how to talk anything but chalant. Wondering if I’m being the downer but also just recognizing that is my energy right now. And sitting and talking to Peyton earlier this week and him living vicariously through me. And others coming up to me because I’m alone and quiet and assuming something is wrong but in reality this is the closest I can be to being myself."}, {"t": "p", "v": "Trying not to make eye contact with the girl across the bar. Wondering if she’s thinking what I’m thinking which is in reality nothing. Emptiness and sitting in silence my version of recovering. Even in a packed room filled with 75 Aussies and loud techno music and the couple next to me drinking and hugging and me not knowing what to do."}, {"t": "p", "v": "Interesting posting book recs on Instagram the other day and people unexpectedly engaging with them."}, {"t": "p", "v": "Is being pensive and writing at the bar on the first day of the trip a red flag? Hopefully not. Then again how someone perceives me is not within my control."}, {"t": "p", "v": "Sitting on the bus and talking to Fran:"}, {"t": "img", "src": "img/canadian-contiki-01.jpg", "w": 2100, "h": 2800, "cap": "", "mw": 400, "mh": 440}, {"t": "p", "v": "and looking up at the sky and taking a micro exit from the conversation. Not because I needed to but because I wanted to."}, {"t": "p", "v": "Two drinks at dinner and wanting a third but also realizing that’s like a caged elephant. Brain like a bag of cats sometimes. Not realizing who or what or when is going on."}, {"t": "p", "v": "Aussies come to Whistler ahead of the ski season. That’s why there are so many of them. This is like a college town for Aussies. Come here to adventure and spend money."}, {"t": "p", "v": "Being accepted by the group is primal behavior."}, {"t": "brk"}, {"t": "h4", "v": "\u0003Sept 16th\u0004"}, {"t": "p", "v": "Standing on train tracks facing west wondering when it’s gonna come round the corner but also aware enough to realize we’d have plenty of time to jump if so."}, {"t": "p", "v": "Periodically forget how to have an edge. Or rather unaware that I do and just being present to the point where I’m not moment-to-moment cognizant of it."}, {"t": "p", "v": "Cheap motels and conversations with strangers in small towns on the outskirts of British Columbia. That wild goddess steeped in billowing robes on the far corner of the new world."}, {"t": "p", "v": "“\u0001She said she wasn’t ready to settle down and I sure as hell woulda liked to talk it out but she got in her car and drove off and that’s the last I seen her.\u0002” — Ryan"}, {"t": "img", "src": "img/canadian-contiki-02.jpg", "w": 2100, "h": 2800, "cap": "", "mw": 400, "mh": 440}, {"t": "h4", "v": "\u0003Sept 17th\u0004"}, {"t": "p", "v": "Karaoke last night and chatting with Morgan and Jasmine and about quitting our jobs and hitting the road and living for a destination rather than a job itself. Them young and wiser in many ways than even I."}, {"t": "p", "v": "Thomas:"}, {"t": "img", "src": "img/canadian-contiki-03.jpg", "w": 1818, "h": 1228, "cap": "", "mw": 707.5, "mh": 520}, {"t": "p", "v": "singing \u0001Airplanes\u0002. And \u0001Teenage Dirtbag\u0002. And some random stranger singing \u0001Hey There Delilah\u0002 and he and I having a good harmonization. Chatting with Maddy afterwards and carrying Pooh Bear around like they were my own infant child under arm and Maddy texting me because she doesn’t want him to get lost and I never even considering the possibility of such a thing."}, {"t": "img", "src": "img/canadian-contiki-04.jpg", "w": 1150, "h": 1994, "cap": "", "mw": 400, "mh": 440}, {"t": "p", "v": "And that old timer outside the hotel before I had went out telling me about his 25 years in Jasper and coming reaching distance to a grizzly in the night and being scared out of his wits and how he bummed me a cigarette and we shook hands and sent me on my way with his blessing."}, {"t": "p", "v": "And dinner with Tayla and Hannah."}, {"t": "p", "v": "And wanting to tell her to slow down and look up and enjoy it. That life is short and beautiful and how I appreciated that moment and all others in the my short expanse of time and in the grand turnings of the world."}, {"t": "p", "v": "And here with my phone dying and 5 hours of sleep and caffeine and a cigarette withstanding me. Propping me upright in the beams. Sturdy in the uprights. And that cold mountain air making its way in and out through my lungs."}, {"t": "p", "v": "The fountainhead. Penultimate. No further propellant. Acceleration hits zero before dispersement and outward expulsion. Contrary to my initial impression of the concept. You’d expect it to be the finality of the thing in which brings about its paramount success."}, {"t": "brk"}, {"t": "h4", "v": "\u0003Sept 18th\u0004"}, {"t": "p", "v": "Blue hour in Jasper. Bags to coach. Didn’t sleep at all last night it felt like. Ragweed pollen been killing me the last couple days and I not doing a proper accounting of self."}, {"t": "p", "v": "I told her she was very beautiful. When she stopped me and asked to smoke. And standing on that street corner under the billowing robes of Canadian Columbia I wanted to kiss her. And here I stand hoping she comes my way. That she wants to kiss under the full moon too many drinks deep but like magnets pulled to one another."}, {"t": "brk"}, {"t": "h4", "v": "\u0003Sept 19th\u0004"}, {"t": "p", "v": "Via Ferrara today. Early morning out of the chalet and down the mountain in the Banff dawn and find the bus stop and Kasey and I wait in line and order some food. Run cross the street and into the shuttle and up the mountain and meet our guide and gear up and go up the ski lift and take the practice wall and learn the hitching mechanism and walking the wall and up into sheer cliff-face we go and Craig and Brooke behind me. Thomas and Laura in front. Lots of great photos and the mid morning dawn shining into the Banff Valley. Cornering the cliff face and steeping the climbers in the soft light."}, {"t": "img", "src": "img/canadian-contiki-05.jpg", "w": 1818, "h": 1228, "cap": "", "mw": 707.5, "mh": 520}, {"t": "h4", "v": "\u0003Sept 22nd\u0004"}, {"t": "p", "v": "What if I told you you were strong. And that you had your shit together. Like truly. And that you sitting outside and feeling overwhelmed was simply the moment before you rose to your occasion."}, {"t": "p", "v": "Had this random guy come up to me with his notebook when standing outside the club and ask “\u0001What is something beautiful?\u0002” and I replied:"}, {"t": "p", "v": "Looking upward.", "cls": "pull"}, {"t": "p", "v": "Background and foreground.", "cls": "pull"}, {"t": "p", "v": "Great moments with great people.", "cls": "pull"}, {"t": "p", "v": "And he wrote it down and I told him what a great concept and he read me a random page and told me how he is addicted to asking random people this question. And how it has truly changed his life."}, {"t": "p", "v": "What a wonderful concept."}, {"t": "brk"}, {"t": "h4", "v": "\u0003Sept 23rd\u0004"}, {"t": "p", "v": "It’s not goodbye it’s see you later."}, {"t": "p", "v": "3min and breathing through my mouth has helped but I’m still sick to my brain. Weaving in and out of Vancouver traffic and ready to be sitting at my gate and passed out on the plane. Body has had too much. The falling of the waterfall from the top of the fountain."}, {"t": "p", "v": "Hungover and on a plane home. Think everything just clicked. All of it. Two weeks on the road surrounded by foreign people and uncertain situations and I lived it. Never been so present. Not looking backwards nor forwards. No overthinking. Just did it."}, {"t": "p", "v": "Shook the rust off."}], "mode": "two"}, {"slug": "oct-26", "title": "OCT 26", "deck": "Being well read, computers and language, and remembering with my grandfather", "eyebrow": "October 15, 2026", "mov": "2026", "blocks": [{"t": "img", "src": "img/oct-26-00.jpg", "w": 1816, "h": 1644, "cap": "The Golden Bear Days — Al Columbia", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Taking an idea to it’s root."}, {"t": "p", "v": "Friend of mine asked what I read, and I told her I don’t read anything written after 1950 (most of the time). And while she was taken aback, my reasoning is that the majority of modern ideation is built atop older ideas. And the only way to tell whether something is worth reading is whether it has stood the test of time."}, {"t": "p", "v": "Modern writers will harp on technology. The machine. How its condemning us all to life of meaninglessness and a disconnect from the natural world. Which is entirely true (at least in part). But when I read all these modern opinions all I can hear is Marx — “\u0001the people must control the means of production\u0002” (not the oligarchs) — or Emerson. Thoreau. Wendell Berry. All of whom who make brilliant arguments for a life rooted in the natural world."}, {"t": "p", "v": "Frankly — I wish I wasn’t half this well-read sometimes. Makes it hard to find something that really blows my hair back. But I wouldn’t trade it. Just makes the reward that much more."}, {"t": "img", "src": "img/oct-26-01.jpg", "w": 2800, "h": 2166, "cap": "Mark Tansey — Shades", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Computers and Language"}, {"t": "p", "v": "The earliest machines (computers) were programmed in binary. 0s and 1s. Then we graduated to assembly. Routines and loops and rudimentary decision logic. Up to C /C++ and the modern compiler. Which allowed computer programmers to write code in an \u0001almost\u0002 readable way. Unto Python and other modern languages that are even-more human legible."}, {"t": "p", "v": "But now we’ve hit the epitome of computational instruction. Describe what you want in natural human language and the AI does the rest. It writes the code, the compiler distills it down into assembly and binary. The thing gets built and you don’t even need to know what’s going on under the hood. Eg. “vibe coding”."}, {"t": "p", "v": "Tbh though, this is the way I’ve wanted to work with computers my whole life. Having to know how to write code was just a means to an end. All I ever wanted to do was build (never learn a complex technical language)."}, {"t": "p", "v": "\u0001Aetas nova\u0002"}, {"t": "img", "src": "img/oct-26-02.jpg", "w": 2432, "h": 1612, "cap": "Circus with lomochrome — elenesh", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "More romance."}, {"t": "p", "v": "Flowers for your girl friend. Flowers for the stranger you passed on the way home. Flowers for everyone."}, {"t": "p", "v": "Telling her she’s beautiful simply because it’s true."}, {"t": "p", "v": "Autumn nights and oak trees with yellow leaves."}, {"t": "img", "src": "img/oct-26-03.jpg", "w": 1818, "h": 1228, "cap": "Shot this off I35 south of Duluth", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Remembering (with my grandfather)."}, {"t": "p", "v": "Spent Labor Day out at my grandparent’s place. My grandma and mom and sister were all in Nashville on vacation. So it was just grandpa and I (and the dogs, cats, chickens, goats, horses, cows, and bees on their hobby farm in western Wisconsin)."}, {"t": "p", "v": "Three hours at the kitchen table picking my grandfather’s brain. Asking him about his parents. How they met. Where they came from. What they told him about the old country (back in Norway)."}, {"t": "p", "v": "And it was funny, because I could tell that no one had asked him these things in many years. My grandfather such a present person that when I see him pause and get lost in thought it’s an uncommon thing."}, {"t": "p", "v": "At one point, he recounted this memory about my great grandfather:"}, {"t": "p", "v": "“\u0001He’d\u0002 \u0001always talk about them horses…back before tractors…tending to them and hitching the plow and working the land.”\u0002", "cls": "pull"}, {"t": "p", "v": "Such a foreign thought."}, {"t": "p", "v": "I too was raised on a farm — but in the modern age — grew up around tractors and automatic milking equipment. Sure, I can throw a bale of hay like the rest of ‘em. But I ain’t ever hitched no plow behind no horse. Hands on that hickory plow handle run ragged in the August heat. But I sure woulda liked to. To know what it felt like being a man in that day and age."}, {"t": "img", "src": "img/oct-26-04.jpg", "w": 2800, "h": 1857, "cap": "", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "A Few More Ideas — "}, {"t": "li", "v": "<span class=\"lp\">35mm camera reviews <a class=\"url\" href=\"https://randomaidan.substack.com/p/35mm-camera-reviews\" target=\"_blank\" rel=\"noopener\">randomaidan.substack.com/p/35mm-camera-reviews</a></span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">35mm film reviews <a class=\"url\" href=\"https://randomaidan.substack.com/p/35mm-film-reviews\" target=\"_blank\" rel=\"noopener\">randomaidan.substack.com/p/35mm-film-reviews</a></span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Business prototypes <a class=\"url\" href=\"https://randomaidan.substack.com/p/business-prototypes\" target=\"_blank\" rel=\"noopener\">randomaidan.substack.com/p/business-prototypes</a></span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">This month’s reading excerpts <a class=\"url\" href=\"https://randomaidan.substack.com/p/reading-excerpts\" target=\"_blank\" rel=\"noopener\">randomaidan.substack.com/p/reading-excerpts</a></span>", "ord": false, "n": 4, "d": 0}], "mode": "two"}, {"slug": "oct-26-pt2", "title": "OCT 26 — PT2", "deck": "", "eyebrow": "October 17, 2026", "mov": "2026", "blocks": [{"t": "p", "v": "The derivative of your forward momentum in time,", "cls": "disp   contents.insertAdjacentHTML('beforeend',`<div class="tx"><div class="eyebrow">Contents</div><div class="toc-list">${secs.slice(0,2).map(tocSec).join('')}</div></div>`);
  contents2.insertAdjacentHTML('beforeend',`<div class="tx"><div class="eyebrow">&nbsp;</div><div class="toc-list">${secs.slice(2).map(tocSec).join('')}</div></div>`);
  $('#toc').innerHTML=`<h5>Contents</h5><a href="#p1" data-p="1"><b>1</b><span>Cover</span></a><a href="#p2" data-p="2"><b>2</b><span>Contents</span></a>`+secs.map(s=>`<h5>${esc(s.m.num)}</h5>`+s.items.map(f=>`<a href="#p${firstPage[f.slug]}" data-p="${firstPage[f.slug]}"><b>${firstPage[f.slug]}</b><i>${esc(f.title.replace(/[\u0001-\u0004]/g,''))}</i></a>`).join('')).join('')+`<h5>&nbsp;</h5>`+(firstPage['references']?`<a href="#p${firstPage['references']}" data-p="${firstPage['references']}"><b>${firstPage['references']}</b><span>References</span></a>`:'')+`<a href="#p${pages.length}" data-p="${pages.length}"><b>${pages.length}</b><span>Back cover</span></a>`;
  window.__pieces=pages.map(p=>p.dataset.piece||p.className);
}
/* ---- the reader ---- */
const view=$('#view'),spread=$('#spread'),pg=$('#pg'),prev=$('#prev'),next=$('#next'),toc=$('#toc'),tocbtn=$('#tocbtn');
let spreads=[],cur=0,twoUp=null,zoomed=false,fitSc=1,fitLeft=0,fitTop=0;
function layout(){
  const w=innerWidth;const two=w>=900;
  if(two!==twoUp){twoUp=two;const keep=currentFirstPage();spreads=[];if(two){spreads.push([0]);for(let i=1;i<pages.length;i+=2)spreads.push(i+1<pages.length?[i,i+1]:[i]);}else{pages.forEach((_,i)=>spreads.push([i]))}cur=spreads.findIndex(s=>s.includes(keep));if(cur<0)cur=0;}
  render();
}
function currentFirstPage(){return spreads[cur]?spreads[cur][0]:0}
function render(keepScroll){
  while(spread.firstChild)store.appendChild(spread.firstChild);
  if(twoUp&&zoomed)zoomed=false;view.classList.toggle('zoomed',zoomed);
  const s=spreads[cur];const W=s.length*PW;
  s.forEach(i=>spread.appendChild(pages[i]));
  const barH=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--bar'));
  const availW=innerWidth-(twoUp?96:12),availH=innerHeight-barH-18;
  fitSc=Math.min(availW/W,availH/PH);fitLeft=(innerWidth-W*fitSc)/2;fitTop=(availH-PH*fitSc)/2+9;
  spread.style.width=W+'px';spread.style.height=PH+'px';spread.style.position='absolute';spread.style.left='0';
  if(zoomed){// reading size: one column (plus its margin) fills the screen width
    const sc=zoomSc();spread.style.transform=`scale(${sc})`;spread.style.marginLeft='0';spread.style.top='0';if(!keepScroll){view.scrollLeft=0;view.scrollTop=0}
  }else{spread.style.transform=`scale(${fitSc})`;
  // centre: transform-origin top-left, so offset via margins
  spread.style.marginLeft=fitLeft+'px';spread.style.top=fitTop+'px';}
  const nums=s.map(i=>i+1);pg.textContent=(nums.length>1?`pp. ${nums[0]}–${nums[1]}`:`p. ${nums[0]}`)+` / ${pages.length}`;
  prev.disabled=cur===0;next.disabled=cur===spreads.length-1;
}
function go(n){if(n<0||n>=spreads.length)return;cur=n;render()}
// reading size: the single 708 px measure fills the screen width
function zoomSc(){return innerWidth/730}
function setZoom(on,cx,cy){if(twoUp||on===zoomed)return;
  const barH=view.getBoundingClientRect().top;
  // keep the tapped point of the page under the finger
  const px=(cx-fitLeft)/fitSc,py=(cy-barH-fitTop)/fitSc;zoomed=on;render(true);
  if(on){const sc=zoomSc();view.scrollLeft=Math.round(37*sc);view.scrollTop=Math.max(0,py*sc-(cy-barH))}}
function goPage(p){const i=spreads.findIndex(s=>s.includes(p-1));if(i>=0)go(i);toc.hidden=true;tocbtn.setAttribute('aria-expanded','false')}
prev.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')go(cur+1);else if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1);else if(e.key==='Escape'){toc.hidden=true}});
let tx=null,ty=null,pinch=0;const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
view.addEventListener('touchstart',e=>{if(e.touches.length===2){pinch=dist(e.touches);tx=null;return}tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
view.addEventListener('touchmove',e=>{if(!pinch||e.touches.length!==2)return;const r=dist(e.touches)/pinch,mx=(e.touches[0].clientX+e.touches[1].clientX)/2,my=(e.touches[0].clientY+e.touches[1].clientY)/2;
  if(r>1.15&&!zoomed){setZoom(true,mx,my);pinch=0}else if(r<.87&&zoomed){setZoom(false);pinch=0}},{passive:true});
view.addEventListener('touchend',e=>{if(e.touches.length===0)pinch=0;if(tx==null||zoomed){tx=null;return}const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))go(cur+(dx<0?1:-1));tx=null});
// one tap at the edges turns the page; a double tap opens it at reading size (single page only), so the turn waits a beat there
let tapT=null;
view.addEventListener('click',e=>{if(e.target.closest('a'))return;const x=e.clientX/innerWidth,cx=e.clientX,cy=e.clientY;
  const turn=()=>{if(zoomed)return;if(x>0.66)go(cur+1);else if(x<0.34)go(cur-1)};
  if(twoUp){turn();return}
  if(tapT){clearTimeout(tapT);tapT=null;setZoom(!zoomed,cx,cy);return}
  tapT=setTimeout(()=>{tapT=null;turn()},260)});
tocbtn.onclick=()=>{toc.hidden=!toc.hidden;tocbtn.setAttribute('aria-expanded',String(!toc.hidden))};
document.addEventListener('click',e=>{const a=e.target.closest('a[data-p]');if(a){e.preventDefault();goPage(+a.dataset.p)}});
addEventListener('resize',()=>{if(zoomed&&innerWidth<900){render(true);return}layout()});
function start(){
  try{if(location.hash)history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  layout();
  $('#loading').remove();
}
const faces=['400 22px "Source Serif 4"','italic 400 22px "Source Serif 4"','600 22px "Source Serif 4"','300 77px "Source Serif 4"','400 77px "Source Serif 4"','italic 400 38px "Source Serif 4"','400 16px "Source Code Pro"','500 16px "Source Code Pro"'];
Promise.all(faces.map(f=>document.fonts.load(f).catch(()=>{}))).then(()=>document.fonts.ready).then(()=>{build();start()});
})();
