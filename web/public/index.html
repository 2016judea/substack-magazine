iate social circle and “the masses” being everyone else."}, {"t": "p", "v": "In this particular setting, your given understanding on the opinions and sway of “the masses” was left to things like your regional newspaper or the television set in your home. Mediums such as op-eds written by columnists, TV shows, and movies were the penultimate representation of the culture and its people writ large."}, {"t": "p", "v": "Then came the internet."}, {"t": "p", "v": "Now every individual retains the ability to voice their immediate thoughts and opinions with the tap of a screen or the shutter of a camera lens. And likewise, we the people can garner a deeper understanding of “the masses” by simply going online and scrolling Reddit + Twitter + Instagram."}, {"t": "p", "v": "I heard this aphorism years ago that sums this up rather well: “Before the Internet, every village had their idiot and folks did their best to avoid them. Now the village idiots have a platform to broadcast to the world — which makes them harder to avoid.”\u0001 \u0002"}, {"t": "dept", "v": "Some Literature"}, {"t": "verse", "v": "He clasps the crag with crooked hands;\nClose to the sun in lonely lands,\nRing'd with the azure world, he stands.\nThe wrinkled sea beneath him crawls;\nHe watches from his mountain walls,\nAnd like a thunderbolt he falls."}, {"t": "p", "v": "---", "cls": "att"}, {"t": "p", "v": "Lord Tennyson (The Eagle)", "cls": "att"}], "mode": "two"}, {"slug": "august", "title": "August ’23", "deck": "The occult, three age systems, and artificial intelligence", "eyebrow": "August 22, 2023", "mov": "2023", "blocks": [{"t": "img", "src": "img/august-00.jpg", "w": 1890, "h": 2800, "cap": "Film poster for the film Ad Astra (2019)", "mw": 707.5, "mh": 520}, {"t": "dept", "v": "The News"}, {"t": "h3", "v": "The Black Sea Grain Initiative (is no more)"}, {"t": "p", "v": "Oft-termed the “breadbasket” of Europe, Ukraine’s economy is primarily hinged upon farming and relies heavily on the ability to export these commodities worldwide via shipping lanes per a deal that was reached in July of last year called the Black Sea Grain Initiative."}, {"t": "p", "v": "This deal allowed for Ukraine to continue its food-based exports throughout the ongoing war with Russia. However, Russia refused to extend this deal last month (that was brokered by the UN) and cited that the Kremlin had been expecting a loosening of sanctions on its own exports as a result of last year’s deal. While there are currently no Russian food exports under sanction, one can only assume the Kremlin is referencing the ongoing freeze on Russian banking systems (among other real and pseudo embargos of the like)."}, {"t": "p", "v": "TL;DR — Ukrainian cargo ships are no longer safe traversing the Black Sea and one can only speculate at the ramifications to food prices worldwide."}, {"t": "dept", "v": "Ideas"}, {"t": "img", "src": "img/august-01.jpg", "w": 1088, "h": 300, "cap": "", "mw": 400, "mh": 440}, {"t": "h3", "v": "The Freemasons"}, {"t": "p", "v": "I had been recommended a Netflix show called \u0001The Sons of Sam\u0002 by a buddy of mine which resulted in a deep dive down the occult rabbit hole. Or maybe more specifically, the “secret society” rabbit hole. I ended up reading more and more into the Freemasons and their belief systems. And what was oddly fascinating, was that this group of people had been around since the 13th century, still existed today, and at the center of their ideology was a story that is rooted in events from the Bible."}, {"t": "p", "v": "According to Biblical accounts, the temple of Solomon was located in Jerusalem and stood at the spot where God had created Adam — the first man. And during the construction of the temple, the Chief Architect was a man named Hiram Abiff. At one point, the workers constructing the temple grow angry with the Hiram and demand to know the “secrets of a Master Mason” — but he refuses to tell. At which point, the men strike him dead. In the night, the murderers bring his body outside the temple walls to be buried. Eventually his body is uncovered and the criminals brought to justice."}, {"t": "p", "v": "The free masons use this story at the center of their comradery — forming relationships, promoting membership and advancement, as well as the grounding in simple fortitudes the basis of their beliefs. It’s crazy to think that 800 years have passed and there is still a group of individuals who hold such a story in exceedingly high regard. Maybe its a testament to humanity."}, {"t": "h3", "v": "The Over-Generalization of Artificial Intelligence"}, {"t": "p", "v": "I wrote a couple months back about Meta and their half-handed attempt to “expose the algorithm” and have been doing some more mulling on this same topic, but through a wider lens."}, {"t": "p", "v": "Through my masters program, I’ve had to take several classes ranging from AI, machine learning, and Natural Language Processing (NLP). Basically, the underlying fundamentals and mathematics behind the sort of systems that undergird many of the largest platforms in the world (such as Instagram, Twitter, Google Search, etc). And the more I learn with regards to these topics, the more I’m convinced that these tech giants — and their executives by extension — actually know \u0001very little\u0002 with regards to how their systems \u0001actually work\u0002."}, {"t": "p", "v": "Let’s take for example “the algorithm” that makes recommendations on your YouTube or Instagram feed. It was in last week’s newsletter where I dropped some links to where Meta was doing PR releases where they generalized how their recommendation systems worked. It was very much akin to “we see you watched this video, so we recommend something similar”. Okay, thanks Meta, everyone already knows that. But what they aren’t telling you is that the inter-workings of an AI model are incredibly complex and \u0001even they \u0002couldn’t tell you exactly why you got shown a video without cracking open a machine learning model comprised of \u0001millions \u0002(if not \u0001billions\u0002) of inter-related “neurons”."}, {"t": "p", "v": "Let’s slow down for a second. ‘Model’ and ‘neuron’ are terms thrown around a lot today and I don’t think many of us have a solid grounding in what those things actually mean. Let’s take a quick look at this depiction of a neural network and I’ll breakdown things in simpler terms:"}, {"t": "img", "src": "img/august-02.png", "w": 1400, "h": 840, "cap": "", "mw": 707.5, "mh": 520}, {"t": "p", "v": "You can effectively think of the above ‘neural network’ as a ‘AI model’ because its built to ‘learn’ as it goes. And an FAQ:"}, {"t": "li", "v": "<span class=\"lp\">Input Layer</span>", "ord": true, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">This is just the “input data” that the model is trying to “classify”</span>", "ord": true, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Simple example being images of dogs and cats (and the goal of the model is to take the input images and determine which are dogs and which are cats)</span>", "ord": true, "n": 2, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Hidden Layer</span>", "ord": true, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">This is where the “black magic” happens and what I was referring to above when tech companies themselves don’t really even know what is going on in their systems</span>", "ord": true, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">This “layer” is where millions (and sometimes billions) of “neurons” exist</span>", "ord": true, "n": 2, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Their sole job is figure out what configuration they should take in order to get the “classification” of dogs and cats correct as often as possible </span>", "ord": true, "n": 3, "d": 1}, {"t": "li", "v": "<span class=\"lp\">This mimics how your brain works. Your body has some memory of smell/<wbr/>touch/<wbr/>sound tied to a configuration of neurons in your brain and when you encounter that sense/<wbr/>thing again — they fire in that <em>exact </em>configuration in order to remember/<wbr/>recognize “hey - that’s the thing”   </span>", "ord": true, "n": 1, "d": 2}, {"t": "li", "v": "<span class=\"lp\">Output Layer</span>", "ord": true, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">This “layer” is basically where we take the results from the neurons and convert it to “we think image one is a cat” </span>", "ord": true, "n": 1, "d": 1}, {"t": "p", "v": "After all this gets done, we compare the results and see how the model did. Aka, “did I classify all the cats and dogs right?” The results — or as its depicted above, the \u0001loss \u0002— is then propagated back to the neurons and they each find out “oh, we got some of these right and others wrong, lets change up our configuration a bit”. The process is repeated over and over again until the model is \u0001really good\u0002 at determining which images are dogs and which are cats."}, {"t": "p", "v": "Wrapping all this up, AI models are black boxes to a large extent. We know why these neural networks are good at what they do, BUT ONLY at a \u0001very \u0002general level. The intricacies of why the neurons take certain configurations, the number of neurons that work best for certain tasks, how long it takes to train, etc etc are all things we don’t understand at this point and these are areas of study for like Harvard PhDs. I had a professor at Columbia named Carl Vondrick who famously said “You may ask, why do we need X or Y hidden neurons in this AI model in order for it to work and the answer is: we honestly don’t know”. Much of this comes back to our fundamental \u0001lack \u0002of understanding with regards to the brain, which is why much of AI research is so closely tied to advances in Neuroscience."}, {"t": "p", "v": "Anyways, be weary out their friends. The AI revolution is underway and many of its prophets are talking out of their ass."}, {"t": "h3", "v": "The Ages of Stone, Bronze, Iron (and Steel)"}, {"t": "p", "v": "I stumbled across the ideas of Danish antiquarian Christian Thomsen when reading \u0001A Gentleman in Moscow\u0002. Thomsen organized man and his tools by-use of the three age system. This essentially means to break down the epochs of mankind into three distinct ages. The Age of Stone. The Age of Bronze. The Age of Iron."}, {"t": "p", "v": "The Stone Age was that of a rough and blunted man. Crafting tools and homes from shear rock as a means of survival. Then came the Bronze Age with the discovery of metallurgy. The elite of society fashioning coins and crowns. A furthering of the grandiose few. Of the bourgeois. Finally the advent of the modern age and that of iron. The steam engine, printing press, and gun. A trinity wrought from the efforts of the same bourgeois who lead the Bronze Age — but to egalitarian consequence — for it was the proletariat who ascended this age."}, {"t": "p", "v": "Alas, now we live in a new era. A new age. That of planes, skyscrapers, and rockets. The Age of Steel. Who will rise?"}, {"t": "img", "src": "img/august-03.jpg", "w": 1088, "h": 299, "cap": "", "mw": 400, "mh": 440}, {"t": "dept", "v": "Some Literature"}, {"t": "verse", "v": "I’ve always wanted brook trout\nfor breakfast."}, {"t": "verse", "v": "Suddenly, I find a new path\nto the waterfall."}, {"t": "verse", "v": "I begin to hurry.\nWake up,"}, {"t": "verse", "v": "my wife says,\nyou’re dreaming."}, {"t": "verse", "v": "But when I try to rise,\nthe house tilts."}, {"t": "verse", "v": "Who’s dreaming?\nIt’s noon, she says."}, {"t": "verse", "v": "My new shoes wait by the door.\nThey are gleaming."}, {"t": "p", "v": "- Raymond Carver", "cls": "att"}], "mode": "two"}, {"slug": "september", "title": "September ’23", "deck": "The dark web, societal norms, and chasing comets", "eyebrow": "September 27, 2023", "mov": "2023", "blocks": [{"t": "img", "src": "img/september-00.jpg", "w": 1600, "h": 768, "cap": "Scene from the film ‘Ex Machina’", "mw": 707.5, "mh": 520}, {"t": "dept", "v": "Creative Riff"}, {"t": "p", "v": "This was formerly a “news” segment, but in all honesty, it was the only segment I disliked writing. I don’t really care nor follow the news. So instead, gonna try something different this month and see if it resonates with folks (you may get a text asking for feedback :P)"}, {"t": "h3", "v": "Chasing Comets"}, {"t": "p", "v": "In the days before recorded time, our ancestors lived the land with bow and spear. Made fires in the hills and whispered stories with faces aglow the dying embers. At night we'd lay in deep furs on pine thicketed forest ground and stare at the starblown sky. Counting blinking stars and ascribing meaning to their shape while conversing with them in deft whisper and posing questions of the soul.", "cls": "riff"}, {"t": "p", "v": "And when the stars would fall from the heavens men would chase them. With bared feet and stooped shoulder they'd rush over the hills tracking the course of the fallen rock and stumble upon its resting place deep in the glens of the mountain. The smoldering stone gleamed with emerald and sapphire iridescence and hummed with mystery which not be of this world nor any other. Placing hand on stone they'd stare deep into the heart of the comet and ponder the spinning planets and the course whence the meteorite had come to pass and raise eyes skywards in contemplation of the cosmos.", "cls": "riff"}, {"t": "p", "v": "Align the sextant. Set a heading. Draw a footpath amongst the celestial vault.", "cls": "riff"}, {"t": "dept", "v": "Ideas"}, {"t": "img", "src": "img/september-01.jpg", "w": 1088, "h": 300, "cap": "", "mw": 400, "mh": 440}, {"t": "h3", "v": "The Dark Web"}, {"t": "p", "v": "The “dark web” is so often associated with nefarious activity that I think it gets a bad rap. Yes, there are sites where you can seemingly purchase guns, drugs, etc. But there is also a wealth of content that is perfectly legal and simply exists on the dark web because its too “edgy” for the public internet (which is often referred to as the “Clearnet”). For example, \u0001The New York Times\u0002 actually maintains a dark web presence and WikiLeaks has been the platform that has enabled dozens (if not more) national security leaks. And this brings us to the heart of the what the “dark web” was originally intended to be. It was designed to be a means to conduct activity online with complete anonymity. Whether that be entering honeypots, red rooms, illegal marketplaces, or leaking national security documents to the American public."}, {"t": "p", "v": "And now, there has been increased speculation that the Feds have taken over “nodes” (aka servers) that undergird the dark web with the likely intent of being able to de-anonymize users based on their IP address. Thats not to say that catching criminals is a bad thing, but it completely undermines your ability as a user to navigate online with anonymity. Anyways, if you’re interested, this breakdown by Mental Outlaw over on YouTube is superb:"}, {"t": "img", "src": "img/september-e0.jpg", "w": 1280, "h": 720, "cap": "Mental Outlaw, “Hundreds of Tor Relays are Being Used to De-anonymize Users”", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "The Ascent of Money"}, {"t": "p", "v": "A year or two ago I read a book called \u0001The Ascent of Money\u0002 by Niall Ferguson where he takes a stroll through the historical advent of currency."}, {"t": "p", "v": "In the book, he argues that \u0003the creation of ‘credit’ by banks was the first great revolution\u0004 in the “ascent of money”. By allowing individuals — or any enterprise for that matter — the ability to borrow more money than they currently have on hand allowed for an exponential growth in the worldwide economy. And this can be relatively easy to visualize. Imagine you are a small farmer in the hills of Italy during the 1400s. By reaping your harvest each fall you are able to afford the basic necessities for your family. But what if your son wants to join the family trade whence old enough? What if he has a family of his own? You don’t have enough money per your modest harvest to afford buying \u0001another \u0002plot of land for your son…so you go to the bank. And at the fixed interest rate provided by the bank, you suddenly have the ability to further your family’s enterprise which in turn expands the GDP of your community and nation writ-large."}, {"t": "p", "v": "Ferguson then goes on to argue that \u0003the birth of the bond was\u0004 \u0003the second great revolution\u0004 in the “ascent of money”. Bonds effectively present a means of borrowing from a broader range of people or institutions than just banks. When a country issues trillions of dollars in bonds to pay for some governmental program this is effectively borrowing money from some nation(s) and inherently its citizens. This leads us to the exact reason why bond markets have such a momentous influence on the global economy:"}, {"t": "p", "v": "When bond prices fall, this is seen as: \"those who lent us money don't believe we are going to pay it back\"", "cls": "q"}, {"t": "p", "v": "Likewise when bond prices rise, its viewed as: \"this nation and its economy look like a promising investment\"", "cls": "q"}, {"t": "p", "v": "So you can think of bonds as ‘stocks’ for nations."}, {"t": "p", "v": "Now that we have this understanding of how bonds work, lets consider the scenario where bond prices fall. How do you think interest rates would respond?"}, {"t": "p", "v": "Actually, let me re-phrase the question."}, {"t": "p", "v": "Imagine everyone in the world decides “the United States economy is in turmoil and there is no way they can afford to pay back their debt”. Do you think that will make borrowing money from the bank more or less expensive for you, a US citizen? More expensive obviously. The world predicts a forthcoming depression, so the bank is hesitant to lend you money because you might not be able to pay it back. Therefore, they jack up the interest rate to account for this risk when lending you money."}, {"t": "p", "v": "TL;DR — The ability to borrow money from banks evolved into institutions being able to borrow from you (the people) via bonds; and that dynamic has gross ramifications on the worldwide economy."}, {"t": "h3", "v": "Examining the Outskirts of Society"}, {"t": "p", "v": "Most of us live cyclical lives. Thereby a routine. Whence established the bounds of your social circle are neatly defined. And you go through a week or a year and so very seldom meet someone new."}, {"t": "p", "v": "Now let’s consider the citizens of this country existing on the outmost fringes of society. Heroin addicts. Self sufficient farmers out in no-where Wyoming. The men working the night shift sweeping the inner-city streets. Who are these people? How did they come to be here? What drove such a deviation from the norm?"}, {"t": "p", "v": "A day in the life of a heroin addict is so far different than that on my own that I wouldn’t know where to start if given the option to swap shoes. Where do you meet the dealer? How much is an ounce? Where does one shoot up? Sounds stressful to be honest. And if growing potatoes and fetching water from a stream because we have no electricity in the mountains of Wyoming? That sounds even more unreal."}, {"t": "p", "v": "I like to think about the lives of these sorts of people because it often makes me question my own circumstances. My own daily habituations."}, {"t": "p", "v": "Did I fall for “this trap”? Am I following a presupposed narrative? What’s out there to experience? How much of ‘wrong’ is really ‘bad’? Who determines ‘bad’? I never got a chance to vote by the way. Times have changed and I’m not sure I fully agree."}, {"t": "img", "src": "img/september-02.png", "w": 922, "h": 637, "cap": "", "mw": 400, "mh": 440}, {"t": "dept", "v": "Some Literature"}, {"t": "p", "v": "She laughs and looks out the window and I think for a minute that she's going to start to cry. I'm standing by the door and I look over at the Elvis Costello poster, at his eyes, watching her, watching us, and I try to get her away from it, so I tell her to come over here, sit down, and she thinks I want to hug her or something and she comes over to me and puts her arms around my back and says something like 'I think we've all lost some sort of feeling'.", "cls": "lit"}, {"t": "p", "v": "- Bret Easton Ellis (Less Than Zero)", "cls": "att"}], "mode": "two"}, {"slug": "october", "title": "October ’23", "deck": "Quantum computing, serial killers, and theoretical AI", "eyebrow": "October 24, 2023", "mov": "2023", "blocks": [{"t": "img", "src": "img/october-00.jpg", "w": 1494, "h": 666, "cap": "Pretty famous scene from Donnie Darko.", "mw": 707.5, "mh": 520}, {"t": "dept", "v": "Creative Riff"}, {"t": "p", "v": "He eventually reached the coast. The lands of wolves and failed fathers behind him. He made shelter in an observatory that had once been manned to watch the dark waters beyond. Gathering brush he made a fire to defrost his soul. He'd try and sleep beneath the blackened night skies but the crashing and swirling of the waves stirred his thoughts to restlessness. Walking the shore the man would sit and rest hands on knees and contemplate decisions made and whisper the suppositions of his heart to whomever above be listening. The man thought they be simple questions and tentatively hoped for simple answers written in the nighttime sky or in the tempo of the crashing waves and as the years went by the man did derive some meaning from these ponderings of the world and his place therein.", "cls": "riff"}, {"t": "p", "v": "He simply did not know it yet.", "cls": "riff"}, {"t": "img", "src": "img/october-01.jpg", "w": 1024, "h": 1024, "cap": "Generated using DALL-E (from OpenAI) with the prompt “a man at the top of an abandoned lighthouse staring at comets in the dark sky above”", "mw": 400, "mh": 440}, {"t": "dept", "v": "Ideas"}, {"t": "img", "src": "img/october-02.jpg", "w": 1088, "h": 299, "cap": "", "mw": 400, "mh": 440}, {"t": "h3", "v": "Quantum Computing"}, {"t": "p", "v": "It’s a hot topic nowadays. There are even some (very) early versions of quantum computers at places like IBM and Google. But we are still a long ways off from quantum computing becoming applicable to everyday life and to understand how these systems work we first need to outline the premise of quantum entanglement."}, {"t": "h4", "v": "\u0003Quantum Entanglement\u0004"}, {"t": "p", "v": "Anyone who was STEM major in college likely has some fundamental understanding of quantum physics. The basic idea is that on the \u0001quantum level \u0002— think atomic and subatomic — the classical rules of physics don’t apply. As in, the laws of motion (Newton), thermodynamics, and electrodynamics (Maxwell’s equations) don’t “work“ when we look at the behavior of subatomic particles."}, {"t": "p", "v": "Instead, they follow the behaviors defined by quantum mechanics. One of such odd behaviors is this phenomena known as quantum entanglement which essentially says that some particles cannot have their state described independently of the state of others."}, {"t": "p", "v": "I’m not gonna go any further down that rabbit hole since its a deeply complicated subject. But for the context of this discussion, just remember that \u0001sometimes when one particle changes, so do other(s) somewhere else in the universe\u0002."}, {"t": "h4", "v": "\u0003Implications of Quantum Entanglement on Computing\u0004"}, {"t": "p", "v": "Modern computing (and communication) at its core is a binary operation. 0s and 1s. All transmitted by a wave of electricity:"}, {"t": "img", "src": "img/october-03.png", "w": 804, "h": 233, "cap": "“How Computers Store and Transmit Data”", "mw": 400, "mh": 440}, {"t": "p", "v": "But when you consider quantum entanglement, now you have a \u0001single particle\u0002 that can exist in \u0001multiple states\u0002 at one point in time. This example made the most sense when trying to wrap my head around this concept:"}, {"t": "img", "src": "img/october-04.png", "w": 857, "h": 443, "cap": "", "mw": 400, "mh": 440}, {"t": "p", "v": "The implications on computing can be tricky to understand as well. But the general idea is that in modern computing, we are limited to 0s and 1s when transmitting and computing information. Whereas with quantum entanglement, we are no longer limited by this constraint. Let’s say I want to transmit HELLO in binary:"}, {"t": "code", "v": "H - 01001000\nE - 01000101\nL - 01001100\nL - 01001100\nO - 01001111"}, {"t": "p", "v": "So our entire computation would be:"}, {"t": "code", "v": "01001000 01000101 01001100 01001100 01001111"}, {"t": "p", "v": "Which is 40 bits of information. Now consider representing this via quantum entanglement:"}, {"t": "img", "src": "img/october-05.png", "w": 345, "h": 303, "cap": "", "mw": 400, "mh": 440}, {"t": "p", "v": "This single piece of information — “HELLO” — can be transmitted instantaneously by only changing the state of a single particle. Which in this case, is entangled with 40 others on some other quantum machine."}, {"t": "p", "v": "And that’s my TL;DR for quantum computing, or at least, quantum information theory."}, {"t": "h3", "v": "Serial Killers: A Modern Phenomena?"}, {"t": "p", "v": "Humans have been committing heinous acts from the dawn of time. Since we were partially evolved monkeys and concluded our arguments over coconuts by murdering one another and dragging the lifeless body through the nearby village as an act of “showmanship”."}, {"t": "p", "v": "But the term ‘serial killer’, on the other hand, is a relatively modern construct. Criminal profiling can be traced back as far as the 1880’s when physicians used crime-scene evidence to predict the personality of Jack the Ripper and the FBI pioneered its formalization in the 1960s (this should ring a bell for anyone who has seen \u0001Mindhunter\u0002)."}, {"t": "p", "v": "It’s also a fact that only 51% of homicides were solved in 2021 per FBI crime statistics."}, {"t": "p", "v": "So we have established that ‘murder’ has existed for as long as human memory, that it still exists today (and often goes unsolved), and that we have a relatively new way of describing the killers who commit these acts “serial”. But why is there so little mention in recorded history of serial murder? And I don’t mean soldiers and paid assassins. How do we \u0003not have\u0004 more documented cases preceding the 1880s of humans serially murdering one another for little to no reason? Did we simply lack the psycho-analytic framework that exists today? That seems far-fetched in my opinion. If there was a man who lived in ancient Athens that was abducting and killing teenagers, wouldn’t you think there would be \u0001some \u0002documented history of it? The serial killing of \u0001anyone \u0002is sure to raise some eyebrows — and sell some scrolls — so if teenagers were disappearing in droves one would assume that there would be some documented recording of it."}, {"t": "p", "v": "All of this leads me to believe that serial murder (unpaid and unprovoked serial murder that is) is a relatively modern phenomenon. And if this is indeed the case, why? Has society become so structured, so preconditioned, so bored, that there are those who choose to defy all moral constructs with repetitive murder?"}, {"t": "p", "v": "Idk, just something I’ve been pondering. And its spooky season. So this month seemed the most appropriate to discuss :p"}, {"t": "h3", "v": "Theoretical AI"}, {"t": "p", "v": "I’ve been getting more and more interested in artificial general intelligence (AGI). Less so on the technical side and more on the philosophy of such a technology. As such, I wanted to lay out a few thoughts I’ve been kicking around."}, {"t": "h4", "v": "\u0003What constitutes ‘consciousness’? \u0004"}, {"t": "p", "v": "If an AI has been programmed to respond to certain stimuli in a given way, isn’t that just hard coding the way we ‘think’ we feel about something? How can we as humans begin to encapsulate what it means to be inherently human into an given AI system? Like the way it feels to step into a meadow at dawn and feel the rays of sunlight on your skin?"}, {"t": "code", "v": "if (WEATHER == GOOD && SUN == BRIGHT) {\n     self.mood = HAPPY\n}"}, {"t": "p", "v": "Is this the same thing?"}, {"t": "h4", "v": "\u0003Language and Communication\u0004"}, {"t": "p", "v": "There is an interesting scene in Ex Machina where ‘Ava’ (an arguably sentient AI) breaks out from her holding chamber and interacts for the first time with a fellow AI played by an eastern Asian woman referred to as ‘Kyoko’. We don’t hear what they say to one another, but Ava leans in close and appears to whisper something to Kyoko. And at the same time, we see Ava tapping Kyoko’s arm in some Morse-like fashion."}, {"t": "p", "v": "I think this scene was meant to garner some thought into how AI agents would interact with one another given the opportunity. Sure, scientists program these AGI’s to communicate back with us in a manner we can understand — English for example — but that doesn’t mean it’s their \u0001natural \u0002means of thought and communication."}, {"t": "p", "v": "Consider your own waking thoughts. If you were born and raised in an English speaking home, you likely have an internal dialog that is \u0001also \u0002in English. But what if you are an sentient AI? You were trained to communicate in English, but your core programming is in binary. In what form is your internal dialog? Zeros and ones? Hexadecimal? English? And what happens when you meet someone else who has the same internal wiring? Do you interact with one another in Morse code? Blink your eyes in binary? Or converse in English?"}, {"t": "p", "v": "Lot’s of unanswered questions here."}, {"t": "h4", "v": "\u0003A Few More Ideas\u0004"}, {"t": "li", "v": "<span class=\"lp\">Are AI’s without emotions just capitalistic machines? </span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">When animals go extinct, have they simply reached their evolutionary fate? Is that where we’re headed with AI? </span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">What if we as humans are the evolution of some AI-equivalent? Were we manufactured in a bottle? Have our core frequencies been preprogrammed or are we continuously being updated to the next major release?  </span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Is current AI the ape-wise equivalent for some superintelligent AI ancestor? </span>", "ord": false, "n": 4, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Do we develop AI with a specific gender? Will AI choose to retain such a construct when it surpasses our own intelligence? </span>", "ord": false, "n": 5, "d": 0}, {"t": "li", "v": "<span class=\"lp\">How do we know we haven’t developed an AI that is smarter than us? It could simply fake it when tested. </span>", "ord": false, "n": 6, "d": 0}, {"t": "img", "src": "img/october-06.jpg", "w": 2040, "h": 1360, "cap": "Ex Machina, 2014", "mw": 707.5, "mh": 520}, {"t": "dept", "v": "Some Literature"}, {"t": "p", "v": "A sad and bitter season. Barrenness of heart and gothic loneliness. Suttree dreamed old dreams of fairgrounds where young girls with flowered hair and wide child eyes watched by flare light sequined aerialists aloft. Visions of unspeakable loveliness from a world lost. To make you ache with want.", "cls": "lit"}, {"t": "p", "v": "- Cormac McCarthy (Suttree)", "cls": "att"}], "mode": "two"}, {"slug": "november", "title": "November ’23", "deck": "Human evolution in a digital world", "eyebrow": "November 24, 2023", "mov": "2023", "blocks": [{"t": "img", "src": "img/november-00.jpg", "w": 739, "h": 497, "cap": "The Devil’s Dress, 2011 by Michaël Borremans (b. 1963)", "mw": 707.5, "mh": 520}, {"t": "dept", "v": "Ideas"}, {"t": "p", "v": "Just one essay this month."}, {"t": "h3", "v": "Human Evolution in a Digital World"}, {"t": "p", "v": "The digitation of society is a relatively modern phenomenon. The culmination of information ranging from hieroglyphics carved in stone to newspapers delivered to your doorstep spanning centuries. Then arose a new era — that of mass marketability and rung forth in varying sound, visual, and written modes — a digital one."}, {"t": "brk"}, {"t": "p", "v": "For millennia we as humans formed small, tight-knit communities. We interacted with our immediate family, neighbors, and townspeople on a daily level and by oral expression almost entirely. Then the rise of the written word and thousands of years of its thereby evolution. From runes in stone, to painted scrolls, and ultimately the mass production of newspapers. And while the evolution of written communication fundamentally changed human interaction writ-large, this progression took place over thousands of years. Now fast forward to the 20th century and its foundational technologies."}, {"t": "h4", "v": "\u0003[\u0004\u0001\u00031910s\u0004\u0002\u0003] The telephone becomes an ordinary household commodity\u0004"}, {"t": "p", "v": "One-to-one human communication over long distance becomes instant and retains a distinct human element — your voice."}, {"t": "p", "v": "Does this strengthen our communal ties? Or degrade them?"}, {"t": "h4", "v": "\u0003[\u0004\u0001\u00031920s\u0004\u0002\u0003] Radio broadcasting goes commercial\u0004"}, {"t": "p", "v": "One-to-one human interaction and impersonal written word is surpassed by a widely available verbal transmission. The world’s happenings accessible with the turn of a knob."}, {"t": "h4", "v": "\u0003[\u0004\u0001\u00031950s\u0004\u0002\u0003] Television surpasses radio as the most popular broadcast medium\u0004"}, {"t": "p", "v": "Radio programming’s shortcomings now forgone with a mode that can sustain your attention with it’s vocal \u0001and \u0002visual medium. Human communication attaining new heights and entertainment its freshly cemented cornerstone."}, {"t": "h4", "v": "\u0003[\u0004\u0001\u00031990s\u0004\u0002\u0003] The rise of the world wide web\u0004"}, {"t": "p", "v": "You can now search for anything or anyone on the Internet."}, {"t": "p", "v": "Are we as humans more or less intelligent now that we have access to the world’s information with the click of a button? To what degree did human “connectedness” fundamentally change during this time frame? Was it for the better?"}, {"t": "h4", "v": "\u0003[\u0004\u0001\u00032000s\u0004\u0002\u0003] Cell phones are now commonplace \u0004"}, {"t": "p", "v": "The digital world is now portable. You take it with you everywhere you go. Our daily lives are now interrupted by texts, calls, and Fantasy Football notifications."}, {"t": "h4", "v": "\u0003[\u0004\u0001\u00032010s\u0004\u0002\u0003] Social media becomes a worldwide cultural institution \u0004"}, {"t": "p", "v": "Feeds, trends, and influencers have come to dominate our modern culture. Some people shy away from these platforms entirely while others embrace them and make millions. Does one approach hold a higher moral ground than another?"}, {"t": "h4", "v": "\u0003[\u0004\u0001\u00032020s\u0004\u0002\u0003] ML and AI remain poised to disrupt in nearly every industry \u0004"}, {"t": "p", "v": "A bold future? Or brave new world?"}, {"t": "brk"}, {"t": "p", "v": "We just walked through ~100 years. Try and wrap your head around that."}, {"t": "p", "v": "For thousands of years we either spoke or wrote our thoughts down. Now we record, live-stream, crop, and filter. Then upload, like, and share."}, {"t": "p", "v": "If Darwin and evolutionary biology are any indication to the human condition, then we as animals are built to adapt. It’s why we have opposable thumbs. But that same inherent evolutionary tendency has been scientifically proven to span hundreds (if not thousands) of years. How long did we crawl around on all fours before reaching the point where we could stroll on two? It almost feels like modern society and our technology is advancing too rapidly — and our innate human programming is still hardwired to an era long since past. Maybe the Internet, and smart phones, and social media don’t make sense to us because they’re not supposed to."}, {"t": "p", "v": "I sure as hell don’t know what to make of this day and age. But I’d like to get better at living in it. Maybe you and I could do it together?"}, {"t": "dept", "v": "Some Literature"}, {"t": "p", "v": "The sea had jeeringly kept his finite body up, but drowned the infinite of his soul. Not drowned entirely, though. Rather carried down alive to wondrous depths, where strange shapes of the unwarped primal world glided to and fro before his passive eyes; and the miser-merman, Wisdom, revealed his hoarded heaps; and among the joyous, heartless, ever-juvenile eternities, Pip saw the multitudinous, God-omnipresent, coral insects, that out of the firmament of waters heaved the colossal orbs. He saw God’s foot upon the treadle of the loom, and spoke it; and therefore his shipmates called him mad. So man’s insanity is heaven’s sense; and wandering from all mortal reason, man comes at last to that celestial thought, which, to reason, is absurd and frantic; and weal or woe, feels then uncompromised, indifferent as his God.", "cls": "lit"}, {"t": "p", "v": "- Herman Melville (Moby Dick)", "cls": "att"}], "mode": "two"}, {"slug": "december", "title": "December ’23", "deck": "Morality, tidal gravity, and a career retrospective", "eyebrow": "December 17, 2023", "mov": "2023", "blocks": [{"t": "img", "src": "img/december-00.jpg", "w": 673, "h": 482, "cap": "21.3.92 by Gerhard Richter", "mw": 707.5, "mh": 520}, {"t": "dept", "v": "Creative Riff"}, {"t": "p", "v": "let's get sentimental", "cls": "riff"}, {"t": "p", "v": "babe", "cls": "riff"}, {"t": "dept", "v": "Ideas"}, {"t": "h3", "v": "Inherited Morality"}, {"t": "p", "v": "Friedrich Nietzsche is one of the most influential (and controversial) thinkers of the past couple hundred years. And I’ve probably met a dozen or so people in my life who \u0001know who he is\u0002 and significantly less who have\u0001 actually read\u0002 \u0001him\u0002. As such, I want to spend some time discussing one of his primary works: \u0001On the Genealogy of Morals\u0002."}, {"t": "p", "v": "As you can probably infer from the title, Nietzsche dissects our modern morals and how they sprung into existence. He starts by digging into the dichotomy between “good” and “bad” as well as “good” and “evil” (think about that for a moment and see if you can discern what the difference is). But ultimately what Nietzsche is doing here, is outlining the premise of our morality and why we think some things are “good” and others are “bad”."}, {"t": "p", "v": "And this discussion serves as a really interesting precursor to the ramifications morality has on the human condition. Consider your own upbringing and how it shapes your day-to-day decision making. We have 9-5 jobs because “that’s what you do”. You put 5% in your 401k because “that’s what your grandparents told you”. You wait till marriage to have kids because “its what our theology dictates”. And I’m not saying any of those examples are wrong/bad/ill-advised. Instead, what I’m trying to exercise here is that the way you live your life is fundamentally grounded in the morals of your parents/community/society."}, {"t": "p", "v": "Now tell me, how does someone impose these values on you? Think back to your own parents. When you stole that toy from your sister and were chewed out by your parents and you asked “why” — what did they say?"}, {"t": "p", "v": "\u0001“You just don’t do that.” \u0002"}, {"t": "p", "v": "\u0001“You need to learn to share.” \u0002"}, {"t": "p", "v": "\u0001“How would you feel if someone took your toy??!!”\u0002"}, {"t": "p", "v": "See the common theme? Guilt."}, {"t": "p", "v": "And if each and every one of us is living our lives fixed upon some predetermined moralistic notion that was imposed via a guilty conscience, then its no wonder we hit 25 or 50 or 75 years of age and stop to ask “Wait, why didn’t I quit my job and do X like I always wanted to??”"}, {"t": "p", "v": "In summation, this isn’t me telling you to quit your job and move to LA to pursue that modeling career. But this \u0003IS\u0004 me saying its okay to question the nature of norms, virtues, and morals."}, {"t": "p", "v": "Groupthink isn’t sexy. It never was (and never will be)."}, {"t": "h3", "v": "Tidal Gravity"}, {"t": "p", "v": "Many of us already know how “tides” work with regards to bodies of water, but I’ll briefly reiterate since it preempts my primary discussion point."}, {"t": "img", "src": "img/december-01.jpg", "w": 1000, "h": 707, "cap": "The Conversation, “Curious Kids: How does the Moon, being so far away, affect the tides on Earth?”", "mw": 400, "mh": 440}, {"t": "p", "v": "Basically, in the image above, we can see that the Moon is exerting its gravitational field on the Earth’s oceans and it causes this sort of \"squishing” that results in water levels to rise or fall depending on where you’re located on Earth and where the Moon (and Sun) are tangentially positioned. The “squishing” is a result of an unequal gravitational field, and in this case, it is a relatively small gravity (the Moon) being exerted upon a relatively large object (the Earth)."}, {"t": "p", "v": "Now consider a black hole:"}, {"t": "img", "src": "img/december-02.png", "w": 1156, "h": 992, "cap": "Astronomy.com, “Do black holes have bottoms?”", "mw": 707.5, "mh": 520}, {"t": "p", "v": "Black holes are former stars that collapsed in on themselves to form a “singularity”. This results in something very small that exerts an ENORMOUS gravitational field around it."}, {"t": "p", "v": "Now consider what would happen if an object — let’s say an astronaut — got sucked into a black hole:"}, {"t": "img", "src": "img/december-03.png", "w": 732, "h": 914, "cap": "Wikipedia, “Spaghettification”", "mw": 400, "mh": 440}, {"t": "p", "v": "The gravity exerted by the black hole on the astronaut would be drastically different between their head and toes, resulting in what Stephen Hawking coined as “spaghettification”. So yeah, \u0001Interstellar \u0002isn’t all that accurate in this regard :p"}, {"t": "h3", "v": "Reaching an Actualization Plateau in Your Career"}, {"t": "p", "v": "I spend a lot of time questioning the nature of my career path; both how I got here and where I’m headed. More specifically, in the past 6 months or so I’ve reached a point where my job is not as fulfilling as it once was (and there are a few reasons for this)."}, {"t": "h4", "v": "\u0003Upsides\u0004"}, {"t": "li", "v": "<span class=\"lp\">Very smart and capable coworkers</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Great pay and benefits</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Comfortable (don’t have to try too hard or work long hours anymore) </span>", "ord": false, "n": 3, "d": 0}, {"t": "h4", "v": "\u0003Downsides\u0004"}, {"t": "li", "v": "<span class=\"lp\">Not being challenged </span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">No longer interesting</span>", "ord": false, "n": 2, "d": 0}, {"t": "p", "v": "I felt like I had reached a self-actualization plateau with my career. That is, I had maximized my potential within the job I had taken a few years prior and reached a point where I was reaping all the rewards from the aforementioned “grinding” — but still found myself unfulfilled day-to-day. In the tech industry, this is often referred to as “burnout”. Its a combination of stress, being locked into a high paying job that’s hard to walk away from, and being unfulfilled in the day-to-day."}, {"t": "p", "v": "Now, if you go onto Blind or Reddit, there are plenty of threads about “burnout” and several recommended “solves”:"}, {"t": "li", "v": "<span class=\"lp\">Take a couple weeks PTO </span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Take a leave of absence for 2-3 months</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Most big tech companies allow this. No pay, but keep health insurance. </span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Switch teams</span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Take a new job (externally) </span>", "ord": false, "n": 4, "d": 0}, {"t": "p", "v": "Ultimately, I decided to switch teams internally since the root of my consternation was being “bored” and “no longer growing” in my previous role, but I think this sort of personal crisis served as great learning opportunity for myself and what I want from the next ~40 years."}, {"t": "p", "v": "Eventually, you’ll reach a point where you have money. You’ll reach a point where you have a reliable car. You’ll reach a point where you have that dream job. And you know what? Those things will only take you so far. It’s like if your happiness was a glass of water. Your career can only fill that glass so full. At some point, you need to find those other things that top it off and pursue them."}, {"t": "img", "src": "img/december-04.jpg", "w": 1088, "h": 298, "cap": "", "mw": 400, "mh": 440}, {"t": "dept", "v": "Some Literature"}, {"t": "p", "v": "In his blue gardens men and girls came and went like moths among the whisperings and the champagne and the stars.", "cls": "lit"}, {"t": "p", "v": "- F Scott Fitzgerald (The Great Gatsby)", "cls": "att"}], "mode": "two"}, {"slug": "january", "title": "January ’24", "deck": "A European Love Letter", "eyebrow": "January 24, 2024", "mov": "2024", "blocks": [{"t": "img", "src": "img/january-00.png", "w": 1024, "h": 550, "cap": "Scene from the film ‘Aftersun’", "mw": 707.5, "mh": 520}, {"t": "dept", "v": "Preface"}, {"t": "p", "v": "I actually wrote an entirely “traditional” Substack for January and had fully planned on sending that out this morning — it’s currently 5am mind you — but for some reason, that didn’t feel like the writing I really wanted to publish this month. Instead, I’d like to share some sporadic journaling that I did while traveling in Europe with my buddy Peyton over the holidays."}, {"t": "p", "v": "I’ll be the first to admit that these journal entries are pretty sentimental, but I also think it’s some of the most \u0001honest \u0002writing I’ve ever done (and I hope that resonates with you). So without further ado, continue on friend; I’m glad you’re here and appreciate your time."}, {"t": "dept", "v": "Journal"}, {"t": "h4", "v": "\u0003Dec 23\u0004"}, {"t": "p", "v": "Yesterday, Peyton and I’s red eye flight landed in London at 7am. Jet lagged and caffeine induced insomnia followed as I showed him around Westminster and Kensington. Later that day we check into the hotel, take a power nap, and grab dinner at Five Guys. Shortly thereafter we grab a four rack of Bud heavies (the king of beers) and head back to the hotel to chill in the room and listen to 2000s country."}, {"t": "p", "v": "Time for liftoff 🚀"}, {"t": "h4", "v": "\u0003Dec 24\u0004"}, {"t": "p", "v": "We met our group, 47 other solo travelers, in the downstairs café of the hotel and boarded the coach shortly after saying our initial hellos. Took the ferry across the English Channel from Dover where the waters were rough and the sky sharp granite. We got into Amsterdam later that day and checked into the hotel. Got dinner at a small restaurant where Peyton and I sat next to Joel and Lizzy who told us all about Australia. Then took a canal cruise where the young men commandeering the barge play music and provide everyone with unlimited Heineken and white wine."}, {"t": "p", "v": "On the way home, we were given the option to check out the Red Light District where a few of us went into an erotic museum. The woman behind the counter kept making eyes at me which was a bit unnerving. Peyton wanted me to sit in this BDSM chair that had steel wrist and neck straps. “It will be funny,” he said. We finish with a quick loop where several individuals try to sell us coke and pass by some naked women dancing in rented red-rooms/windows — one of which makes eye contact and tries to lure me inside."}, {"t": "p", "v": "Topping off the night we find a bar, buy some shots, and dance onstage with the DJ. I talk to Daphne about neuroscience and literature. Take an Uber home with her, Tania, and Peyton. Discuss relationships and getting older. It was a good day. Onwards and upwards."}, {"t": "h4", "v": "\u0003Dec 25\u0004"}, {"t": "p", "v": "It’s Christmas morning and we head over to “Winter Paradise” here in Amsterdam. Ice Skating, tubing, hot chocolate and artificial snow. Around lunch we get back on the coach and head south to Sankt Goar which is a small town that resides on a river in the Rhine Valley. Dinner is a traditional German bratwurst with a few other potato based dishes. Afterwards, we do wine tasting with a local grower and then do Secret Santa as a group. The wine is sweet and the beer smooth here in the heart of Bavaria. Looking forward to our night out in Munich."}, {"t": "h4", "v": "\u0003Dec 26\u0004"}, {"t": "p", "v": "We rise and have breakfast as a group. After which we go out to the Rhine and stand in the early dawn light and watch the river pass us by. There are little homes and big castles in the hills on either side adjoining the river. Sankt Goar is quiet and idyllic on the day after Christmas."}, {"t": "p", "v": "We spent most of the day on the coach commuting to Munich, but reach the Bavarian capital as the day’s light fades and check into the hotel. We meet our tour guide in the city’s center and stroll the streets and take in the steeping gothic-like churches that are scattered across the city. At one point we cross through the city’s center which has a large public park and there are no lanterns lit and you could hardly see the graveled path beneath your feet."}, {"t": "p", "v": "We finish the walking tour at a large beer hall and tip the guide. Inside, there are large wooden tables and steins of beer sit empty in front of red faces. We ordered pork knuckle and half a chicken and the man next to our table sits passed out with face down. A beautiful beer maiden glides to and fro and offers us pretzels but I can’t find the words to ask her my way."}, {"t": "p", "v": "We board the coach and call it an early night. Listen to Yellow by Coldplay and doze as the village of Munich passes by."}, {"t": "h4", "v": "\u0003Dec 27\u0004"}, {"t": "p", "v": "We begin the day by heading to Dachau concentration camp outside of Munich. Walking the graveled footpaths into camp — treading the footfalls of so many that came and never went — and enter through corrugated steel gates and wander through a series of SS barracks and the sleeping quarters of prisoners alike. It’s a solemn morning. The grounds are quiet and a man-made creek that lines the outskirts of the camp gurgles by. Eventually I break off from the group and make my way solo through the crematorium. That’s when it really hits and it’s a bit overwhelming to be on a vacation traveling Europe and standing in a place like Dachau. I feel privileged beyond measure."}, {"t": "p", "v": "We leave Munich headed south for Austria. It’s a long drive but the Alps begin to tower on either side and the morning flies by. We arrive in Innsbruck and spend the afternoon wandering cobblestone streets with the other tourists. Later in the day we take a gondola up into the mountains and spend golden hour at 6250 ft."}, {"t": "p", "v": "After checking into the hotel we spend a night enjoying a traditional Tyrone evening. I’m surprised at the ingenuity and dedication to the craft that the family performing shows. I also realize halfway through that these people look strikingly familiar to my Mom’s side of the family whom I know are of German descent. Contemplations of my family roots ensue."}, {"t": "p", "v": "We get back to the accommodation and the hotel bar is closed so we get beers from the vending machine (of all places) and Tiera, Arla, Peyton, and I go back to our room and we spend a few hours talking life. Another good day. Need to get some sleep though."}, {"t": "h4", "v": "\u0003Dec 28\u0004"}, {"t": "p", "v": "Today it’s Venice. Cobbled streets and gondolas and canals. Wine and Aperol Spritz. We do a walking tour with a native Venetian and she tells us how the city’s population grows smaller and smaller with each passing year. It’s a shame a city as beautiful as Venice is so impractical to live in. Many beautiful things are like this. Impractical that is."}, {"t": "p", "v": "After the walking tour finishes we have a couple hours and a group of us find a restaurant to sit down at. It’s a rather fancy place with red and white checkered tablecloths and plated metal silverware, but we just ask for a drink menu. Peyton and I order a bottle of Sauvignon Blanc and the rest of the group drink Aperol Spritz. We get wine drunk and talk amongst new friends and wander the narrow streets, eventually making our way back to the waterfront."}, {"t": "p", "v": "The remainder of the group joins up and we enjoy dinner together. The pasta is superb and the house wine nurses the softening buzz from the aforementioned Sauvignon."}, {"t": "p", "v": "We get into the hotel rather early and head across the street to the bar. A dozen or so of us that are on the tour are there and we play Uno and Jenga and drink Captain Coke made by a bartender who has never heard of such a thing. The Aussies show us a game called Cheers to the Governor and a newly found comradery takes form."}, {"t": "h4", "v": "\u0003Dec 29\u0004"}, {"t": "p", "v": "The morning is spent aboard the coach once again as we make our way towards Rome. We check into the hotel, wash up, and head to the city center where we take to the Spanish steps and wander beneath warm Christmas lights. The city is busy, many of which are tourists, but the towering Roman pillars and Egyptian obelisks serve as a consistent reminder as to where we are, that which came before, and what shall come after when we return to dust."}, {"t": "h4", "v": "\u0003Dec 30\u0004"}, {"t": "p", "v": "The group left early for the Vatican and I slept in. I’ve seen God’s glory from those halls two times before and some recuperation and quiet after 8 days of social travel is much needed. After getting cleaned up and grabbing something to eat, I take the early afternoon underground train down to the San Saba neighborhood and through the gates of the Protestant cemetery that resides there. The gravestones and pyramid evoke the memory of a previous visit to this same place in years past. I’m a bit surprised by the number of who have made this same pilgrimage to the resting place of John Keats and at the same time I’m not."}, {"t": "p", "v": "There are two wooden benches and I take a seat. I pull up some of his poems on my phone and am reminded why his words resonated so much to a younger self. Truth is beauty, beauty truth. Much of life’s intricacies could be unwrapped in that statement alone."}, {"t": "p", "v": "After returning to the hotel, Peyton and I grab some beers from the nearby grocery store and step outside to the seating area beside the hotel. We’ve invited Tiera and Arla and the conversation is both easy and engaging. Eventually more of the group walk by outside and join for beers — among them Jayden, Ben, and Kyle. We call it an early night in preparation for a big NYE ahead."}, {"t": "h4", "v": "\u0003Dec 31\u0004"}, {"t": "p", "v": "We rise early and make our way north to Florence. Starting with a walking tour through the cobbled streets we admire Michelangelo’s marble statue of David — with his veiny forearms and larger than life hands. I can’t help but admire the craftsmanship and years of effort. A true artist. In the same square, the bronze statue of Perseus standing over the body of Medusa while holding her head aloft. Greek mythology in an Italian piazza. Checks out."}, {"t": "p", "v": "Arriving at the hotel, we get cleaned up and make our way to the city’s center along the river for a night out to celebrate New Year’s Eve. The guys make half-ass attempts to dress up and the girls are dressed to the nines. The bar has karaoke and Peyton and I get dragged onstage by Tania and Kate to sing Die Young by Kesha. Thank god we’re a dozen drinks deep."}, {"t": "p", "v": "We leave the bar at 3am and struggle to find a taxi given the tram is down for the night. Sleep finally comes way past 5am with a 7am morning call ahead. Onwards and upwards."}, {"t": "h4", "v": "\u0003Jan 1\u0004"}, {"t": "p", "v": "It’s another big coach day as we head from Florence to Lucerne and everyone is incredibly tired. I doze off for a few hours and awake to the steeped slopes of the Swiss Alps and their snow covered caps."}, {"t": "h4", "v": "\u0003Jan 4\u0004"}, {"t": "p", "v": "Last day as a group. Closing thoughts? Final feelings?"}, {"t": "p", "v": "Europe. A return to form. Traditions that have been long contemplated and even longer enacted. The change of pace is refreshing. Stop trying to move so fast and seek ease in the simplicities of life. Cafés, wine, and midnight walks along the riverfront. Affection originated here. Love too. Probably beneath the Eiffel Tower with a bottle of wine in hand (if I had to guess)."}, {"t": "p", "v": "How can one stumble the cobbled streets of Florence or Paris and not entertain romantic notions?"}, {"t": "img", "src": "img/january-01.jpg", "w": 1088, "h": 300, "cap": "", "mw": 400, "mh": 440}, {"t": "h3", "v": "Some Literature"}, {"t": "verse", "v": "(i do not know what it is about you that closes\nand opens;only something in me understands\nthe voice of your eyes is deeper than all roses)"}, {"t": "p", "v": "- EE Cummings", "cls": "att"}], "mode": "two"}, {"slug": "february-24", "title": "February ’24", "deck": "Nightclubs, relativity, and werewolves", "eyebrow": "February 22, 2024", "mov": "2024", "blocks": [{"t": "img", "src": "img/february-24-00.jpg", "w": 1440, "h": 1080, "cap": "Scene from the film ‘Saltburn’", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "The Nightclub Industry"}, {"t": "p", "v": "I’ve always found the nightclub scene a fascinating enigma. It’s one of those social strata’s that is \u0001technically\u0002 legal, but is surrounded by the seedier aspects of human nature (nudity, drugs, prostitution, etc). As such, I opened an incognito browser tab and proceeded deep into the internet matrix to find some answers."}, {"t": "h4", "v": "How to Become a Stripper"}, {"t": "li", "v": "<span class=\"lp\">Pole dancing classes are oft-recommended as a starting point</span>", "ord": true, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Scout your local clubs and visit as a “customer”. This serves two purposes:</span>", "ord": true, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Opportunity to learn how others do it</span>", "ord": true, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Find a club that makes you feel comfortable</span>", "ord": true, "n": 2, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Apply for an interview. There tends to be two mechanisms for this:</span>", "ord": true, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">“Amateur night”</span>", "ord": true, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">A group style interview for new guys/<wbr/>girls</span>", "ord": true, "n": 1, "d": 2}, {"t": "li", "v": "<span class=\"lp\">Apply online or over the phone</span>", "ord": true, "n": 2, "d": 1}, {"t": "p", "v": "\u0001Referencing: How to start out stripping? (Reddit) \u0006reddit.com/r/IWantToLearn/comments/cmjj4p/how_to_start_out_stripping\u0007\u0002"}, {"t": "h4", "v": "Why Though?"}, {"t": "p", "v": "This is ultimately what fascinates me about the nightclub industry. How is someone drawn into this? And why?"}, {"t": "p", "v": "I think the common stereotype is that strippers (male or female) do it for money. And while this may be true, it can’t be the only reason why someone would want to take their clothes off in front of total strangers…right? When most people decide they need more money, they pursue a mundane part time job — like pouring coffee at Starbucks or driving for Uber — but if this is the case (generally speaking) who are the folks taking pole dancing lessons after work?"}, {"t": "p", "v": "To understand the psyche of these people, I think it’s important to step back and consider the job function. What is it about “stripping” and “dancing” that is so appealing?"}, {"t": "p", "v": "For one, it takes immense confidence to get up in front of a large crowd (even more so if you’re doing it naked or near-naked). I’d even argue that \u0001being a stripper\u0002 is likely very empowering. Body positivity, communication, and understanding and engaging your audience are all skills required to be successful."}, {"t": "p", "v": "On top of this, there is the often ill-considered element of “seduction” at play, which in my opinion is often given a bad rap. I think seduction is often associated with promiscuous behavior (which it is) but everyone has tried to seduce someone else in their adult life. Your cute coworker? That special someone you danced with at your friend’s wedding? And how did you engage this person? Did you use body language? Eye contact? Tone of voice? Yeah you did. You tried to seduce them."}, {"t": "p", "v": "TL;DR — I don’t know where I was going with this essay haha. I think I just find the whole seedy/underground nature of nightclubs a really interesting social dichotomy."}, {"t": "h3", "v": "General Relativity (an attempt at layman’s terms)"}, {"t": "p", "v": "I was having a conversation with a friend recently about general relativity and how gravity affects time. It was through this conversation that I realized \u0001just how difficult it is\u0002 to wrap one’s head around the concept of light, gravity, and time all being interrelated. As such, I will now give my best attempt at a TL;DR for Mr. Albert Einstein."}, {"t": "p", "v": "In Einstein’s original thesis, he gives us an example where a man stands on a train platform and measures the speed of light and finds it to be equal to some value C. The man then hops aboard the next train and measures the speed of light once again and finds it to be exact same value. Now, the reason this should confuse you is because this is not how the classical laws of physics work. Consider the following illustration:"}, {"t": "img", "src": "img/february-24-01.png", "w": 584, "h": 513, "cap": "“Relativity”", "mw": 400, "mh": 440}, {"t": "p", "v": "If the man boards the train and is headed \u0001towards \u0002the light source then you would expect the measured value of the speed of light to be C + (speed of train). Whereas if the man boards the train and is headed \u0001away \u0002from the source of light, then you’d have the same case as the illustration above and expect the speed of light to be C - (speed of train). What this implicates is that the speed of light is \u0001constant\u0002."}, {"t": "p", "v": "Now, the next step in explaining general relativity is a bit of a leap and can be hard to wrap your head around, but bear with me."}, {"t": "p", "v": "Our conception of “time” and “reality” are one and the same. That is, what we perceive each waking moment as the seconds tick by is our \u0001interpretation \u0002of “this reality”. And from our discussion above, we established that the speed of light is \u0001constant\u0002. Therefore — and this is where the big leap is gonna be, so try and wrap your head around this — \u0001our interpretation of time and reality is relative to the speed of light\u0002. You can think of it as “everything we see and do through every waking moment is relative to this constant thing: the speed of light”."}, {"t": "p", "v": "Finally, the last element to all of this, \u0003gravity\u0004."}, {"t": "p", "v": "The reason why gravity distorts time is because it warps the path upon which light must travel."}, {"t": "img", "src": "img/february-24-02.jpg", "w": 602, "h": 475, "cap": "", "mw": 400, "mh": 440}, {"t": "p", "v": "In the illustration above, we can see three objects with increasing gravitational fields. As light travels through space and approaches one of these objects, its path gets \u0001bent\u0002. What this means, is that light photons have to travel a longer path to cover the same “distance” (in our three dimensions that is)."}, {"t": "p", "v": "So if you’re an astronaut standing near a black hole, light has to travel a longer path due to the immense gravitational field, but we have already established that the speed of light is a constant value C and that our notion of time is relative to it."}, {"t": "p", "v": "Therefore:"}, {"t": "li", "v": "<span class=\"lp\">Longer path of light = slower time</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Shorter path of light = faster time. </span>", "ord": false, "n": 2, "d": 0}, {"t": "dept", "v": "Some Literature"}, {"t": "p", "v": "\u0001KROQ is playing old Doors songs and War of the Worlds is on channel thirteen and I switch it to some religious program where this preacher is yelling \"Let God use you. God wants to use you. Lie back and let him use you, use you.\" \"Lie back,\" he keeps chanting. \"Use you, use you.\" I'm drinking gin and melted ice in bed and imagine that I can hear someone breaking in. But Daniel says, over the phone, that it's probably my sisters getting something to drink. It's hard to believe Daniel tonight; on the news I hear there were four people beaten to death in the hills last night and I stay up most of the night, looking out the window, staring into the backyard, looking for werewolves.\u0002", "cls": "q"}, {"t": "p", "v": "\u0003- Bret Easton Ellis (Less Than Zero)\u0004", "cls": "q"}, {"t": "img", "src": "img/february-24-03.png", "w": 1088, "h": 299, "cap": "", "mw": 400, "mh": 440}], "mode": "two"}, {"slug": "march-24", "title": "March ’24", "deck": "Greek history, legacy thinking, and some self reflection", "eyebrow": "March 20, 2024", "mov": "2024", "blocks": [{"t": "img", "src": "img/march-24-00.jpg", "w": 737, "h": 600, "cap": "Untitled (Boxer) by Jean-Michel Basquiat, 1982", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "The Homeric Question"}, {"t": "p", "v": "I was doing some research the other night, trying to find a good book that discusses Greek history from a cultural perspective. What I mean by that, is that I’m not all that interested in reading Greek myths, but rather something more akin to Greek society and their way of life since so much of Western culture is rooted in Greco-Roman tradition. Ultimately I stumbled upon a Quora thread that had this really interesting tidbit:"}, {"t": "p", "v": "Homer is pretty essential, since so much later Greek literature involves quotations from or arguments with Homer. It can however be tough going off the bat, since it is literally pre-literary: our versions are essentially a 'recording' of an oral performance of works that may be as much as 400 years older than the text.", "cls": "q"}, {"t": "p", "v": "And this fascinates me."}, {"t": "p", "v": "Basically, the argument for reading Homer\u0001 \u0002is that prior to what we now consider “literature” — things like Shakespearean plays and Fitzgerald novels — there was only verbal story telling. We didn’t write things down, we told each other stories by candlelight and across dinner tables. That’s what makes this so particularly interesting. Homerian stories are the stories that \u0001lasted\u0002. They were the stories we told for \u0001centuries\u0002. They were the first stories we felt obligated to \u0001write down\u0002."}, {"t": "p", "v": "To truly grasp how important Homer and his works are, consider this:"}, {"t": "p", "v": "Fragments of Homer account for nearly half of all identifiable Greek papyrus finds.", "cls": "pull"}, {"t": "p", "v": "The Greeks were the foremost Western society. You could even argue much of Roman tradition stems from the Greeks. And meanwhile NEARLY HALF of all Greek writings make reference to Homer."}, {"t": "p", "v": "What does this tell us? That stories like \u0001The Odyssey \u0002and \u0001The Iliad\u0002 form the bedrock of Western society. That these tales of Achilles and Ulysses and wandering and love and angry Greek gods were \u0003important\u0004. That these were the words spoken from steps of the Acropolis."}, {"t": "p", "v": "And here we are thousands of years later, grandchildren to this enormous tradition."}, {"t": "h3", "v": "Legacy Thinking"}, {"t": "p", "v": "Years ago, when tech companies were first developing touchscreens, they assumed a ‘stylus’ would be our natural interaction with said devices (and you can probably understand why). We’d been using pencils and paper for thousands of years. If we’re gonna touch, write, drag, and drop then it makes sense to do so with a pseudo-pen right??"}, {"t": "p", "v": "As it actually turns out, that’s not how we’re naturally inclined to interact with touchscreens. Instead, we use our thumbs."}, {"t": "p", "v": "Now consider a different use case:"}, {"t": "img", "src": "img/march-24-01.jpg", "w": 1440, "h": 810, "cap": "Boston Dynamics", "mw": 707.5, "mh": 520}, {"t": "p", "v": "Places like Boston Dynamics are building the next generation of robotics and what do they look like? Humans."}, {"t": "p", "v": "I was reading one of Benedict Evan’s recent essays about LLMs and their use cases and he made a very good point about “legacy thinking”:"}, {"t": "p", "v": "\u0001Whenever we get a new tool, we start by forcing it to fit our existing ways of working, and then over time we change the work to fit the new tool. \u0002", "cls": "q"}, {"t": "p", "v": "We stand on the brink of a technological revolution and its industry is filled with smart people pitching the same ideas. This is exactly why engineers at Intel used to kick LSD :p"}, {"t": "h3", "v": "Reflections on Solitude"}, {"t": "p", "v": "I spend a lot of time alone. I mean, I’ve been living alone for nearly four years (closer to five if you count the six months I spent alone in a London apartment during my junior year of college). Yet, you might think there is something wrong with that. That I must be lonely, and depressed. That I struggle to be around others. And while that may have been true of a younger self, I’d hardly accept such a label at this point in my life."}, {"t": "p", "v": "It can be hard to describe, explaining what its like being alone for days, weeks, months on end. The days meld together, as I’m sure they do for everyone else, yet there is something very specifically ‘solitary’ about it. It’s almost like meditating? And I don’t mean five minutes of sitting on the couch deep in thought. I mean, laying on your carpeted apartment floor and watching clouds crawl across the sky for hours. Then realizing the time and thinking back to that deep state of mind you had arrested only a moment ago, yet you’ve lost something in translation. Like trying to pull back the curtain on last night’s dream, only to find you can’t remember a damned thing."}, {"t": "p", "v": "I’ll also be the first one to admit that there are definitely those periods of intense loneliness. That’s inevitable. It’s how you choose to spend the rest of your time though — amongst others or alone — that really defines your self awareness. How can you have a deep understanding of yourself when you spend your life’s entirety caught up in everyone else?"}, {"t": "p", "v": "I’ll probably catch a lot of flack for that last point for being “selfish” — but that’s not what it is. It would be selfish to choose oneself over another if done so from a standpoint of pleasure. Skip church and play video games for example. You don’t have a reason to skip, other than the desire to play video games. It’s compromising of your moral character. But if I choose to stay in on a Friday and forgo happy hour with friends, it’s not because I’m copping out out of pleasure — it’s because I recognize the need for alone time. To make dinner and listen to my favorite playlist. Read obscure philosophy and sip rye whisky before an early bedtime."}, {"t": "p", "v": "To me, solitude is about recharging."}, {"t": "h3", "v": "Some Literature"}, {"t": "verse", "v": "Sing to me of the man, Muse, the man of twists and turns...\ndriven time and again off course, once he had plundered\nthe hallowed heights of Troy."}, {"t": "p", "v": "- Homer (The Odyssey)", "cls": "att"}], "mode": "two"}, {"slug": "april-24", "title": "April ’24", "deck": "Social media, gravitational collapse, and dating apps", "eyebrow": "April 25, 2024", "mov": "2024", "blocks": [{"t": "img", "src": "img/april-24-00.jpg", "w": 673, "h": 457, "cap": "7.3.89 (SILS MARIA) by Gerhard Richter", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Social Media (and self control)"}, {"t": "p", "v": "Social media is as polarizing as politics these days. At the root of which, there are two extreme responses."}, {"t": "p", "v": "There are those whom entire life revolves around their online profile (as well as the profile of others). These are the stereotypical strawmen for the argument against social media and its dictates. These people are hooked. Addicted. Death scrollers and influencers alike. Locked in a tight spiral between crafting an image of themselves that is both genuinely their own as well as fashionably self conscious — an attempt at making your perceived life more glamorous."}, {"t": "p", "v": "Then there are those whom reject social media entirely. They look upon the aforementioned society with disdain. Rejecting the affluence of social media in our modern Gilded Age and villainizing it entirely. Deleting all social media and taking to the streets to proclaim how much better their life has become as a result."}, {"t": "p", "v": "Now I ask, whom is right? And this is where I’d like to make the “moderate” argument (which honestly sounds like a cop out now that I say it aloud)."}, {"t": "p", "v": "For years, I’ve fallen into the camp of “social media is the bane of human existence” and this was rooted in my own relationship with said technology (and the lack of willpower thereof). But as I’ve gotten older, and attained a greater degree of self-control, I find myself swaying back towards a more moderate stance."}, {"t": "p", "v": "Consider this. If you can’t spend five minutes on Instagram checking life updates from friends — without it turning into 2 hours of doom scrolling — is that a fault of social media? Or your own?"}, {"t": "p", "v": "It’s like the old saying goes, everything in moderation. If you don’t have the willpower to limit your social media time, then sure, deleting it entirely is the logical next step. But don’t disdain others for it. That’s throwing stones while living in a glass house."}, {"t": "h3", "v": "Gravitational Collapse"}, {"t": "p", "v": "Gravitational collapse is known as “\u0001the contraction of an astronomical object due to the influence of its own gravity, which tends to draw matter inward toward the center of gravity\u0002” [1]. In other words, gravitational collapse occurs when an object in space grows too large and the force of its own gravity causes it to collapse in on itself."}, {"t": "p", "v": "What’s really interesting about this astronomical process, is that gravitational collapse is the fundamental mechanism for structure formation in the universe. Both the creation of stars and black holes follow this process (just in reverse order)."}, {"t": "p", "v": "Consider the creation of a new star. Clouds of gas that exist throughout the universe will remain in equilibrium as long as the kinetic energy from the gas’s pressure remains in balance with the potential energy of its gravitational force [2]. However, when a cloud of gas grows too large and does not retain enough gas pressure to refute the internal force of its increasing gravity, it will collapse in on itself to form a new star (which is nothing more than a denser form of this collection of gas)."}, {"t": "img", "src": "img/april-24-01.jpg", "w": 800, "h": 834, "cap": "NASA, ESA and the Hubble Heritage Team, Pillars of Creation, 2014", "mw": 400, "mh": 440}, {"t": "p", "v": "The photograph above was taken by the Hubble Space Telescope in 1920 and consists of dense clouds of interstellar gas which are in the process of creating new stars (which is why they are so aptly referred to as the Pillars of Creation)."}, {"t": "p", "v": "Now consider the process in reverse. When a star reaches end of life, and has burned through its internal kinetic energy, it will follow a similar process (and collapse in on itself). However, the result is very different:"}, {"t": "img", "src": "img/april-24-02.jpg", "w": 560, "h": 287, "cap": "“The Formation of White Dwarf Stars”", "mw": 400, "mh": 440}, {"t": "p", "v": "We can see outlined above that average sized stars collapse into “white dwarfs” and massive stars collapse to either “neutron stars” or black holes. Whether a massive star becomes a neutron star or black hole after gravitational collapse depends on its size. According to the Tolman–Oppenheimer–Volkoff limit, if a star is roughly double the mass of the Sun, no known form of cold matter can provide the force needed to oppose it’s gravitational contraction once started (which will continue unopposed until a black hole is formed) [3]."}, {"t": "p", "v": "In short, gravitational collapse is responsible for the creation—and likewise demise—of our universe’s fundamental astronomy. And like most of things in nature, it comes down to a very simple relationship. In this case, gas pressure and gravity."}, {"t": "h4", "v": "\u0003References\u0004"}, {"t": "li", "v": "<span class=\"lp\"><em>Gravitational Collapse <a class=\"url\" href=\"https://en.wikipedia.org/wiki/Gravitational_collapse\" target=\"_blank\" rel=\"noopener\">en.wikipedia.org/wiki/Gravitational_collapse</a></em></span>", "ord": true, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\"><em>Virial Theorem <a class=\"url\" href=\"https://en.wikipedia.org/wiki/Virial_theorem\" target=\"_blank\" rel=\"noopener\">en.wikipedia.org/wiki/Virial_theorem</a></em></span>", "ord": true, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\"><em>Tolman–Oppenheimer–Volkoff limit <a class=\"url\" href=\"https://en.wikipedia.org/wiki/Tolman%E2%80%93Oppenheimer%E2%80%93Volkoff_limit\" target=\"_blank\" rel=\"noopener\">en.wikipedia.org/wiki/Tolman%E2%80%93Oppenheimer%E2%80%93Volkoff_limit</a></em></span>", "ord": true, "n": 3, "d": 0}, {"t": "h3", "v": "Dating Apps"}, {"t": "p", "v": "Dating apps have a myriad of issues, one of which is the sheer multitude of \u0001options\u0002. When you see dozens, if not hundreds, of attractive men or women in the span of a couple hours of swiping, it becomes difficult to commit. Likewise, when you match with someone, whether the conversation is proceeding apace or begins to fizzle out, there’s nothing stopping you from chatting it up with some other cutie a swipe and two taps away."}, {"t": "p", "v": "Now, this isn’t a hit piece on dating apps (enough has been said on that topic already). Instead, let’s brainstorm a better alternative. Consider the problem just described:"}, {"t": "li", "v": "<span class=\"lp\">Too many options</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">No reason to commit</span>", "ord": false, "n": 2, "d": 0}, {"t": "p", "v": "How can this be solved outside of physically approaching someone in the real world and asking them on a date? (lol, who even does this anymore :p)"}, {"t": "p", "v": "Picture this. A new dating app that appears on the surface to be just like any other. You make a profile with pictures and a modicum of self interests, and swipe
