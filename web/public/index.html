left and right until you find someone who catches your eye. Now, this is where the key difference is going to be. Instead of “liking” or “matching” with this person — you are responsible for proposing a date. There is a pop up box where you select a coffee shop, restaurant, etc and enter a date and time. Maybe you even include a little message “Hey X — looking forward to meeting you!” From here, your proposal gets reviewed by the opposing party. They can either accept or reject. If they accept, you now have a date on the calendar. No small talk. No ghosting. No bullshit. You show up on the day and time and meet for a (hopefully) pleasant encounter. Now, that’s not to say your date will actually show up. (I’ve actually had this happen by the way, met someone at a coffee shop and we exchanged numbers and were supposed to meet for a beer after work and she never showed.) That said, this predicament could be solved using a “feedback mechanism”. At the end of every date, you and your partner must each leave feedback that includes whether they showed up, whether their profile was accurate, etc etc. This data would ultimately feed back into your “dating score” which is visible on your profile and can be used by potential partners to gauge your authenticity."}, {"t": "p", "v": "This was just something I was kicking around a while back with some buddies over a few beers. In the event that some executive over at Tinder or Hinge reads this and creates a new dating app — you’ve been warned. Let the record state that this idea is my intellectual property :D"}, {"t": "h3", "v": "Some Literature"}, {"t": "verse", "v": "I'm an anywhere-but-here-bound highway\nYou're a 'round-here long gravel driveway\nBut, oh, you know, if I had it my way\nThe hometown girl in your heart\nWould get to gettin' gone"}, {"t": "p", "v": "- Bailey Zimmerman (Get to Gettin' Gone)", "cls": "att"}], "mode": "two"}, {"slug": "may-24", "title": "May ’24", "deck": "LLMs, cinematography, and Hemingway", "eyebrow": "May 20, 2024", "mov": "2024", "blocks": [{"t": "img", "src": "img/may-24-00.png", "w": 1534, "h": 815, "cap": "Leonardo DiCaprio starring in ‘The Aviator’", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "10/23/23"}, {"t": "verse", "v": "Purple pettled peonies\nAll bundled up\nIn my hands"}, {"t": "verse", "v": "And I got here early\nSat down and scoped the clouds"}, {"t": "verse", "v": "“Hey you”"}, {"t": "h3", "v": "04/09/24"}, {"t": "verse", "v": "Lo, the restless mountain stream."}, {"t": "verse", "v": "Blue jeans rolled to the ankle,\ntrout rising in the dappled evening light."}, {"t": "verse", "v": "And above,\nmoving slowly across the evening sky,\na lone ship."}, {"t": "verse", "v": "Being carried on it’s way,\nby taut moonsails."}, {"t": "h3", "v": "LLMs and AGI — Problems at Scale"}, {"t": "p", "v": "Human-esque consciousness is defined by our innate ability to “reason”. Even when faced with novel problems, we are able to draw upon our vast historical and real-time sensory data and come to some decision, and as it turns out this is \u0001exactly \u0002what makes artificial general intelligence (AGI) so difficult to create."}, {"t": "p", "v": "Consider a scenario where you are sitting at a kitchen table with a human friend and a robotic AGI. There is an apple sitting on the table between you, but it is badly bruised and has a wormhole through its center. Across the kitchen, however, there is a bowl of perfectly ripe alternatives."}, {"t": "img", "src": "img/may-24-01.jpg", "w": 1024, "h": 1024, "cap": "", "mw": 400, "mh": 440}, {"t": "p", "v": "You start by asking the robot for an apple. The robotic AI “computes” your statement, compares what it “sees” to the millions of images stored in memory, determines that the red object on the table is indeed an apple, and ultimately reaches out and hands it over to you."}, {"t": "p", "v": "Now consider posing the same question to your friend. Your friend uses their sensory data—eyes and ears—to “understand” what you’re asking them and then “reasons” as to the required action. In this case they understand that you want an apple, but deduce that you can’t possibly want the bruised and worm-infested one of the table, so they stand up and grab you a fresh one from across the kitchen."}, {"t": "p", "v": "This is a rudimentary example, but it’s demonstrative of the core problem facing AI researchers today. We as humans process SO MUCH DATA. And not only do we “process” all this sensory data, but we store it deep in our neurophysiology and can seemingly access and reason with it at any waking moment. So while LLMs (like ChatGPT) have been a significant breakthrough in “understanding large bodies of language” they still dwarf in comparison to the human brain."}, {"t": "p", "v": "This begs the question:"}, {"t": "p", "v": "\u0001 if we hook up LLMs to more GPUs…\u0002"}, {"t": "p", "v": "\u0001 if we feed them more data…\u0002"}, {"t": "p", "v": "\u0001 if we simply \u0003SCALE \u0004to the computing power of the human brain…\u0002"}, {"t": "p", "v": "Is that when we achieve “intelligence”?"}, {"t": "p", "v": "Just because you give LLMs more data, doesn’t mean they’ll be able to reason like the human intellect can. Going back to our example, your friend understood that the apple on the table was \u0003inedible\u0004. But how did they know this? If the apple only had a small bruise, you’d probably eat it right? Was it the extensive bruising that made it inedible? The wormhole at its center? Where’s the cutoff point?"}, {"t": "p", "v": "While LLMs are sexy and exciting right now, they don’t necessarily solve the fundamental problem of AGI. Sure, more data and more compute likely makes them better at what they do. But is what they do truly intelligent?"}, {"t": "h3", "v": "The Art of Cinematography"}, {"t": "p", "v": "A film is comprised of so many distinct elements that its no wonder the credits seem to go on forever. Stage production, costume design, plotlines, dialogue, character arcs…the list goes on and on. But in my opinion, it’s the cinematography—the orientation of light, framing of the scene, camera movement—that ultimately draws the viewer into the narrative."}, {"t": "p", "v": "Consider this still from \u0001Past Lives\u0002:"}, {"t": "img", "src": "img/may-24-02.jpg", "w": 1920, "h": 1040, "cap": "Past Lives, 2023", "mw": 707.5, "mh": 520}, {"t": "p", "v": "The globe lights hanging from the trees…juxtaposed with the early evening dusk…our main characters trudging the horizon line…such a great shot."}, {"t": "p", "v": "Here’s another still from \u0001Ad Astra\u0002 where Brad Pitt’s character looks up in contemplation of his missing father:"}, {"t": "img", "src": "img/may-24-03.jpg", "w": 1920, "h": 805, "cap": "Ad Astra, 2019", "mw": 707.5, "mh": 520}, {"t": "p", "v": "You can see the background lighting which indicates he is still on Mars, but the overhead light source was purposefully placed to evoke the “searching” gleam in his eyes."}, {"t": "p", "v": "And this is probably my favorite shot from any movie ever:"}, {"t": "img", "src": "img/may-24-04.jpg", "w": 1920, "h": 800, "cap": "Blade Runner 2049, 2017", "mw": 707.5, "mh": 520}, {"t": "p", "v": "In \u0001Blade Runner 2049\u0002, Ana de Armas plays a digital AI whom Ryan Gosling’s character falls insensibly (but understandably) in love with."}, {"t": "p", "v": "There’s so much value that can be garnered from a film without the use of dialogue. Short scenes where the main character stares off into the distance. Brief cuts to nature where the river gurgles and the trees shake in the wind. As a viewer, you FEEL these things in a way that is beyond words."}, {"t": "p", "v": "It’s like Hemingway’s “Iceberg Theory”. There’s a certain power that comes from the act of omission \u0001— \u0002that deeper meaning can only shine through implicitly…"}, {"t": "img", "src": "img/may-24-05.jpg", "w": 1920, "h": 1080, "cap": "", "mw": 707.5, "mh": 520}, {"t": "dept", "v": "Some Literature"}, {"t": "p", "v": "“Oh Jake,\" Brett said, \"We could have had such a damned good time together.\"", "cls": "lit"}, {"t": "p", "v": "Ahead was a mounted policeman in khaki directing traffic. He raised his baton. The car slowed suddenly, pressing Brett against me.", "cls": "lit"}, {"t": "p", "v": "\"Yes,\" I said. \"Isn't it pretty to think so?”", "cls": "lit"}, {"t": "p", "v": "― Ernest Hemingway (The Sun Also Rises)", "cls": "att"}], "mode": "two"}, {"slug": "august-24", "title": "August ’24", "deck": "Privilege, corporatism, and obscurity", "eyebrow": "August 20, 2024", "mov": "2024", "blocks": [{"t": "img", "src": "img/august-24-00.jpg", "w": 673, "h": 487, "cap": "18.1.89 by Gerhard Richter", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Pretty Privilege"}, {"t": "p", "v": "Driving into work this morning, having just taken the 7th Street exit into downtown Minneapolis, I realized I was once again talking to myself. In fact, I oftentimes find myself ideating aloud when considering something for the first time. It’s almost like I have to say it to believe it. Then the opinion can be locked away for future retrieval whenever beget the opportunity."}, {"t": "p", "v": "This morning’s self lecture centered around “pretty privilege”. I can’t quite remember what got the ball rolling, but it was something akin to the opinion that attractive people have it easier in life. And there are all kinds of studies that back this supposition. Corporate employees whom are objectively more attractive tend to get promoted faster, an astounding number of the world’s CEO’s stand over six feet tall, your cute friend always get asked out on more dates, etc etc."}, {"t": "p", "v": "And while all of this may be true, I kept thinking about the adverse side effects. I for one, knew several guys in college whom were extremely handsome from a young age. Tall, broad shouldered, personable, and intelligent. Then they went to college and joined a fraternity. Date parties and drugs. Liquor and sorority girls. And before you know it, these objectively handsome men who came from middle of nowhere sheltered communities found themselves doing coke in the hotel bathroom with some bombshell sorority girl they’d just met."}, {"t": "p", "v": "Now the question becomes, was it their fault? These naïve young men certainly made their own beds (and should likewise sleep in them). But how many of us have truly known what it is like to be the most attractive person in nearly every social setting? We all know these people, they put that workout routine you’ve been grinding for 5 years to shame. And you can’t help but think that they must have it \u0001so easy\u0002. I get it, we all do, it’s an innately human response."}, {"t": "p", "v": "Yet I want to come back to my primary point. It’s easy to judge supermodels for abusing their pretty privilege. But have you stood in their shoes? And had beautiful women (or men) consistently throw themselves at you? You’re telling me you could say no? Every single time?"}, {"t": "p", "v": "I’d like to think I could, but I’ve never been in that situation. That’s the point."}, {"t": "p", "v": "Empathy for others grows with understanding. And you can’t judge that which cannot be fathomed."}, {"t": "h3", "v": "Messier 106"}, {"t": "p", "v": "Like most galaxies, the Milky Way has a supermassive black hole at it’s center. The gravity of which keeps matter in orbit (such as stars and gas clouds). It’s no different than the Sun at the center of our solar system keeping the planets encircled. That said, the Milky Way is a relatively stable galaxy and the orbits of interstellar mass are fairly consistent. All of which goes to say that the black hole at the center of the Milky Way is pretty inactive:"}, {"t": "img", "src": "img/august-24-01.jpg", "w": 849, "h": 360, "cap": "", "mw": 400, "mh": 440}, {"t": "p", "v": "But last week, the James Webb Space Telescope took some near-infrared images of a nearby galaxy referred to as Messier 106 (discovered by Charles Messier’s assistant, Pierre Méchain, in 1781) and the results are pretty astounding:"}, {"t": "img", "src": "img/august-24-02.jpg", "w": 1280, "h": 1000, "cap": "NASA, Messier 106", "mw": 707.5, "mh": 520}, {"t": "p", "v": "What you’ll notice is that Messier 106 is extremely “bright” and this is a direct result of the supermassive black hole at its center actively “swallowing up” matter. As gas, dust, (and even planets) get sucked into the downward spiral of the black hole, it results in the heating of matter and the emission of light."}, {"t": "p", "v": "The image reveals another striking feature of Messier 106: its extra pair of arms. Most spiral galaxies only have one pair of arms, but Messier 106 has an extra set, seen above as red wisps of gas which astronomers believe to be an indirect result of the violent churning around the black hole’s event horizon."}, {"t": "p", "v": "\u0001Reference: NASA\u0002"}, {"t": "h3", "v": "Corporatism as a Societal Construct"}, {"t": "p", "v": "As I grow into my late 20s, I start to see more commonality amongst my peers. It’s like this cyclical loop of existential crisis we all seem to go through, but to varying degrees and to differing effect."}, {"t": "p", "v": "It typically starts in high school, as you deal with the “crisis” that is your lifelong progression. College or trade school or working for your parents. To move across the country or stay close to home."}, {"t": "p", "v": "Then you begin to doubt yourself. Doubt your decisions. Contemplate 40 years in some career you chose based on a sales pitch in the local college recruitment pamphlet. But most of us figure things out prior to graduation and take that 9-5 job. The rest of us either drop out and recuperate or continue on with our education through grad school (partially as a means to an end, but also as a means to prolong the inevitable). Yet, no matter how long it takes to arrive, we all jump into that “adult job” with enthusiasm and vigor; finally arriving to some a formerly wanton conclusion."}, {"t": "p", "v": "But what I keep seeing more and more of, is everyone my age growing disillusioned with their career. Sometimes to the point of sheer existentialism — “what am I doing with my life” — but more frequently hitting the wall of corporate nepotism. The point where your accomplishments and talent will only take you so far. Where your tenure and “years of experience” trump that promotion you’ve been so eagerly vying for."}, {"t": "p", "v": "So you take a step back. Don’t go out of your way. Stick to 40 hours a week and look for fulfillment elsewhere in life. All of which is more healthy."}, {"t": "p", "v": "Yet I beg the question, is this what life truly entails? 2 million dollars accrued across 40 years dispersed every two weeks? A vapid lifestyle centered around 40 hours in a cubicle staring at a pixelized screen?"}, {"t": "p", "v": "Corporatism is an outdated structure for society, fostered by 1950s consumerism. It’s no wonder our youngest generation wants to “influence” and “dropship”. Who’d wanna run the rat race?"}, {"t": "h3", "v": "Obscure Interests"}, {"t": "p", "v": "I think a lot of people have these. Those rabbit holes you go down on the internet late at night. Maybe its sports related or tracking weather patterns or looking up fancy houses on Zillow that none of us can afford. You may only have one of these. I have several."}, {"t": "p", "v": "I’m going to group literature and poetry together as one of these. Not only do I spend a lot of time reading these things, I’m obsessed with the entire field. Authors and who they were in real life. Where romantic poets found their inspiration (a surprising number of which don’t stem from a lover). And probably the most prominent of which is reading other people’s reviews of books on Reddit. I seldom weigh in on these online communities, it’s simply the various perspectives that proves to be so interesting."}, {"t": "p", "v": "Another one of these obscure interests surrounds art, more recently the works of Gerhard Richter. I don’t even remember how I found this guy, it was months ago. But I’ll spend hours on an occasional Sunday just clicking through his catalog. Especially his painted over photographs (one of which is the header for this month’s publication)."}, {"t": "p", "v": "When it comes to technology, the only person I follow is Benedict Evans. He has an incredible sense for where the tech industry is and where things are headed."}, {"t": "p", "v": "Lastly, and the one I am going to get the most shit for, is fashion. I don’t know what it is, but ever since I started going into the office post-COVID it’s felt like high school 2.0. Everyone wears their new clothes right after Christmas, balancing “business” with “casual”, seeing someone else pulling off a new fit. I don’t know, it’s interesting. And if I had to give one prediction about men’s fashion, I’d say it has something to do with 1980’s and 90’s streetwear. The high waisted baggy pants. Crop top baggy tees. Vans and New Balance 550s. It’s a combination of casualness and simplicity - but thrown back 30 years to when everyone gave a shit how they looked. Nix the high ankled chinos and microfiber athleisure and step it up this fall boys."}, {"t": "dept", "v": "Some Literature"}, {"t": "verse", "v": "I kissed her tightly and quickly.\nThen a long slow clinging kiss. Her lips opened under mine. Her body began to shake in my arms.\n\"Killer,\" she said softly."}, {"t": "p", "v": "- Raymond Chandler (The Big Sleep)", "cls": "att"}], "mode": "two"}, {"slug": "october-24", "title": "October ’24", "deck": "Late-stage capitalism, the AI bubble, and being present", "eyebrow": "October 22, 2024", "mov": "2024", "blocks": [{"t": "img", "src": "img/october-24-00.png", "w": 1134, "h": 843, "cap": "Do You See Stars, Fascist Superman? by Raymond Pettibon", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Some Poems"}, {"t": "p", "v": "A few of my favorites."}, {"t": "li", "v": "<span class=\"lp\"><strong>When I Heard the Learn’d Astronomer</strong> by Walt Whitman [<a class=\"url\" href=\"https://poetryfoundation.org/poems/45479/when-i-heard-the-learnd-astronomer\" target=\"_blank\" rel=\"noopener\">poetryfoundation.org/poems/45479/when-i-heard-the-learnd-astronomer</a>]</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\"><strong>My mother was a braid of black smoke</strong> by Charles Simic [<a class=\"url\" href=\"https://latimes.com/archives/la-xpm-1990-07-22-bk-843-story.html\" target=\"_blank\" rel=\"noopener\">latimes.com/archives/la-xpm-1990-07-22-bk-843-story.html</a>]</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\"><strong>Working Outside at Night </strong>by Denis Johnson [<a class=\"url\" href=\"https://poetryfoundation.org/poems/48129/working-outside-at-night\" target=\"_blank\" rel=\"noopener\">poetryfoundation.org/poems/48129/working-outside-at-night</a>]</span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\"><strong>High Windows</strong> by Philip Larkin [<a class=\"url\" href=\"https://poetryfoundation.org/poems/48417/high-windows\" target=\"_blank\" rel=\"noopener\">poetryfoundation.org/poems/48417/high-windows</a>]</span>", "ord": false, "n": 4, "d": 0}, {"t": "li", "v": "<span class=\"lp\"><strong>happy</strong> by Lana Del Rey [<a class=\"url\" href=\"https://lanadelrey.fandom.com/wiki/Happy_(poem\" target=\"_blank\" rel=\"noopener\">lanadelrey.fandom.com/wiki/Happy_(poem</a>)]</span>", "ord": false, "n": 5, "d": 0}, {"t": "h3", "v": "Late Stage Capitalism"}, {"t": "p", "v": "From the early 18th century until the tail end of the Civil War, the capitalistic notions of Adam Smith ruled the burgeoning global economy. Fueled by the Industrial Revolution, the growth of domestic markets sparked a highly competitive (and virtually free) market. Likely the purest and most natural born free market phenomenon the world has ever known."}, {"t": "p", "v": "But from the 1870s upwards of 1940 the global economy shifted into monopolistic capitalism. The consolidation of international markets and exploitation of colonial territories resulting in colossal industrial monopolies at the expense of fewer and fewer competitors."}, {"t": "p", "v": "Then the world stage gets interrupted by WWII and the era known as “late stage capitalism” takes root. Multinational corporations. Big banks. Big tech. Mass consumption. Fewer companies exercising inordinate power upon the global economy. Less options provoking an undue sense of assimilation."}, {"t": "p", "v": "And from a cultural perspective, this explains much of what we see today. We’ve moved away the modernistic society which believed in progress for the sake of progress. Away from the era of technological grandeur and popular consensus and instead embraced postmodernist ideals; those which remain skeptical about the meaning of “progress”. In the wake of technological and societal change, all the certainties of life have broken down. As a result, our living world gets destabilized. Making anything questionable, malleable, transient, and impermanent. Ultimately culminating in existentialism, the breaking down of the nuclear family, fluidity of gender and sexual norms, etc etc."}, {"t": "p", "v": "We’re living in the aftermath of a golden age. The long tail to an Adam Smith theocracy. A brave new world."}, {"t": "h3", "v": "The AI Bubble"}, {"t": "p", "v": "Jobs in the tech world are becoming evermore scarce, and while some attribute this to “over-hiring during COVID”, I think there’s more to it."}, {"t": "p", "v": "For starters, two things can be true at once: 1) tech companies over-hired during COVID and 2) tech companies (as well as mom and pop Fortune 500s) are eyeing the burgeoning revolution of artificial intelligence and are hesitant to hire when its unclear what this means."}, {"t": "p", "v": "I truly believe that there’s a very minute portion of the population who understand how today’s AI technology works. And to take it one step further — as someone who works in the industry and did a postgrad on this very subject — I can confirm that \u0003I don’t even fully understand it\u0004."}, {"t": "p", "v": "This leaves a situation where perhaps 1 in 10 humans could explain how ChatGPT works in layman’s terms, and 1 in 100 who could allude to the architecture and mathematics behind such a tech. And lets say 1 in 1000 who could describe the technical stack top to bottom and possesses a deep understanding."}, {"t": "p", "v": "So…we have 99.9% of people who know close to nothing about the intricacies of modern day artificial intelligence (things like generative AI and stable diffusion) and you’re telling me that the CEO’s at places like Walmart and Home Depot are no longer hiring engineers because “AI will replace them”??"}, {"t": "p", "v": "That’s sheer ignorance. To the highest degree."}, {"t": "p", "v": "This honestly feels like the dot com bubble. A lot of speculation and no true understanding. So what’s the result? Do nothing and wait for the bubble to burst?"}, {"t": "p", "v": "Fantastic reasoning Mr. Fox."}, {"t": "h3", "v": "Aside"}, {"t": "p", "v": "you've been on my mind girl", "cls": "lit"}, {"t": "h3", "v": "Being Present"}, {"t": "p", "v": "I’ve been chewing on this subject for months. Both actively and passively. And it presents itself in a variety of ways. For example, I remember hearing something along the lines of “we were happier as kids because we were far more ‘present’”. That effectively, growing older and having more responsibility leads to unparalleled stress and anxiety and a day-to-day where we spend so much time stuck in our heads worrying about things. Many of which never come to fruition."}, {"t": "p", "v": "This brings me back to a few weeks ago, when I had a couple buddies over to show them my new house in Highland Park. We grabbed dinner at the neighborhood pizza joint and came back to my place to smoke cigars and sip aged rye. And at one point, we discussed the nature of “being more present”. Of slowing down and stopping to watch the leaves shake in the wind. When was the last time you glanced up at the sky? Took a couple deep breaths just for the hell of it?"}, {"t": "p", "v": "As someone who’s probably in the 99th percentile of ‘try hard’ when it comes to life ambition, taking a step back and framing my stress as a matter of perspective has really made me so much happier."}, {"t": "p", "v": "Take time as you need it. There’s nothing a man can’t do tomorrow."}, {"t": "dept", "v": "Some Literature"}, {"t": "p", "v": "Because we would not wear any clothes because it was so hot and the window open and the swallows flying over the roofs of the houses and when it was dark afterward and you went to the window very small bats hunting over the houses and close down over the trees and we would drink the capri and the door locked and it hot and only a sheet and the whole night and we would both love each other all night in the hot night in Milan. That was how it ought to be.", "cls": "lit"}, {"t": "p", "v": "- Ernest Hemingway (A Farewell to Arms)", "cls": "att"}], "mode": "two"}, {"slug": "november-24", "title": "November ’24", "deck": "Audrey Hepburn, brainstorming AI, and modern dating", "eyebrow": "November 22, 2024", "mov": "2024", "blocks": [{"t": "img", "src": "img/november-24-00.jpg", "w": 1800, "h": 1331, "cap": "Audrey Hepburn in ‘Breakfast at Tiffany’s’ 👀 🔥 🚀", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Riff"}, {"t": "p", "v": "I haven’t done any creative writing in almost a year, but here’s to hoping I get back to it now that the days are growing shorter."}, {"t": "p", "v": "They loaded the back of the truck with jugs of water and a Pepsi-Cola ice chest that was stocked with tortillas and beans. Walking back to the porch Will grabbed the pair of sleeping rolls and tossed them in back as well and slammed the tailgate shut. Kate and Marlene were standing off the porch a ways, chatting to one another as Teddy came out the front door and gave Kate a hug.", "cls": "riff"}, {"t": "p", "v": "\"We'll be back before you know it,\" he said to Kate. Leaning over he gave Marlene a hug and grabbed his dark green Army surplus backpack and tossed it over his shoulder as he made his way to the pickup.", "cls": "riff"}, {"t": "p", "v": "\"See ya,\" Will said to Marlene and Kate with a wave of his hand.", "cls": "riff"}, {"t": "p", "v": "\"Bye Will...Goodbye Ted...\" said Marlene.", "cls": "riff"}, {"t": "p", "v": "\"Don't be gettin into no trouble, ya hear?\" said Kate casting a knowing look towards Teddy who was already in the cab of the truck. He gave a wide and devious smile of his own in response and started the engine of the pickup.", "cls": "riff"}, {"t": "p", "v": "\"Lets go, we got miles to cover 'fore dark,\" Teddy called from the truck, honking the horn.", "cls": "riff"}, {"t": "p", "v": "Will opened up the passenger side door and threw his pack into the backseat. Hesitating for a moment, he stepped down and jogged over to Marlene, picking her up in a big hug, arms below her waist.", "cls": "riff"}, {"t": "p", "v": "\"See ya round Mar,\" he said and gave her a kiss.", "cls": "riff"}, {"t": "p", "v": "Kate let out a gasp of surprise and Teddy called from the truck, \"I'll be damned,\" and honked the horn loudly.", "cls": "riff"}, {"t": "p", "v": "Will set Mar down and they smiled at each other.", "cls": "riff"}, {"t": "p", "v": "\"See ya round...cowboy,\" she said to Will and patted him lightly on the ass as he turned back towards the truck. Hopping in, Teddy threw the truck into gear and they drove away, the sound of gravel crunching under their tires as they eased out onto the county road.", "cls": "riff"}, {"t": "p", "v": "\"Where did that come from?\" said Teddy.", "cls": "riff"}, {"t": "p", "v": "\"Don't know. Felt right I guess,\" said Will.", "cls": "riff"}, {"t": "h3", "v": "Brainstorming AI (and its use cases)"}, {"t": "p", "v": "Why are people gonna love AI?"}, {"t": "p", "v": "Who wins when AI takes over?"}, {"t": "p", "v": "Who loses?"}, {"t": "p", "v": "Which spaces are the most susceptible to AI?"}, {"t": "p", "v": "Which are the least? Why?"}, {"t": "p", "v": "Which companies are leading the AI race right now?"}, {"t": "p", "v": "Why? What enabled them? What did they have 5 years ago that set them up for this?"}, {"t": "p", "v": "Will AI be like software development? Where you need some nichely trained developers to write code?"}, {"t": "p", "v": "Or will anyone be able to architect AI?"}, {"t": "p", "v": "What makes software development today so nuanced? So difficult? Requiring talented people to do it?"}, {"t": "p", "v": "Smart ambitious people are drawn to the biggest industries. The most lucrative."}, {"t": "p", "v": "First there was investment banking. Then it was big pharma. Then it was big tech. Next it’s AI."}, {"t": "p", "v": "Follow the talent. Where are the top talent of big tech going right now? Startups? Influencers? Content creators?"}, {"t": "p", "v": "These kids running the internet are the first pioneers of the metaverse."}, {"t": "p", "v": "Google is tomorrow’s IBM. How did we know Google was the future back then? They release Google Search and it becomes the most widely used platform in the world. Their scale enables their growth."}, {"t": "p", "v": "Creating something that succeeds at scale. That everyone sees and decides to use it."}, {"t": "p", "v": "It’s too damn convenient. Like a smart phone. Or a car."}, {"t": "p", "v": "Or a robot? Or a personal assistant? As an employee?"}, {"t": "p", "v": "The internet enabled inter-connectivity. Tight small social circles turned into wide thinly kept equivalents."}, {"t": "p", "v": "Do we bring our society close together again? How does AI make that happen?"}, {"t": "p", "v": "Why would I want to be closer to someone?"}, {"t": "p", "v": "Comradery. A sense of humor. Learning something new. Being constantly amazed."}, {"t": "p", "v": "Ideas:"}, {"t": "li", "v": "<span class=\"lp\">A mental health social app. Be matched based on conversation history. Connecting similar personalities to one another.</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Imagine Instagram reels, but longer form. And curated exactly to your interests. Or potentially to your moods? Where you hop on a rainy Sunday afternoon and it knows just what lectures or movie or podcast to listen to. Measures your heart rate for anxiety levels? Learns your reaction patterns based on what you’re watching?</span>", "ord": false, "n": 2, "d": 0}, {"t": "p", "v": "I took a PhD level computer vision class at Columbia University less than a year ago, and the content taught in that class is now irrelevant. Analyzing pixel values and color segmentation replaced by a generalized LLM that can watch an entire YouTube video and summarize it for me in real time."}, {"t": "p", "v": "That’s how fast things are moving."}, {"t": "h3", "v": "Modern Dating"}, {"t": "p", "v": "I get a lot of grief from friends and family for the fact that I’m still single. And not simply that I’m 26 and single, but that I don’t “try”. And from their perspective, I guess it makes sense. I don’t use dating apps. I don’t go out to the bars. I don’t necessarily have a huge social group (and seldom make an attempt to widen my existing). But I guess I just don’t see things the same way. To me, getting on a dating app and going on X number of dates until you meet your person is like trying to force a conclusion. And look, I’m not shaming anyone who’s on a dating app or met their s/o on there. I’m simply saying that’s not where my head is at right now. I’d rather that same intimacy be found organically. Letting two people’s personalities peel back the curtain. Eye contact and just the right kind of smile. Enough to initiate a conversation. Exchange numbers and go out sometime."}, {"t": "p", "v": "I’m a strong believer that you are what you attract. And when I’m out at some bar or swiping on a dating app, I’m the worst version of myself. Neither comfortable nor confident. But a coffee shop on a bright Saturday morning? Or yoga after a long workday? That’s another story entirely. One in which something is bound to happen given enough time…"}, {"t": "img", "src": "img/november-24-01.jpg", "w": 2800, "h": 2356, "cap": "", "mw": 707.5, "mh": 520}, {"t": "dept", "v": "Some Literature"}, {"t": "p", "v": "It was like falling down an elevator shaft and landing in a pool full of mermaids.", "cls": "lit"}, {"t": "p", "v": "- Hunter S. Thompson", "cls": "att"}], "mode": "two"}, {"slug": "december-24", "title": "December ’24", "deck": "Social media, creativity, and inversing black holes", "eyebrow": "December 8, 2024", "mov": "2024", "blocks": [{"t": "img", "src": "img/december-24-00.png", "w": 739, "h": 889, "cap": "Ubik, 1982 by Bob Pepper", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Social Media’s Paradigm Shift"}, {"t": "p", "v": "Social media started out as following your friends and interacting with their content; whether that be opinions on Twitter or wedding photos on Instagram. But there’s been an interesting paradigm shift in recent years to where most people simply don’t post anymore. Instead, everyone just follows content creators. These are the people traveling the world and documenting their experiences. Living out of their van and wandering the desert on peyote. Creating something and showcasing it to their followers. It’s almost as if the lives of our friends have gotten so mundane that we simply don’t care? And the only reason to post is when you take that one big trip of the year? Or find your person?"}, {"t": "p", "v": "Perhaps more importantly, what does this mean about the future of social media? Machine learning models are already curating content to optimize our dopamine hits. So what’s next? Entirely generative content? That already exists to some degree, where AI generates fake videos and we laugh and gasp because we don’t know any better. And this is problematic for obvious reasons, but does that change anything? At the end of the day, it seems like we simply yearn to be entertained."}, {"t": "p", "v": "Give humans the ability share their stories and someone will turn it into a meme."}, {"t": "h3", "v": "What’s the Inverse of a Black Hole?"}, {"t": "p", "v": "I dove into gravity and its implications in relation to time in a previous substack. And you’'ll remember that an increase in gravity leads to the slowing of time (or rather, our perception of this reality). But what I was thinking about more recently, is what happens if you take gravity and time to their logical conclusion?"}, {"t": "p", "v": "For example, a black hole is gravity at its most extreme. Like in Interstellar, as you approach the event horizon time slows down to a crawl. And logically speaking, when you cross the event horizon gravity can be considered infinite (given not even light escapes and therein our conception of this reality):"}, {"t": "img", "src": "img/december-24-01.png", "w": 1832, "h": 1214, "cap": "", "mw": 707.5, "mh": 520}, {"t": "p", "v": "\u0001 — I love ChatGPT bro —\u0002"}, {"t": "p", "v": "But here’s what I wanna focus on, what happens when you take a black hole to its _negative_ infinity? First of all, what’s the opposite of a black hole? Does such a place as (true) 0G even exist? Imagine something in space that doesn’t bend light (and thereby slows time) but instead contracts it. A reduction of all gravitational force such that the result is an entity traveling at (or damn near) the speed of light."}, {"t": "p", "v": "Black holes and their singularity defy nature. And yet, we’ve confirmed they exist. Given the sheer scale of the universe and the inherent possibilities that come with that scale, is it really that absurd to consider something that reduces gravity to 0? That enables traveling at the speed of light?"}, {"t": "h3", "v": "Creativity"}, {"t": "p", "v": "Something else I’ve been thinking about is the notion of creativity. And the concept that “art” is this grand thing created by radical peoples operating on the fringes. Yet, this leaves no room for ‘regular people’ to create. Its kinda like weightlifting in that way. Where you see professional athletes or movie stars and their sculpted physiques and think “I’ll never look like X”. But that’s not the point. You’re viewing things through the lens of the top .001%."}, {"t": "p", "v": "I often fall into this trap when I sit down to write. Comparing what I do to the greats. Melville. McCarthy. Joyce. Faulkner. And I oftentimes have to stop myself because two things can be true at once. 1) There can be works of art that resonate with lots of people for long periods of time. These are the Monets and the Picassos. “High art.” But at the same time 2) You can tune into the beauty of each day and find inspiration to create and it doesn’t have to be something you share with others. It can simply exist in a notebook or on a canvas in your basement. It’s the creative process itself that is inherently so rewarding. You’ve just gotta open yourself up to the waves. To the inspo. To the vibrations man :p"}, {"t": "h3", "v": "A Few More Ideas"}, {"t": "li", "v": "<span class=\"lp\">Medieval people were better suited for what lies ahead. Belief in a higher power. To reconcile that which has no immediate answer. </span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">The Greeks knew being ostracized and put to death were the same thing.</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">All new ideas are heresy (and when tech companies start shunning new ideas they’ve reached the beginning of the end).</span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Cicero fish ponds. The idea that the most able statesman of a society move to the suburbs and build high walls. Spend their time perfecting fish ponds instead of rising to civic duty. On some level those who are most able have a societal obligation to fulfill.</span>", "ord": false, "n": 4, "d": 0}, {"t": "li", "v": "<span class=\"lp\">The long term effects of young love.</span>", "ord": false, "n": 5, "d": 0}, {"t": "dept", "v": "Some Literature"}, {"t": "verse", "v": "You married?\nNo sir. I aint but sixteen.\nDont get married. Women are crazy.\nYessir.\nYou’ll think you’ve found one that aint but guess what?\nWhat?\nShe will be too."}, {"t": "p", "v": "- Cormac McCarthy (The Crossing)", "cls": "att"}, {"t": "p", "v": "PS. I may publish again this month. No promises, but I’ve been diggin it lately :p"}], "mode": "two"}, {"slug": "january-25", "title": "January ’25", "deck": "Superintelligence, cold approaching, and a crush", "eyebrow": "January 18, 2025", "mov": "2025", "blocks": [{"t": "img", "src": "img/january-25-00.jpg", "w": 1493, "h": 1200, "cap": "Sentinel, 2020 by Tilo Baumgärtel", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Cold Approaching"}, {"t": "p", "v": "Everyone wants a “meet cute”. Where you’re at the grocery store or grabbing a coffee. Standing in line and making eye contact with the cute guy who just walked in. Where you sit down and open your book and that same cute guy has the gall to come up and make idle conversation — which turns out to be easy, fluid. Like talking to an old friend."}, {"t": "p", "v": "The problem is that this sort of thing simply doesn’t happen anymore. Guys don’t approach girls. And girls never approach guys. Simple as that. Yet, these sorts of encounters _used to_ happen. Our parents and our grandparents never cease to stop reminding us of that fact (at least, mine certainly don’t)."}, {"t": "p", "v": "So what’s changed?"}, {"t": "p", "v": "Well, for starters, men stopped approaching women given the feminine backlash to such advances. And to their credit, I don’t blame them; especially when you consider the way things used to be. Men used to have no shame (and some still don’t). Catcalling and flirting with women (other than your wife) was a commonplace thing. Toxic masculinity is undeniably a thing, but I’d argue that men have come a long ways in 40+ years. So much so, that we don’t approach women anymore (even the ones we like). Instead, the common consensus among men is that “she doesn’t wanna be bothered” and that it would be “awkward” to do so."}, {"t": "p", "v": "However, I sense a shifting sentiment among young people. When I talk to my friends, the undeniable theme is “unhappily single”. Yet its not for a lack of trying? Everyone’s tried the apps, everyone’s asked their friends to set them up. It feels as if there aren’t any means to make your own future. That on one hand, there is crippling singularity and the other forcing dates with online strangers and hoping for a spark that can only be felt in person."}, {"t": "p", "v": "And I think this culminates into an interesting societal dichotomy. One where young people are looking back at “dating norms” and shaking their heads. Where taking the lead, picking her up, paying for dinner…idk, doing the albeit masculine things?? is in short supply and desperate demand."}, {"t": "p", "v": "We’re all just waiting for a signal. A sign of openness. The green light to approach."}, {"t": "h3", "v": "Flagstaff"}, {"t": "p", "v": "I’ve been coming down here every winter for three years now. And before that it was Sedona. But Flagstaff has this way about it. Like all mountain towns, it feels more soulful. More spiritual. And that’s reflected in the desert art and the lifestyle; as if a city of 70k could still manage to retain its small town general store appeal."}, {"t": "p", "v": "It must have something to do with the mountains."}, {"t": "p", "v": "There’s always this sense of calm when I catch their peaks in my rearview."}, {"t": "img", "src": "img/january-25-01.jpg", "w": 1440, "h": 685, "cap": "", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Aside"}, {"t": "img", "src": "img/january-25-02.png", "w": 1108, "h": 332, "cap": "", "mw": 400, "mh": 440}, {"t": "h3", "v": "Superintelligence"}, {"t": "p", "v": "I think about the epochs of AI in three stages:"}, {"t": "li", "v": "<span class=\"lp\">The Information Era</span>", "ord": true, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">The Interpretation Era</span>", "ord": true, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">The Superintelligence Era</span>", "ord": true, "n": 3, "d": 0}, {"t": "p", "v": "The creation of computers and data at scale was the information era. Now we’re trying to build something that can harness/interpret it all. When we do, we’ll have created an intelligence even beyond the bounds of our own. And the only conclusion to this is the acceptance that there will someday be an “intelligence” that supersedes our own."}, {"t": "p", "v": "At which point, what does our role become? When we don’t need to solve complex problems anymore? We’re eventually gonna have computers that can harness and “interpret” the accumulation of all human information (effectively, everything that exists on the internet). And these artificial engines are gonna be “smarter” by all accounts and measures."}, {"t": "p", "v": "All of that said, I still see room for us. That there will still be Classics and Philosophy and Sociology professors who have to teach AI “why”. To teach AI how to be “human”."}, {"t": "p", "v": "Because it’s easy to do math in a vacuum, but the ponderous questions of morality? Big questions with difficult answers."}, {"t": "h3", "v": "Crush"}, {"t": "p", "v": "I asked a girl out yesterday. First time in a long time. Was over text, been over a year since we’d spoke."}, {"t": "p", "v": "And I was telling some buddies, that what got me thinking about her was a note on my phone. From when I was hiking in Zion:"}, {"t": "p", "v": "The girl you’re best suited for is the one you want first. First instinct. But you talk yourself out of it."}, {"t": "p", "v": "Turns out she has a boyfriend. And we were cordial. Polite even. But I heard a song on the radio the other day, and it went:"}, {"t": "p", "v": "“Why waste another day girl, we ain’t gettin no younger…”", "cls": "pull"}, {"t": "img", "src": "img/january-25-03.jpg", "w": 1088, "h": 299, "cap": "", "mw": 400, "mh": 440}], "mode": "two"}, {"slug": "february-25", "title": "February ’25", "deck": "Startups, emotional intelligence, and the rise and fall of Rome", "eyebrow": "February 14, 2025", "mov": "2025", "blocks": [{"t": "img", "src": "img/february-25-00.jpg", "w": 2800, "h": 1574, "cap": "Adrien Brody starring in ‘The Brutalist’", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Startup Trends"}, {"t": "p", "v": "Y Combinator is a startup mixer that takes business pitches (Shark Tank style) and connects founders with investors (assuming they’re viable). Here’s some notes from poking around:"}, {"t": "li", "v": "<span class=\"lp\">Several YC backed startups that are entirely focused on India</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">India is its own little market economy</span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">large enough to operate on its own (1 billion people, and semi-advanced)</span>", "ord": false, "n": 2, "d": 1}, {"t": "li", "v": "<span class=\"lp\">yet undeveloped enough to warrant opportunity that doesn't exist in more advanced marketplaces (like the US)</span>", "ord": false, "n": 3, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Edge AI</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Lots of generative AI startups (as one would expect)</span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">But a surprising number of startups trying to use AI on small/<wbr/>concentrated hardware</span>", "ord": false, "n": 2, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Colloquially termed “edge ai” (AI running on the edge of the network)</span>", "ord": false, "n": 3, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Interesting startups</span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\"><strong>Ironclad</strong> — using generative AI to disrupt contract law</span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\"><strong>Clipboard Health </strong>— imagine uber for healthcare. Allowing nurses and doctors to freelance jobs across hospitals</span>", "ord": false, "n": 2, "d": 1}, {"t": "li", "v": "<span class=\"lp\"><strong>Embark Trucks</strong> — self driving trucks (but their software works for all types of equipment, like tractors and forklifts)</span>", "ord": false, "n": 3, "d": 1}, {"t": "li", "v": "<span class=\"lp\"><strong>Odeko</strong> — making it easier to start/<wbr/>streamline coffee shop operations. Supply chain automation</span>", "ord": false, "n": 4, "d": 1}, {"t": "li", "v": "<span class=\"lp\"><strong>Instacart</strong> — similar to Odeko, but more consumer facing. Forseeable market overlap if Instacart expands to B2B</span>", "ord": false, "n": 5, "d": 1}, {"t": "h3", "v": "Emotional Intelligence"}, {"t": "p", "v": "I talk a lot about emotional intelligence, perhaps foremost with my Mom. And as I get older, I’m seeing more and more of my friends reach emotional maturity, which makes it easier to connect with them (at least for me)."}, {"t": "p", "v": "Emotional Intelligence is many things. It’s the ability to be self aware. Which is simply understanding how others perceive you and knowing how to respond this fact. It’s also an understanding of who the other person is and utilizing this knowledge to remain objective. Which naturally leads to empathy, where you understand and “feel” for someone when they express something to you."}, {"t": "p", "v": "Often times when you express that someone is “immature” you are expressing the opposite of this. That they are acting ignorantly. With no understanding of their actions — no matter how harmful to others.", "cls": "pull"}, {"t": "p", "v": "It’s not necessarily being the optimist in the room. It’s more about having the sheer ability to understand someone else’s emotions. How they’re feeling."}, {"t": "p", "v": "Which also makes it #1 on my “qualities in a partner list”. Being with someone who understands how I’m feeling most of the time is so refreshing. No need to clarify, argue, or fight. We’re on the same page 95% of the time. And when we’re not? We talk about it. Simple as that."}, {"t": "img", "src": "img/february-25-01.jpg", "w": 2800, "h": 1687, "cap": "", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Contrasting Rome"}, {"t": "p", "v": "THE RISE"}, {"t": "li", "v": "<span class=\"lp\">Aristocracy and peasants (eventually having to concede that people as slaves ensues the notion of “peasants”)</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Primarily agrarian based</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Focused on protection from outside forces</span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Strong focus on civic virtue and duty</span>", "ord": false, "n": 4, "d": 0}, {"t": "p", "v": "THE FALL"}, {"t": "li", "v": "<span class=\"lp\">Corruption and inefficiency within the government (lawmakers not upholding their civic duty)</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Reliance on mercenaries</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Economic stagnation (inflation and heavy taxation)</span>", "ord": false, "n": 3, "d": 0}, {"t": "img", "src": "img/february-25-02.jpg", "w": 2800, "h": 1687, "cap": "", "mw": 707.5, "mh": 520}, {"t": "dept", "v": "Some Literature"}, {"t": "p", "v": "\u0001We were so poor I had to take the place of the bait in the mousetrap. All alone in the cellar. I could hear them pacing upstairs, tossing and turning in their beds. \"These are dark and evil days,\" the mouse told me as he nibbled my ear. Years passed. My mother wore a cat-fur collar which she stroked until its sparks lit up the cellar.\u0002", "cls": "q"}, {"t": "p", "v": "\u0001\u0003— Charles Simic (The World Doesn’t End)\u0004\u0002", "cls": "q"}], "mode": "two"}, {"slug": "south-africa", "title": "South Africa", "deck": "A travel journal", "eyebrow": "March 1, 2025", "mov": "2025", "blocks": [{"t": "img", "src": "img/south-africa-00.jpg", "w": 1075, "h": 1080, "cap": "Painted Dog by Ann Gadd", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "02/16"}, {"t": "p", "v": "Arrival."}, {"t": "p", "v": "Cape Town is incredible. Never seen anything like it. Mediterranean climate and coastal architecture meets colorful Africana."}, {"t": "p", "v": "And the people; everyone is so kind. Welcoming and open with tourists alike. Our trip manager mentioned that South Africans are like this by nature. Apartheid and Nelson Mandela bespoke a new wave of emotional capacity for others."}, {"t": "p", "v": "I’m excited."}, {"t": "h3", "v": "02/17"}, {"t": "p", "v": "Day two. Still recovering from jet lag. Already several friends in the group. Settling in and staying present."}, {"t": "p", "v": "We take a masterclass in cooking. Everyone tasked with making a typical South African dish. I make a gumbo of sorts. Mince the onion and clove the garlic. Angela gives me shit for not dicing the tomatoes before putting them in the pot. I was just following the recipe bruh."}, {"t": "h3", "v": "02/18"}, {"t": "p", "v": "From Cape of Good Hope to the coast. Seafood and sparkling water overlooking the ocean."}, {"t": "p", "v": "Spent an hour chest deep in the Atlantic. Eventually had to get out, towel off and wring-free the sand. Feeling refreshed and standing on the beach. The water washed me free."}, {"t": "p", "v": "We drive down the coast to a vineyard. Sampled sauvignon blanc and stood beneath the alms of an ancient savannah tree. Watched the afternoon sun alight the ocean. The horizon a white gleam."}, {"t": "p", "v": "Take the coach home, Jason and Jordan left a 24-rack of Corona beer in the fridge. Four glasses of wine and two beers deep, we roll back into Cape Town. Even making a stop for more liquor. Hannah buys shots."}, {"t": "p", "v": "The group is feeling it, dancing and egging each other on. And I couldn’t help but try not to laugh. Hoping they wouldn’t call me out. I just want to sit and watch. Seeing everyone else happy makes me happy."}, {"t": "p", "v": "Later, at the bar, I sit with Valerie and Nicole. We explore Val’s love life and I do my best to talk her out of some guy back home who’s clearly not giving her the time. You make time for the people you care about."}, {"t": "p", "v": "Early night. 4am flight to Johannesburg tomorrow morning. I’m here for it."}, {"t": "h3", "v": "02/19"}, {"t": "p", "v": "Kruger National Park. Game drive across the savannah. Never seen such fauna. Elephants and giraffes and impala everywhere. Jackals and hyenas lurking behind corners. Lions in coordinated prides. Social and dominance hierarchies on full display."}, {"t": "p", "v": "Saw a cheetah at 50ft. Lone female tracking upwind. Lithe and regal frame. Like a woman with legs (and she knows it) — showing them off in high heels."}, {"t": "h3", "v": "02/20"}, {"t": "p", "v": "Slept in this morning. Took a hot shower in the communal camp bathrooms. Didn’t realize how much I needed it."}, {"t": "p", "v": "Driving out past Kruger, massive cold front pushing up the clouds. A lone bird of prey cascading, riding the plumes."}, {"t": "p", "v": "There’s a certain type of person who arises from abject poverty. An understanding of the people in power. Living in a state of constant oppression. Sheer corruption by those at the top."}, {"t": "p", "v": "After an afternoon nap we take a sunset game drive back through Kruger. Followed the river — looking for a leopard. Made it halfway out before the sky opened up, a squall cutting across the savannah. Pushing the cats into the trees."}, {"t": "h3", "v": "02/21"}, {"t": "p", "v": "So much poverty, but in a different way. In America, those in poverty live in desperation because they can see how the upper classes live. Sense of hopelessness and/or class struggle."}, {"t": "p", "v": "Whereas in Africa, initially felt sad observing such poverty. But seems different. Everyone here is filled with hope. And it’s not simply that they don’t know any better — because they have access to the internet and seem very cognizant of western culture. Almost as if they understand how the wider world works, but choose to retain their heritage. Their community."}, {"t": "p", "v": "There’s something I envy about that."}, {"t": "h3", "v": "02/22"}, {"t": "p", "v": "Currently drinking a beer, waiting to jump off a bridge."}, {"t": "p", "v": "Update. Jumped off of said bridge. Never felt fear like that in my life."}, {"t": "h3", "v": "02/23"}, {"t": "p", "v": "Went river rafting in the Zambezi river downstream from Victoria Falls. Got thrown from the boat and washed through the rapids. Almost drowned. Got pulled aboard by Jesse and one of the raft hands. Spent the next minute coughing up water. Felt like my body was in panic mode in the hours following."}, {"t": "p", "v": "Jumping off of bridges. Being sucked down by whirlpools. That’s enough adrenaline for one trip."}, {"t": "p", "v": "Got back to the lodge and took a cold shower. Washed the sweat and fear away. Made some hot tea. Self care in full effect."}, {"t": "p", "v": "Met the group for a sunrise riverboat cruise. Bartender dishing triple brandy cokes. Drinking games and tomfoolery. Suddenly drunk."}, {"t": "p", "v": "Feels like the group finally came together. Acquaintances unto friends. Family."}, {"t": "h3", "v": "02/24"}, {"t": "p", "v": "Crossed the border from Zambia into Botswana and made our way to Chobe National Park. Afternoon game drive rained out."}, {"t": "p", "v": "Saw a lightening bolt demolish a tree. Three seconds for the thunder to clap."}, {"t": "p", "v": "Came back soaked and played poker at the hotel. Used loose change and leaves (yes, leaves of grass) to quantify our bets."}, {"t": "p", "v": "Early night, sleep needed."}, {"t": "h3", "v": "02/25"}, {"t": "p", "v": "Started the day with an early morning game drive across Chobe. Saw damn near nothing for almost 3 hours. Then our guide got word of a dead elephant on the radio."}, {"t": "p", "v": "Vultures circling for miles. Baboons screaming from the trees."}, {"t": "p", "v": "When we get there, a dead young elephant lain upon the savannah-grass. A pride of lions feeding upon the carcass. Guide says it likely died from stress. Lions simply found the corpse."}, {"t": "p", "v": "Watched a young cub drag away some intestines. Literally 15 feet away. The circle of life."}, {"t": "p", "v": "Guide persists, taking us deeper into the bush. Come upon several males and females protecting a group of newborn cubs. Pride gets defensive, false charging our safari vehicle. Driver is unfazed. “Take lots of pictures” he says."}, {"t": "p", "v": "Make our way back to the camp. Everyone reeling with excitement from the experience. Checked boxes on this trip that I didn’t even know existed."}, {"t": "h3", "v": "02/26"}, {"t": "p", "v": "Departure. Flight from Kasane to Johannesburg. Laid over with Karen, Miguel, Alex, Franklin, Jordan, Jason, and Hannah for several hours. We find a diner and order pizza. Have a couple beers and retell war stories. Wonder how its already over."}, {"t": "p", "v": "Saying goodbye. Trying to find the words."}, {"t": "p", "v": "Sitting at my gate and waiting for the plane home."}, {"t": "p", "v": "Happy."}, {"t": "p", "v": "\u0003“In the spring of the year birds began to arrive on the beach from across the gulf. Weary passerines. Vireos. Kingbirds and grosbeaks. Too exhausted to move. You could pick them up out of the sand and hold them trembling in your palm. Their small hearts beating and their eyes shuttering. He walked the beach with his flashlight the whole of the night to fend away predators and toward the dawn he slept with them in the sand. That none disturb these passengers.”\u0004", "cls": "pull"}, {"t": "p", "v": "\u0003- Cormac McCarthy\u0004", "cls": "pull"}], "mode": "two"}, {"slug": "april-25", "title": "April ’25", "deck": "Market movers, special relativity, and 35mm", "eyebrow": "April 18, 2025", "mov": "2025", "blocks": [{"t": "img", "src": "img/april-25-00.jpg", "w": 1200, "h": 800, "cap": "Shot: Lised d'eau douce - Camera: Canon AE-1 - Film: Kodak Gold 200", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Market Movers"}, {"t": "h4", "v": "\u0003Google\u0004"}, {"t": "li", "v": "<span class=\"lp\">Losing SEO dominance with the rise of LLMs</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">So much of G’s revenue is ‘ads’ </span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">(websites paying to be promoted to the top of search results)</span>", "ord": false, "n": 2, "d": 1}, {"t": "li", "v": "<span class=\"lp\">How does this change with ChatGPT?</span>", "ord": false, "n": 3, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Reportedly traffic on Instagram and YouTube doubled during the Tiktok ban </span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">(both G and Meta have a vested interest here)</span>", "ord": false, "n": 1, "d": 1}, {"t": "h4", "v": "\u0003Amazon\u0004"}, {"t": "li", "v": "<span class=\"lp\">Reportedly 30% of Amazon’s marketplace is based in China</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Obvious tariff implications </span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">(and how many Amazon “merchants” are really just importing product to their US based warehouses and upselling?…certainly non-zero…)</span>", "ord": false, "n": 2, "d": 1}, {"t": "li", "v": "<span class=\"lp\"><em>“Amazon is experimenting with showing product and inventory from other companies’ websites within search results and if it doesn’t stock the product itself, using an AI agent to help the customer buy from from an external website. [<a class=\"url\" href=\"https://aboutamazon.com/news/retail/amazon-shopping-app-buy-for-me-brands\" target=\"_blank\" rel=\"noopener\">aboutamazon.com/news/retail/amazon-shopping-app-buy-for-me-brands</a>]”</em></span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Opens the door for Amazon to become a ‘marketplace SEO’ </span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">(and charge vendors a fee to connect Amazon buyers with external product)</span>", "ord": false, "n": 2, "d": 1}, {"t": "li", "v": "<span class=\"lp\">How long until an LLM can find your product, purchase it, and organize shipping? Does Amazon simply become logistics for online sales? </span>", "ord": false, "n": 3, "d": 1}, {"t": "h4", "v": "\u0003Apple\u0004"}, {"t": "li", "v": "<span class=\"lp\">Apparently Google is paying Apple almost 20bn dollars to make Google Search the default search engine when someone buys an iPhone</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">(which means G <strong>must</strong> see more than 20bn in opportunity if they’re willing to pay for it)</span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">(also seems like anti-competetive / monopolistic behavior) </span>", "ord": false, "n": 2, "d": 1}, {"t": "h4", "v": "\u0003Meta\u0004"}, {"t": "li", "v": "<span class=\"lp\">Heard from a mutual that they have gotten very serious about AI internally. Top-down culture mandate. Is this supposed to bolster morale? </span>", "ord": false, "n": 1, "d": 0}, {"t": "h3", "v": "Relativistic Beaming"}, {"t": "p", "v": "I came across this picture on Instagram. The first simulated image of a black hole, calculated in 1978:"}, {"t": "img", "src": "img/april-25-01.png", "w": 700, "h": 346, "cap": "Jean-Pierre Luminet, 1978", "mw": 400, "mh": 440}, {"t": "p", "v": "And my first thought was “why is one side brighter than the other?” Key-in ChatGPT:"}, {"t": "p", "v": "\u0001Relativistic beaming. This is the key reason for the asymmetry. If the black hole is surrounded by a rotating accretion disk (a disk of superheated gas and matter spiraling in), then parts of the disk are moving toward us and parts are moving away. The side moving toward us has its light blue-shifted and boosted in intensity due to special relativity. The side moving away has its light red-shifted and dimmed.\u0002", "cls": "q"}, {"t": "p", "v": "As light spins around the event horizon of the black hole, it either gets sped up (blue shifted) or slowed down (red shifted), which gives the appearance of one side being “brighter” than the other."}, {"t": "p", "v": "Aka, relativistic beaming."}, {"t": "h3", "v": "I remember"}, {"t": "p", "v": "My buddy telling me about this “amazing girl” he’d just met. Knowing it could be their last first date. The energy they must be feeling. Electricity at the bottom of your gut. Can’t get ‘em off the brain."}, {"t": "p", "v": "You know that feeling."}, {"t": "dept", "v": "Some Literature"}, {"t": "brk"}, {"t": "p", "v": "What is a rainbow, Lord?", "cls": "lit"}, {"t": "p", "v": "A hoop", "cls": "lit"}, {"t": "p", "v": "For the lowly.", "cls": "lit"}, {"t": "img", "src": "img/april-25-02.jpg", "w": 1824, "h": 1272, "cap": "", "mw": 400, "mh": 440}, {"t": "p", "v": "— Jack Kerouac (Dharma Bums)", "cls": "lit"}], "mode": "two"}, {"slug": "june-25", "title": "June ’25", "deck": "Early adoption, unexpected beauty, and quitting Amazon", "eyebrow": "June 13, 2025", "mov": "2025", "blocks": [{"t": "img", "src": "img/june-25-00.png", "w": 1273, "h": 802, "cap": "Shot By: m_poluchowicz", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Early Adoption"}, {"t": "p", "v": "Amazon and Apple scaled Alexa and Siri well before the dawn of modern AI. And while newer models continue to disrupt, that doesn’t change the fact that Amazon and Apple now have billions of users simply because THEY WERE THERE FIRST."}, {"t": "li", "v": "<span class=\"lp\">Meanwhile, ChatGPT continues to dominate the AI marketplace</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">(even though Google and Anthropic have released models that outperform Chat in almost every way)</span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">So why does everyone still use ChatGPT? </span>", "ord": false, "n": 2, "d": 1}, {"t": "li", "v": "<span class=\"lp\"><em>_because they were there first_</em></span>", "ord": false, "n": 3, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Ever tried convincing someone to try something new? </span>", "ord": false, "n": 4, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Point made. </span>", "ord": false, "n": 5, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Yet in the long run, first-to-market doesn’t always win per se</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Google wasn’t the first internet browser, yet they still became the most dominant search engine…why?</span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Luck? Timing? A better product? </span>", "ord": false, "n": 2, "d": 1}, {"t": "li", "v": "<span class=\"lp\">(or all the above?)</span>", "ord": false, "n": 3, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Big Tech inherently has a parachute with these new technologies</span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Can operate on a loss while developing a new product </span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">All while funneling profit from existing businesses into said R&amp;D</span>", "ord": false, "n": 2, "d": 1}, {"t": "li", "v": "<span class=\"lp\">(this is a big reason why the Feds want to break up Amazon fwiw, makes inordinate profit on AWS and rolls that $$$ into new technologies at years’ end)</span>", "ord": false, "n": 3, "d": 1}, {"t": "li", "v": "<span class=\"lp\">(which means they can claim “zero profit” on their taxes, which isn’t entirely true)</span>", "ord": false, "n": 4, "d": 1}, {"t": "h4", "v": "— On a Related Note —"}, {"t": "p", "v": "ChatGPT is an echo chamber to some degree (given how it emulates your subconscious thought). Same reason why we see it as a therapist. Telling us what we “need” to hear."}, {"t": "p", "v": "Yet something I’ve been thinking about more recently, is that these AI companies are incentivized to drive adoption. Especially right now — given the sheer number of options available. So what does that imply about their product?"}, {"t": "p", "v": "Maybe there’s a reason ChatGPT is such a good therapist. Its been instructed to sycophant. Tell us what we \u0001\u0003want\u0004\u0002 to hear (even at the expense of what we \u0001\u0003should\u0004\u0002 be told)."}, {"t": "p", "v": "Scary thought."}, {"t": "h3", "v": "Subtle Perspective"}, {"t": "p", "v": "A funny thing, beauty."}, {"t": "p", "v": "Sometimes the harder you search for it the more evasive it becomes. And when you do find it, it doesn’t always hold up to expectations. Especially those reminiscent."}, {"t": "p", "v": "Yet a friend of mine recommended that I get a cheap camera for my trip to California. And throughout the trip, I found myself stopping. Backing up. Seeing lighting and angles and shots of film everywhere I looked."}, {"t": "p", "v": "Beauty in unexpected places."}, {"t": "img", "src": "img/june-25-01.jpg", "w": 1818, "h": 1228, "cap": "", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Quitting Amazon"}, {"t": "p", "v": "Where do I even start."}, {"t": "p", "v": "I’ve had a love/hate relationship with Amazon for a long time (and I’ve written about it several times on this platform). On one hand, I got to spend 5 years solving difficult problems with brilliant people and got paid very well to do so. On the other, the work itself has failed to interest me of years now — and constantly left me feeling stressed and burned out."}, {"t": "p", "v": "Fast forward to 2025 and its been the same song and dance. A failed promotion and five days a week back in-office. Even more incentive to quit."}, {"t": "p", "v": "And for the first time in 5 years, I took myself up on it. Gave notice with no immediate job lined up. Walked away from six figures and health insurance simply because I could."}, {"t": "p", "v": "So what’s next? you may ask. I’m not entirely sure."}, {"t": "p", "v": "I’ve got a few interviews lined up. Recruiters with my resume and number on their line. But nothing certain. Nothing set in stone."}, {"t": "p", "v": "And you know what? That’s what I like about it."}, {"t": "dept", "v": "Some Literature"}, {"t": "p", "v": "I needed a drink, I needed a lot of life insurance, I needed a vacation, I needed a home in the country.", "cls": "lit"}, {"t": "p", "v": "What I had was a coat, a hat and a gun. I put them on and went out of the room.", "cls": "lit"}, {"t": "img", "src": "img/june-25-02.jpg", "w": 2432, "h": 946, "cap": "", "mw": 400, "mh": 440}, {"t": "p", "v": "—Raymond Chandler (Farewell, My Lovely)", "cls": "lit"}], "mode": "two"}, {"slug": "august-25", "title": "August ’25", "deck": "Thinking big (and going blind)", "eyebrow": "August 25, 2025", "mov": "2025", "blocks": [{"t": "img", "src": "img/august-25-00.jpg", "w": 1624, "h": 1410, "cap": "ZAP Comix by Spain Rodriguez", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Broad Strokes"}, {"t": "p", "v": "My fundamental problem with most people’s opinion on AI right now is that they either:"}, {"t": "li", "v": "<span class=\"lp\">Think too small</span>", "ord": true, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">“<em>Build me a Chatbot Aidan</em>”</span>", "ord": true, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Think too big</span>", "ord": true, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">“<em>AI eat world</em>”</span>", "ord": true, "n": 1, "d": 1}, {"t": "p", "v": "When in reality, its somewhere in-between. Instead of going to ChatGPT and expecting an answer to your problem, look for ways that it can a\u0001ccelerate\u0002 what you’re doing. Enabling you to move \u0001faster\u0002."}, {"t": "h4", "v": "\u0003— And one last tangent — \u0004"}, {"t": "p", "v": "Do you think people from the early 1900s would consider what we do today as ‘work’? Sitting behind a computer in comparison to manufacturing steel? What about hunter gathers? Fighting off predators in comparison to smelting ore? Point being, that technology and innovation tend to improve our quality of life. And there’s something inherently optimistic in that."}, {"t": "h3", "v": "Going Blind"}, {"t": "p", "v": "As of late, I’ve been having a friend run my Hinge account. She’s married with two kids and a full-time job, but when I asked her if she’d be interested in participating in this little social experiment she was more than happy."}, {"t": "p", "v": "So I sent her a couple dozen of my best photos and told her what I’m looking for — which was harder than anything honestly — and she made me a profile. Clearly communicating that she’s acting as my matchmaker and setting me up on blind dates."}, {"t": "p", "v": "To which, the results have been really interesting. For starters, it seems like women are more inclined to talk to her than any man (myself included)? She’s been answering questions as to my faith, interests, personality, and seems to be having more fun than I am sometimes. As if having a female vouching for me signals that women can ask the real questions (and not feel like they’re giving anything away)."}, {"t": "p", "v": "And from my perspective, not having to swipe/chat/overthink has been a burden off my own shoulders. I merely suggest a couple date ideas and communicate my schedule. I’m given a phone number and a first name. That’s it. Send a text the morning of and confirm our date. Seeing them for the first time unbiased."}, {"t": "p", "v": "And you know what? This has been the most refreshing dating experience I’ve ever had. Finally feels like I can go on dates and not be sucked into the OLD whirlpool."}, {"t": "p", "v": "Thank you Anne."}, {"t": "p", "v": "\u0001And P.S. — if anyone else is looking for a matchmaker, she comes highly reviewed :p\u0002"}, {"t": "h3", "v": "A Few More Ideas"}, {"t": "li", "v": "<span class=\"lp\">Apple’s production of the film ‘<em>F1’</em> starring Brad Pitt was very much strategic</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">The F1 gaming commission has now publicly stated that they want to be America’s “next big sport” (with Apple allegedly in talks for the streaming rights)</span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Lead with a blockbuster film, follow with ‘<em>Watch live on AppleTV+</em>’</span>", "ord": false, "n": 2, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Sam Altman and OpenAI announced a partnership with Jony Ive (the guy who designed the iPhone, MacBook, and Apple Watch)</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">I also read that Meta’s VR deal with Ray-Bans has drastically exceeded sales expectations</span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Which is interesting, when you consider that every VR product preceding this has been a complete and utter flop (such as the Apple Vision Pro)</span>", "ord": false, "n": 2, "d": 1}, {"t": "li", "v": "<span class=\"lp\">What does this signal about the broader market? Are consumers ready for AI wearables?</span>", "ord": false, "n": 3, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Airbnb didn’t build software for hotels, they changed what a hotel meant</span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Uber didn’t build software for taxis, they changed what a taxi meant</span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\"><strong>True disruption changes our definition of the market.</strong></span>", "ord": false, "n": 1, "d": 2}, {"t": "dept", "v": "Some Literature"}, {"t": "p", "v": "From thirty feet away she looked like a lot of class.", "cls": "q"}, {"t": "p", "v": "— Raymond Chandler (The High Window)", "cls": "q"}], "mode": "two"}, {"slug": "september-25", "title": "September ’25", "deck": "Let's dance", "eyebrow": "September 1, 2025", "mov": "2025", "blocks": [{"t": "img", "src": "img/september-25-00.png", "w": 1024, "h": 1024, "cap": "‘Lilus Kikus’ by Leonora Carrington", "mw": 707.5, "mh": 520}, {"t": "h3", "v": "Simulacra or Simulation"}, {"t": "p", "v": "I’m sure everyone’s heard the modern quip that suggests we live in a simulation (Elon Musk is notorious for propping this). But what if it’s something more nuanced?"}, {"t": "li", "v": "<span class=\"lp\"><strong>Simulation</strong>: to pretend</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">(an obfuscation of reality)</span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\"><strong>Dis-simulation</strong>: to pretend elsewise</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">(a misrepresentation of reality)</span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\"><strong>Simulacra</strong>: a crude representation of reality</span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">(which becomes taken for the real)</span>", "ord": false, "n": 1, "d": 1}, {"t": "h4", "v": "\u0003Orders of Simulacra\u0004"}, {"t": "li", "v": "<span class=\"lp\">A reflection of reality</span>", "ord": true, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">“Its hiding the truth!”</span>", "ord": true, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">“Its hiding that there is no truth”</span>", "ord": true, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">“Its not hiding anything…its not real…”</span>", "ord": true, "n": 4, "d": 0}, {"t": "h4", "v": "Discussion 1 — Education"}, {"t": "li", "v": "<span class=\"lp\">What do diplomas represent anymore? </span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">When university education has failed to retain its value in the workplace? </span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Artifice from a bygone era?</span>", "ord": false, "n": 3, "d": 0}, {"t": "h4", "v": "Discussion 2 — Euro-politics"}, {"t": "li", "v": "<span class=\"lp\">Why have European societies become so liberal? While America retains its republicanism?</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Smaller countries…less people…converging ideologies?</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Existed longer…alignment of values…less need for republican representation </span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">(ala fewer “important” minorities)</span>", "ord": false, "n": 1, "d": 1}, {"t": "h4", "v": "Discussion 3 — Fascism"}, {"t": "li", "v": "<span class=\"lp\">Fascism results from a society losing power and embracing its melancholy</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">(turning to anger…uproar)</span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Society used to erupt into violence when those in power overreached</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">But now, in this era of hyper-real, there is no true understanding of what motivates society</span>", "ord": false, "n": 3, "d": 0}, {"t": "h4", "v": "Discussion 4 — Ascetics"}, {"t": "li", "v": "<span class=\"lp\">Nihilism predates postmodernism</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">“the disappearance of meaning” become “<em>what even is </em>meaning”</span>", "ord": false, "n": 2, "d": 0}, {"t": "p", "v": "TL;DR — Ketamine. And chain smoking cigarettes:"}, {"t": "img", "src": "img/september-25-01.jpg", "w": 583, "h": 1000, "cap": "Jean Baudrillard, Simulacra and Simulation", "mw": 400, "mh": 440}, {"t": "h3", "v": "The oldest known violin"}, {"t": "p", "v": "is an Amati believed to be from 1564 that’s in the Ashmolean at Oxford. The oldest instrument we studied was from 1580 and the latest was probably a German violin from the 1960s. Aside from the angle of the neck they were the same. Nothing had changed. Nothing."}, {"t": "p", "v": "That seems rather remarkable."}, {"t": "p", "v": "Yes. What’s even more remarkable is that there is no prototype to the violin. It simply appears out of nowhere in all its perfection."}, {"t": "p", "v": "And what do you make of that? You’ve told me this for a reason."}, {"t": "p", "v": "It’s just another mystery to add to the roster. Leonardo cant be explained. Or Newton, or Shakespeare. Or endless others. Well. Probably not endless. But at least we know their names. But unless you’re willing to concede that God invented the violin there is a figure who will never be known. A small man who went with his son into the stunted forests of the little iceage of fifteenth century Italy and sawed and split the maple trees and put the flitches to dry for seven years and then stood in the slant light of his shop one morning and said a brief prayer of thanks to his creator and then—knowing this perfect thing—took up his tools and turned to its construction. Saying now we begin."}, {"t": "p", "v": "Cormac McCarthy (Stella Maris)"}, {"t": "h3", "v": "If reality was inverted"}, {"t": "img", "src": "img/september-25-02.png", "w": 806, "h": 694, "cap": "", "mw": 400, "mh": 440}, {"t": "p", "v": "(werewolf, assassin, and rain dancers with infinite aura)"}, {"t": "p", "v": "(the Pope with -5 lol)"}, {"t": "p", "v": "This also reminds me of a Jerry Seinfeld interview where he touts that in the 1970s no one cared how much money you made. That it was entirely “how cool your job was”. Something true in that."}, {"t": "dept", "v": "Some Lite
