<script>window.ISSUE=[{"slug": "january-part-1", "title": "January: Part 1 ’23", "deck": "Playboy, NFTs, and parking at the mall", "eyebrow": "January 8, 2023", "mov": "2023", "blocks": [{"t": "img", "src": "img/january-part-1-00.png", "w": 1014, "h": 720, "cap": "Without Even Looking by Nigel Van Wieck", "mw": 707.5, "mh": 520}, {"t": "dept", "v": "The News"}, {"t": "h3", "v": "Wild Shit in Idaho"}, {"t": "p", "v": "Apparently I've been \"living under a rock\" (according to a buddy) given how late I am to hear about this - but am as astounded as the rest of you. Open questions:"}, {"t": "li", "v": "<span class=\"lp\">Suspect had no apparent motive?</span>", "ord": true, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Weird that cops took so long to release news/<wbr/>evidence/<wbr/>etc</span>", "ord": true, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Two roommates were still inside when it happened and called police <em>8 hours</em> later? These roommates are \"not considered suspects in the ongoing investigations\"</span>", "ord": true, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">The fact that the timeline of events is almost entirely based on phone activity is spooky from a privacy perspective</span>", "ord": true, "n": 4, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Am I the only one that think's the currently apprehended suspect looks like a cookie cutter \"serial killer\"? Image below for reference</span>", "ord": true, "n": 5, "d": 0}, {"t": "img", "src": "img/january-part-1-01.jpg", "w": 992, "h": 558, "cap": "Monroe County (Pa.) Correctional Facility", "mw": 400, "mh": 440}, {"t": "p", "v": "Here's the link I used to catch up on this (found the timeline of events to be rather cogent): \u0006https://abcnews.go.com/US/idaho-college-murders-timeline-events/story?id=93575278\u0007"}, {"t": "h3", "v": "TikTok: Internal Turmoil"}, {"t": "p", "v": "Picked this up from the Benedict Evans tech memo (I'd highly recommend for those wanting to keep up in tech news each week - link below) and found this bit interesting: \"… company staff used location data from the app to try to see whether journalists who’d been reporting negative stories had been in the same locations as TikTok staff. That sounds… not good.\""}, {"t": "p", "v": "Full story: \u0006https://www.forbes.com/sites/emilybaker-white/2022/12/22/tiktok-tracks-forbes-journalists-bytedance/?sh=5f2cd4ec7da5\u0007"}, {"t": "p", "v": "Benedict Evans Newsletter: \u0006https://www.ben-evans.com/newsletter\u0007"}, {"t": "h3", "v": "NFT Wash Trading"}, {"t": "p", "v": "A recent research study found 45% of all NFT volume in 2022 were \"shady trades\". Aka, people selling to themselves in order to pump their NFT's price. I find the idea of NFT's interesting, but really don't see them going anywhere as a market."}, {"t": "p", "v": "\u0006https://www.coindesk.com/web3/2022/12/23/over-30b-of-nft-trading-volume-on-ethereum-is-wash-trading-research-suggests/\u0007"}, {"t": "dept", "v": "Ideas"}, {"t": "h3", "v": "Instagram is Today's Playboy"}, {"t": "p", "v": "From the 1950s onwards, Playboy magazine increasingly came to represent “sex” in America. The introduction of voluptuous women at the center of an advertisement stricken magazine harkened a new era for what was deemed publishable as well as mainstream. It also grew from it’s publicly assumed apish beginnings to what was seen as a tasteful gentleman’s publication responsible for printing the likes of literary giants ranging from Vladimir Nabokov to Ray Bradbury. Sex and sensuality were now subjects discussable beyond closed doors - though often dejected among the country’s more conservative sects. And not only was it just men reading Playboy, its women were found clutching copies through fits of dejectedness in an attempt to both understand as well as emulate the world’s most desirable women. This fact becomes ever more clear when we consider Playboy’s own take on the rise in popularity among women circa the early 1980s. As noted in its January 1984 edition: “\u0001Compared with our first nationwide Playmate search five years ago, this one was a colossus. In 1978, we sent five photographic teams to 28 cities and snapped Polaroids of more than 3000 women. This time, we sent seven roving photographers and their assistants to 30 U.S. cities and to one in Canada, and they were swamped by 7000 applicants — nearly twice as many, in fact, as we had expected … We wondered why … It became pretty clear after a while that we were seeing the effects of the health-and-fitness movement … an equally likely reason may be simply that PLAYBOY is now considered by more people than ever (including mothers of nice girls) a publication in a class of its own … a tasteful exception\u0002“. Women were increasingly recognizing their own beauty as well as the immense captivation the playmates had when given a platform like Playboy, and simply put, they wanted their taste."}, {"t": "p", "v": "Fast forward a few decades and the psychology hasn’t changed - only the platform. What had been previously restricted to the world’s most elite supermodels has since been opened to anyone with an iPhone 13 and Adobe Photoshop. Your content’s publication audience reachable in an instant. Glitz, glamour, and sexual intimation can be found at the tap of a finger and as far away as your sister’s Instagram profile. What used to cost thousands of dollars at the expense of a Playboy pocketbook and associated photoshoot now achievable from a walk on Sunset Boulevard in thigh-high Victoria’s Secret stockings and a Nikon D850 handled by your guy friend who took a point and shoot course at UCLA. Instagram is a cheap man’s Playboy and Howard Hefner is turning in his grave with every portrait mode selfie floated as a result of golden hour. Publius."}, {"t": "h3", "v": "Generational Disposition: The Boomerang Effect"}, {"t": "p", "v": "I've been reading a lot of Joan Didion lately and find her journalistic pieces not all that different from the writings of Bret Easton Ellis (author of American Psycho). This has in turn lead to some contemplation on the counter-culture of the 1960s and 70s in comparison to the nihilistic sentiment of the 1980s. It feels to me like children of the 1940s and 50s (post World War II) grew up experiencing their parents lack of fulfillment with suburban life and Sunday afternoons spent at the regional shopping center and opted instead for dope, Led Zeppelin, and \"fuck the man\" in the 60s. They wanted nothing to do with cookie cutter houses, cars, or ways of life. You can then follow the spiral to the 1980s where that generation saw their parents of the 60s and 70s as a generation fighting for change and expectedly turned to \"what's the point?\" which we see crop up socially as a lack of spirit, interests, and general dissidence from reality. I haven't thought deeply enough about our current society and the generation of millennials in this sort of contrast yet, but there seems an intuitive (and rather obvious) ping-pong effect that occurs between generations and it doesn't tend to restructure itself in the inception of new core values — rather, it just erodes existing."}, {"t": "h3", "v": "Parking at the Mall"}, {"t": "p", "v": "I read recently that shopping malls have a sort of “playbook” that they follow when both designing and launching a new one. For one, they will anchor “major” outlets such as Macy’s, JP Penney, etc on either end of the mall and place smaller shops in-between in order to increase exposure as folks commute between major outlets. Another involves painting the lines in the parking lot such that parking spots are much bigger than normal when the mall is first launched. This is done so that it takes less cars to give the mall a “busy” or “packed” look - generating excitement and fervor. Months (or even years) after launch when the mall has matured to a staple in the community, they will then repaint the lines to optimize for maximal parking spots."}, {"t": "p", "v": "I mean — sure — these things make complete sense. But I’ve never considered either one of these things in my life till now and it intrigues me that there is a onboarding packet out there somewhere titled “Building the Mall: Your How-To Guide”."}, {"t": "dept", "v": "Some Literature"}, {"t": "p", "v": "Haven't fully conceptualized this section yet - but want to encapsulate some interesting quotes I found from recent readings and maybe some short book reviews."}, {"t": "h3", "v": "Book Review: Stella Maris by Cormac McCarthy"}, {"t": "img", "src": "img/january-part-1-02.jpg", "w": 350, "h": 538, "cap": "Pan Macmillan", "mw": 400, "mh": 440}, {"t": "p", "v": "After reading all McCarthy’s novels (with the exception being his plays) I’d say this has to be his most inaccessible work. Lots of discussion on very high level mathematics and it’s conjunction with our interpretation of the world. This was like reading a McCarthy brain dump. There’s super interesting tidbits in here ranging from the history of violins to the way whales time their breathing - and it’s semi-evident to me what McCarthy was advocating as a theme - I just think it could have been more appropriately edited (the last 30 pages and the history of the Poincaré/Riemann/etc could have been excluded and the novel would have rounded out a lot better - but that’s just me). 4 out of 5 because I’m stacking this against his other incredible works."}, {"t": "p", "v": "Also, I’d like to add that I think McCarthy is a genius. And that’s coming from someone who uses that word \u0001very \u0002sparingly."}], "mode": "two"}, {"slug": "january-part-2", "title": "January: Part 2 ’23", "deck": "Spirituality, tradition, and \"content\" in the modern era", "eyebrow": "January 23, 2023", "mov": "2023", "blocks": [{"t": "img", "src": "img/january-part-2-00.jpg", "w": 739, "h": 492, "cap": "The Prophecy, 2021 by Kent Monkman (b. 1965)", "mw": 707.5, "mh": 520}, {"t": "dept", "v": "The News"}, {"t": "p", "v": "Gonna be a short news segment since I haven’t been following things the past couple weeks (more focused on the opinion pieces in the “Ideas” section below)."}, {"t": "h3", "v": "Prince Harry: You’re Spare Parts Bud"}, {"t": "p", "v": "Prince Harry released his memoir last week to record setting book sales and followed it up by doing several interviews surrounding its content (seems like quaint timing given the recent passing of the late Queen). Of note, he goes on record discussing how he got frostbite on his “todger” during his 2011 trek across the North Pole:"}, {"t": "p", "v": "My penis was oscillating between extremely sensitive and borderline traumatized. The last place I wanted to be was Frostnipistan.", "cls": "q"}, {"t": "p", "v": "And notes how a friend recommended applying Elizabeth Arden cream to the effected area, to which his initial (reluctant) response was:"}, {"t": "p", "v": "my mum used that on her lips…", "cls": "q"}, {"t": "p", "v": "But then ultimately decides to use the cream and writes in the memoir:"}, {"t": "p", "v": "I found a tube, and the minute I opened it, the smell transported me through time. I felt as if my mother was right there in the room. Then I took a smidge and applied it...down there.", "cls": "q"}, {"t": "p", "v": "Uhhhh - what the f**k?"}, {"t": "p", "v": "\u0001Source\u0002: \u0006https://www.newsweek.com/prince-harry-penis-stories-return-him-clown-persona-tried-lose-spare-1774357\u0007"}, {"t": "dept", "v": "Ideas"}, {"t": "h3", "v": "California: Spirituality and Tradition"}, {"t": "p", "v": "In the interior wilderness no one is bloodied by history, and it is no coincidence that that the Pentecostal churches have their strongest hold in places where Western civilization has its most superficial hold. There are more than twice as many Pentecostal as Episcopal churches in Los Angeles.", "cls": "pull"}, {"t": "p", "v": "Joan Didion (The White Album)", "cls": "pull"}, {"t": "p", "v": "I finished this collection of essays by Joan Didion last weekend and have been mulling on this quote all week. For starters, its important to know the difference between the Pentecostal and Episcopal sects of the Christian church:"}, {"t": "h4", "v": "\u0003Pentecostal\u0004"}, {"t": "li", "v": "<span class=\"lp\">Think “charismatic” </span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Energetic sermons</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Doesn’t necessarily ascribe to “a lifetime of sin”</span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Very conservative theologically and socially (long skirts and abstain from things like makeup)</span>", "ord": false, "n": 4, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Origins date back to LA in the early 1900s</span>", "ord": false, "n": 5, "d": 0}, {"t": "h4", "v": "\u0003Episcopal\u0004"}, {"t": "li", "v": "<span class=\"lp\">More traditional</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Largest communion in America</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Socially and theologically more liberal</span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Often considered to be halfway between Catholicism and Protestantism  </span>", "ord": false, "n": 4, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Origins date back to times of the Revolutionary War when terms like “Anglican” and “Church of England” were out of favor</span>", "ord": false, "n": 5, "d": 0}, {"t": "p", "v": "\u0001Source\u0002: \u0006https://christianityfaq.com/episcopalian-pentecostal-comparison/\u0007"}, {"t": "h4", "v": "Open Questions"}, {"t": "li", "v": "<span class=\"lp\">Why, in southern California of all places, would a movement like this spring up and have such sustained success? </span>", "ord": true, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Nowadays there are 4x as many Pentecostal churches in California as there are Episcopal (Didion wrote <em>The White Album</em> primarily in the 1970s)</span>", "ord": true, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">What sort of people are most drawn in by Pentecostal religious sects? </span>", "ord": true, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">What does this tell us about our culture? </span>", "ord": true, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">It almost seems like a revolt against nihilistic/<wbr/>consumeristic/<wbr/>etc tendencies that are the most concentrated in places like LA? </span>", "ord": true, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">But why Pentecostal and not a more “traditional” Christian sect? </span>", "ord": true, "n": 2, "d": 1}, {"t": "h3", "v": "\"Content\" in Today's Day & Age"}, {"t": "p", "v": "Part of me starting this Substack stems from some reflection I’ve done the past few months on the notion of producing versus consuming content. And its not that I wanted to join the fray and start a Podcast about dating or a YouTube channel that inspires the next era of young adults to “get fit”. Rather, I just often found myself pondering “content” and the means it has to influence one’s daily habituations."}, {"t": "p", "v": "A few random thoughts on this idea:"}, {"t": "li", "v": "<span class=\"lp\">For decades, Hollywood has had immense influence on what people are watching, thinking, and talking about. While there are other alternatives to getting a movie/<wbr/>tv-series made nowadays - there are still a handful of production execs in LA that hold immense sway over what the majority of American’s see pop up on their TV screen and the subsequent discussion that is had at the dinner table over hors d'oeuvres.</span>", "ord": true, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">While there are a myriad of different content sources nowadays (podcasts, news channels, publications, social media, etc) — and one can see the obvious benefit of multiple sources — is this always a good thing? I heard someone say recently that society in the 1800s and early 1900s was much more congenial because we all read the same books and newspapers. All ate at the same restaurants. All shopped at the same stores. Imagine that - attending a dinner party where you were all informed off the same opinion and could debate it in the same window of context.</span>", "ord": true, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">The model for “successful content” will always be at its root self centered. News channels will always be incentivized to talk “crime” over “budget cuts”. TikTok reels and YouTube feeds will naturally be catered to you and your interests because that is what is gonna get you to scroll for 20 more minutes than originally planned. The incentive structure for popularized “content” is all wrong if you’re expecting something integrous. </span>", "ord": true, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">There is an audience for pretty much everything. If you made videos where you did paint-by-number whilst crooning love songs to your cat you’d find <em>someone </em>who’d subscribe. I think sexual fetishes serve as case and point for this argument. I mean, come on, women’s feet? Really? </span>", "ord": true, "n": 4, "d": 0}, {"t": "dept", "v": "The Cunningham Memo"}, {"t": "p", "v": "With the declassification of the Cunningham Memo by the House Congressional Committee several months back (last July I believe) - the public was given an opportunity to peer into the knowledge, strategy, and concerns that Meta (formerly known as Facebook) has when it comes to it's social media platforms. And probably not surprisingly, its about what anyone would suspect. Meta (and other companies like it) have a wealth of data it captures from it's users - and they have a strategy intrinsically tied to their user research - as any business minded executive(s) should. That said, it doesn't hide the fact that the contents of this internal memo are indicative of a worldwide society that is becoming ever-more-dependent upon social media platforms. And that's whether they are cognizant of this fact or not."}, {"t": "p", "v": "Upon first hearing of the memo's declassification, I spent a few hours one weekday morning, before starting my actual job, reading the memo and highlighting the anecdotes that were of nominal interest. Let's start from the top."}, {"t": "p", "v": "\u0003Social Networks do Not Typically Remain Limited to Demographic Subgroups, Apart from Teens. E.g.\u0004", "cls": "q"}, {"t": "p", "v": "We do not typically find that adoption is tightly constrained along lines of gender, region, or social class. Instead, social apps typically are adopted at the level of a country as a whole, although adoption rates vary substantially. The one important exception is that teens often adopt a social app different from those around them (e.g., teens using SnapChat, Instagram).", "cls": "q"}, {"t": "p", "v": "Its interesting to see, internally, that Meta recognizes its adoption is largely dependent on the broader society taking up a given platform. Wouldn't be surprised if this results in Facebook/WhatsApp/Instagram targeting ads online to the culture of an entire country - versus targeting a class/profession/gender/race."}, {"t": "p", "v": "Secondly, the fact that Meta recognized the unique opportunity that teens present from an adoption standpoint is not surprising whatsoever. Especially given the strong parallel to big tobacco's focus on bringing on new \u0001young\u0002 smokers throughout the 20th century. Young people are inherently more pliable - and the data Meta harvests simply backs this supposition."}, {"t": "p", "v": "\u0003Once Users Start Using a Social App, their Use Declines Slowly (Ratchet Effect) \u0004", "cls": "q"}, {"t": "p", "v": "This ratchet effect should be both reassuring and concerning. It is reassuring because it implies we are unlikely to see any network undergo a rapid decline. It is concerning because it means that, when we see small declines in visitation, they could reflect significant declines in underlying demand or market-fit", "cls": "q"}, {"t": "p", "v": "Moreover, we see Meta recognize that their own product loses its engagement over time. Not all that surprising."}, {"t": "p", "v": "\u0003Multiple accounts on Instagram.\u0004", "cls": "q"}, {"t": "p", "v": "Around 10% of people on IG have a secondary account, and perhaps half of those use it to maintain a secondary audience. Graph overlap is quite low between primary and secondary accounts", "cls": "q"}, {"t": "p", "v": "As an Instagram user myself, before seeing this statistic, I would have presumed ~1% of Instagram users maintain a secondary account. I also would have presumed that the audience overlap would be relatively high. The anecdotal evidence for this presumption being that most of the folks in my network seem to spinoff secondary accounts for either fitness or promoting a small business (sometimes both). The fact that 10% of Instagram users maintain a secondary account is wildly surprising. What are these secondary accounts being used for? Stalking exes? Following all the \"influencers\" you are ashamed to follow with your primary account?"}, {"t": "p", "v": "TL;DR - Social media and the ways we use it speak to our society writ large (and unsurprisingly, its not all that endearing)."}, {"t": "p", "v": "The full subcommittee investigative report can be found here \u0006govinfo.gov/content/pkg/CPRT-117HPRT47832/pdf/CPRT-117HPRT47832.pdf\u0007."}, {"t": "dept", "v": "Some Literature"}, {"t": "p", "v": "Just a quote this time."}, {"t": "p", "v": "“Do you mean to tell me that you’re thinking seriously of building \u0001that way\u0002, when and \u0001if\u0002 you are an architect?”", "cls": "q"}, {"t": "p", "v": "“Yes.”", "cls": "q"}, {"t": "p", "v": "“My dear fellow, who will let you?”", "cls": "q"}, {"t": "p", "v": "“That’s not the point. The point is, who will stop me?”", "cls": "q"}, {"t": "p", "v": "-Ayn Rand (The Fountainhead)", "cls": "q"}], "mode": "two"}, {"slug": "february", "title": "February ’23", "deck": "AI chatbots, Helter Skelter, and high windows.", "eyebrow": "February 24, 2023", "mov": "2023", "blocks": [{"t": "img", "src": "img/february-00.jpg", "w": 739, "h": 743, "cap": "Exodo, 2022 by Julio Larraz (b. 1944)", "mw": 707.5, "mh": 520}, {"t": "dept", "v": "The News"}, {"t": "h3", "v": "Love Thine Neighbor"}, {"t": "p", "v": "I heard recently — via various news outlets given I don’t have TikTok — that clips of middle and high school students beating the shit out of each other have been going viral. As in, kids riding the school bus and one girl choking another kid out for no apparent reason. This seems …. bad?"}, {"t": "h3", "v": "AI Chat Bots: The Beginning of the End?"}, {"t": "p", "v": "With OpenAI releasing their ChatGPT bot and Microsoft integrating Bing’s search engine with it, we’ve seen a lot of coverage/awe/hysteria surrounding the “power” of AI. While it’s true, these AI bots are fascinating to interact with and they do a really good job of mimicking human behavior, this is because they are trained on terabytes (I don’t know the actual scale of the data but its a lot) of data from the Internet. Think millions of tweets, Facebook posts, Instagram captions, etc. And are you honestly that surprised when the AI bot says it “wants to break you up with your wife and cook your meals”? You shouldn’t be. An AI model trained based on the way humans treat each other on the Internet is a morally ambiguous turnstile."}, {"t": "h3", "v": "Spy Balloons? Since When?"}, {"t": "p", "v": "Its been all over the news: spy balloons, foreign dignitaries, fighter jets, etc. But am I the only one surprised we are having this conversation in the first place? Since when do foreign governments use \u0001balloons \u0002to perform reconnaissance as opposed to satellites and lasers and shit? I’m inclined to believe the Chinese either think we are stupid (probably valid) or that they were actually just using the “spy balloon” to measure the atmosphere and clouds and such and it slipped from their grasp."}, {"t": "dept", "v": "Ideas"}, {"t": "h3", "v": "Helter Skelter"}, {"t": "p", "v": "I was watching the Capote biopic starring Philip Seymour Hoffman, which centers around the author Truman Capote as he works on the true crime novel \u0001In Cold Blood\u0002, and was intrigued to learn that \u0001In Cold Blood\u0002 is actually the \u0001second \u0002best selling true crime novel of all time - behind a book named \u0001Helter Skelter\u0002. The book \u0001Helter Skelter\u0002 was written by the lawyer who prosecuted Charles Manson in the late 1960s and focused on the Manson Family and the crimes they committed - notably the murder of actress Sharon Tate and the others who were living with her in the Hollywood Hills during the summer of 1969. Given that I had seen \u0001Once Upon a Time in Hollywood\u0002 a couple years back, the Tarentino film that makes reference to this series of events, I was vaguely familiar with Charles Manson. However, the absolute fanaticism that the cult lead by Manson embodied ended up being the crux upon which my interest was levied - and its still sometimes hard to believe it actually happened."}, {"t": "p", "v": "For starters, Charles Manson had convinced a group of 25+ people (primarily young women) that he was “Mans Son” (Manson) — the second coming of Jesus Christ. He read from the Book of Revelations while his followers “tripped” on LSD, organizing orgies in order to allow his “family” to experience the release of all inhibitions and ego. Enabling them to \u0001truly \u0002love. He pronounced that the Beatles were angels sent by God and that their message was purveyed through \u0001The White Album\u0002. The scripture? That the white man had had his day. That the “piggies” and their materialistic view of the world was soon to come to an end and that the blacks in America who had so long been oppressed were to finally rise. This message eventually becoming action with the murder of actress Sharon Tate, Jay Sebring (world renowned hair stylist), Abigail Folger (heiress to the Folgers Coffee company), Wojciech Frykowski (a Polish immigrant), and Steven Parent (an eighteen year old Hi-Fi enthusiast) in their Hollywood Hills home on the night of August 8, 1969."}, {"t": "p", "v": "Is there really any way to truly understand the psychology behind Charles Manson and the actions taken by his followers? Probably not - at least not entirely. But I think this excerpt from the book, where officers interviewed local residents of Death Valley California when tracking the “hippie group” living nearby, is indicative of world in which these people were living:"}, {"t": "p", "v": "They began questioning Crockett and Poston. The officers had come looking for arson suspects, and a possible stolen vehicle. They found something totally unexpected. From Pursell’s report: “The interview resulted in some of the most unbelievable and fantastic information we had ever heard: tales of drug use, sex orgies, the actual attempt to re-create the days of Rommel and the Desert Corps by tearing over the countryside by night in numerous dune buggies, the stringing of field phones around the area for rapid communication, the opinion of the leader that he is Jesus Christ and seemed to be trying to form a cult of some sort…”", "cls": "q"}, {"t": "h3", "v": "Narrowed Vision"}, {"t": "p", "v": "It is impossible for your brain to comprehend all the sensory data that it is being sent from your eyes. So naturally, your brain is really good at focusing its computation on one thing at a time - think of this as “zooming in”. But why do we zoom in on some things and not others? For certain cases the answer is obvious. You focus on the stop light when waiting for it to turn green so you know when you can release the brake. You look someone in the eye when they’re telling you a story in order to be polite. But what about when you’re walking out your front gate and zoom in on the clouds overhead? You stop, eyes raised, focusing on a single white cloud juxtaposed against the blue sky. Why? Why in that moment did your subconscious ask your eyes to stop, hold on a second, there’s something right there \u0001really \u0002worth\u0001 \u0002seeing."}, {"t": "p", "v": "I watched a movie recently called “Before Sunrise” starring a young Ethan Hawke and one of his lines struck me on this:"}, {"t": "p", "v": "Why is it, that a dog, you know, sleeping in the sun, is so beautiful, you know, it is, it's beautiful, you know, but a guy, standing at a bank machine, trying to take some money out, looks like a complete moron?", "cls": "q"}, {"t": "h3", "v": "Ayn Rand and Love"}, {"t": "p", "v": "I’ve been re-reading \u0001The Fountainhead\u0002 over the holidays (one of my favorite books) and find Ayn Rand’s notion of “love” to be completely contrary to the traditional dogmatic definition we’re so often prescribed."}, {"t": "p", "v": "… love is reverence, and worship, and glory, and the upward glance. Not a bandage for dirty sores. But they don’t know it. Those who speak of love most promiscuously are the ones who’ve never felt it. They make some sort of feeble stew out of sympathy, compassion, contempt, and general indifference, and they call it love. Once you’ve felt what it means to love as you and I know it — the total passion for the total height — you’re incapable of anything else.", "cls": "q"}, {"t": "p", "v": "-Ayn Rand (The Fountainhead)", "cls": "q"}, {"t": "p", "v": "Society’s Ideal “Partner”:"}, {"t": "li", "v": "<span class=\"lp\">Caring</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Comforting (tells you what you <em>want </em>to hear)</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Self-sacrificial</span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Two is better than one</span>", "ord": false, "n": 4, "d": 0}, {"t": "p", "v": "Rand’s Notion of Ideal “Partner”:"}, {"t": "li", "v": "<span class=\"lp\">Someone who respects themselves foremost</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Refuses to compromise their ideals</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Exalts themselves and thereby their partner</span>", "ord": false, "n": 3, "d": 0}, {"t": "p", "v": "And these definitions shouldn’t come as a surprise to anyone familiar with Ayn Rand’s philosophy of Objectivism. It also shouldn’t surprise that Rand paints the opposing philosophy of “love” in stark contrast to her own and doesn’t pull any punches. While I consign that there is certainly a grey area between these two definitions of an “ideal partner”, I think the important point is that so often we are told we need to find someone who “suits you” and not someone who “improves you”."}, {"t": "dept", "v": "Some Literature"}, {"t": "p", "v": "I’ve been really interested in a British poet named Philip Larkin lately."}, {"t": "p", "v": "Rather than words comes the thought of high windows: The sun-comprehending glass, And beyond it, the deep blue air, that shows Nothing, and is nowhere, and is endless.", "cls": "pull"}, {"t": "p", "v": "If you want to read the whole poem → Poetry Foundation: High Windows \u0006poetryfoundation.org/poems/48417/high-windows\u0007"}], "mode": "two"}, {"slug": "march", "title": "March ’23", "deck": "Amazon's $40bn \"advertising\" business, thought experiments, and Roman traditionalism", "eyebrow": "March 19, 2023", "mov": "2023", "blocks": [{"t": "img", "src": "img/march-00.jpg", "w": 1845, "h": 1500, "cap": "Anastasis of the Wild, 2019 by Celeste Dupuy-Spencer (b. 1979)", "mw": 707.5, "mh": 520}, {"t": "dept", "v": "The News"}, {"t": "h3", "v": "Amazon: World’s Largest “Advertiser”"}, {"t": "p", "v": "There was a really interesting piece by tech blogger Benedict Evans last week regarding Amazon being the world’s largest “advertiser”. To clarify, advertising in this case means the “suggested” products on Amazon.com when you are browsing/searching for products. Many consider these “advertisements” to be a nuisance given you have to scroll through 2-4 suggested products before getting the default search results, but Amazon has managed to turn this feature into a 40 billion dollar profit with minimal operating costs. Amazon simply opened up the marketplace and now lets vendors bid for “advertising” time. Key the invisible hand."}, {"t": "p", "v": "It’s interesting to consider the semantics of this. For one, in a marketplace with thousands (if not millions) of similar products, how do you prioritize one over another from a marketplace perspective? Is it reviews based? Sales? And on the other hand from a vendor/seller perspective, does letting the market compete for “air time” make things more fair? Isn’t that how things work in the real world? You create a product and pitch it on TV + billboards to drive up sales?"}, {"t": "p", "v": "Another aspect of this is how Amazon prorates their advertising slots. Are advertising rates based on cumulative searches? Sales? Time of day? I’d be willing to bet Amazon’s advertising pricing model includes all the above."}, {"t": "p", "v": "But perhaps most importantly is that Amazon made 40 billion dollars with minimal effort and exorbitant resultant margins (whereas the Prime + AWS business make great profits, but suffer from steep operating expenditures). It almost feels like in today’s day and age you can make money on pretty much anything - assuming you have a massive platform that is."}, {"t": "p", "v": "Full article: \u0006https://www.ben-evans.com/benedictevans/2023/3/6/ways-to-think-about-amazon-advertising\u0007"}, {"t": "h3", "v": "American Banking: Groupthink 101"}, {"t": "p", "v": "It came out earlier this month that Silicon Valley Bank (SVP) had collapsed and this was was due in large part to SVP purchasing large sums of US treasury bonds over the past few years. While this is typically a safe investment — one I could see financial advisors recommending at this very moment due to existing uncertainty in global markets — this was not the case for SVP given the run that was made on the bank in recent weeks. The run on the bank by investors resulted in the bank having to sell their bonds prematurely for pennies on the dollar since better bonds are available at this very moment due to recent interest rate hikes by the Fed to reduce inflation. From this, I find myself ever-cynical of the American banking system. It seems reminiscent of 2008. Aka, banks assuming the worst can’t happen — and if it does? — the United States government will be there to bail them out (at the expense of the taxpayer of course)."}, {"t": "dept", "v": "Ideas"}, {"t": "h3", "v": "Hitchhikers"}, {"t": "p", "v": "Very random: I realized this week that I’ve never seen hitchhikers before coming to Flagstaff. I mean, yeah, you’d see the occasional one on I-35 in Iowa, but in Flagstaff, I see hitchhikers every single day on 89-A. Maybe its a coastal thing? My barber was also telling me that apparently Flagstaff really started to grow ~15 years go (mostly due to an influx from California). My brain recognizes some connection between California + hitchhikers but can’t quite formalize it. Anyway - I still havent offered a ride to one yet :p"}, {"t": "h3", "v": "The Way We See Colors"}, {"t": "p", "v": "I’m taking a course currently for my masters degree called \u0001Visual Interfaces to Computers\u0002. It’s primarily focused on how to set up cameras such that you can train a computer program to “recognize” certain objects. One of the primary ways this is done is by a means called “color segmentation” where you mark a pixel as either white or black depending on if its above or below a certain threshold. This results in a greyscale image where white represents the portion of the image that is similar to the color you are looking for (and those that are not are seen as black). Here’s an example where an image of a gold fish is segmented by the color orange (original image on the right):"}, {"t": "img", "src": "img/march-01.png", "w": 1086, "h": 377, "cap": "Real Python, “Image Segmentation Using Color Spaces in OpenCV + Python”", "mw": 400, "mh": 440}, {"t": "p", "v": "Once you distill an input image down to black or white - then you can compare the shape, size, etc to other input images and find those that are “nearby” - aka find other images that are similar to our orange fish here. That alone is pretty intriguing but the real interesting tidbit surrounding all this color stuff — in my opinion — is that apparently humans are \u0001very good\u0002 at seeing differences in the color green but \u0001very poor \u0002at seeing differences in the color blue (red falls somewhere in the middle). Why does this matter? Because I find it interesting that when you go to the grocery store, you will notice the minute differences between the heads of broccoli simply because you see the nuance in green more readily. Whereas the ripeness of blueberries will have less of an impression. Human perception is weird."}, {"t": "h3", "v": "Thought Experiment: Original Position"}, {"t": "p", "v": "I watched a movie called \u0001The Fountain\u0002 last week starring Hugh Jackman which resulted in going deep down the metaphysics rabbit hole one night afterwards. While on this escapade, I came across the logician John Rawls and his relatively famous thought experiment titled “Original Position” which I thought was really interesting. The basic idea is as follows:"}, {"t": "img", "src": "img/march-02.jpg", "w": 800, "h": 480, "cap": "", "mw": 400, "mh": 440}, {"t": "p", "v": "You are asked to structure society behind a “veil of ignorance”. That is, you must structure society such that you don’t know where you will be placed on the other side (you may be smart, rich, poor, disabled, etc). Rawls proports that by doing so, you would structure society more fairly since you will impart principles to the benefit of “most” given that is where you are likely to land on the other side."}, {"t": "p", "v": "I, personally, don’t think this is a realistic approach given inherent human biases - which is probably why this thought experiment is oft-referred to as ahistorical. It would, however, be interesting to have some semi-unbiased AI try and design a culture behind a veil of ignorance. Wouldn’t be surprised if the AI placed humans at the bottom of the totem pole :p"}, {"t": "h3", "v": "Roman Society: Traditionalism With Trade-Offs"}, {"t": "p", "v": "I’ve been doing a lot of reading surrounding Roman culture recently and find myself ever-surprised at how traditional a society could be while also maintaining a severe air of liberalism in very specific facets. From a traditionalistic standpoint, Roman society was heavily imparted with themes of heredity, property, citizenship, and wealth. It was also heavily veered towards men — women were defined by the social status of their fathers or husbands. Then, on the flipside of the coin, it was also acceptable to enjoy same-sex relationships and even engage in acts of pederasty (think man + boy) without a degradation in social status. So to sum up, honor your father and mother but feel free to fondle the neighbor boy?"}, {"t": "dept", "v": "Some Literature"}, {"t": "p", "v": "Character teaches above our wills. Men imagine that they communicate their virtue or vice only by overt actions, and do not see that virtue or vice emit a breath every moment. - Ralph Waldo Emerson", "cls": "q"}], "mode": "two"}, {"slug": "april", "title": "April ’23", "deck": "Intelligence leaks, mate switching, and the viability of Airbnb", "eyebrow": "April 15, 2023", "mov": "2023", "blocks": [{"t": "img", "src": "img/april-00.jpg", "w": 2000, "h": 1414, "cap": "The Eternal City, 1937 by Peter Blume (1906–1992)", "mw": 707.5, "mh": 520}, {"t": "dept", "v": "The News"}, {"t": "h3", "v": "US National Security Leak"}, {"t": "p", "v": "I’ve been following (though very briefly) the US national security leak that happened this past week and find the following points of nominal interest:"}, {"t": "li", "v": "<span class=\"lp\">Apparently the US was pressuring Jordan to support Ukraine? But Jordan was hesitant given they don’t want to piss off the Chinese? </span>", "ord": true, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">The US gave Israel the ultimatum “either you help Ukraine develop iron dome technology or we won’t support a strike on Iran if/<wbr/>when they develop nukes”</span>", "ord": true, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">This seems like blackmail to most precipitous degree? </span>", "ord": true, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Apparently Egypt was trying to sell rockets to Russia?</span>", "ord": true, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Given we are <em>technically </em>allies with Egypt, this is essentially them going behind our back?</span>", "ord": true, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">The leaked documents make it seem like Ukraine isn’t faring as well in the war with Russia as the media makes it seem</span>", "ord": true, "n": 4, "d": 0}, {"t": "li", "v": "<span class=\"lp\">US intelligence officials also indicate in the documents that they are skeptical the war can/<wbr/>will end favorably for Ukraine</span>", "ord": true, "n": 1, "d": 1}, {"t": "p", "v": "The fact that the individual responsible for leaking the documents is a 21 year old Air National Guardsman makes me think this sort of classified information is far too readily available. What ever happened to security clearance? Are intelligence servers even password protected at this point?"}, {"t": "h3", "v": "ChatGPT: Not Entirely Factual"}, {"t": "p", "v": "I’m subscribed to a tech blogger named Benedict Evans and over the past month this is the piece that caught my eye the most:"}, {"t": "p", "v": "If you ask ChatGPT factual questions, you can’t trust what you get. In this case, it invented an entirely non-existent sexual assault allegation against a law professor, complete with (non-existent) Washington Post story. Also of note - the professor, since he’s apparently a somewhat controversial figure, assumes that this must be something to do with his politics. Since all LLMs do this all the time about anyone and anything, there’s no reason to think he’s right, but this is a good illustration of just how hard it is for normal people outside tech (or even inside) to grasp what these systems are doing. They are \u0001not\u0002 answering questions - they're making something that looks like an answer to questions that look like your question. But, can you stop them from libeling people? Article Link \u0006jonathanturley.org/2023/04/06/defamed-by-chatgpt-my-own-bizarre-experience-with-artificiality-of-artificial-intelligence\u0007", "cls": "q"}, {"t": "p", "v": "Specifically, this line:"}, {"t": "p", "v": "They (AI) are \u0001not\u0002 answering questions - they're making something that looks like an answer to questions", "cls": "q"}, {"t": "p", "v": "Makes me think that AI “taking over everything” remains a ways off. There is still a need to “audit” the work of an AI engine given its trained on trillions of data points where fact and fiction are one and the same."}, {"t": "dept", "v": "Ideas"}, {"t": "h3", "v": "Temporal Differences in Gestures"}, {"t": "p", "v": "I was watching a lecture for my Visual Interfaces class a couple months back and my Professor brought up the idea of “temporal differences in gestures”. The example he gave is that if you were to ask a Gen X-r to imitate using a phone, they would move their hand up to their ear. But if you were to ask a Gen Z-r to do the same thing they would hold their palm out in front of them and tap their finger against it. The point he was trying to make is that every age group, society, etc has a unique difference in the way they understand and gesture things — which in turn makes it really hard to train computers + cameras to interpret this myriad of potentialities."}, {"t": "h3", "v": "“Mate Switching” (aka trade-in and trade-up :p)"}, {"t": "p", "v": "I was listening to Joe Rogan interview David Buss (Berkeley/Harvard/UTexas evolutionary psychologist) on my drive back from Flagstaff to St. Paul and found the entire subject of “mate switching” incredibly fascinating. Buss goes into the “how” and “why” of adulatory and examines both the psychological and biological basis for which this tends to occur (I, personally, find the biological explanations the most thought provoking). Here are my notes from listening to the podcast and reading Buss’s research paper on the subject:"}, {"t": "h4", "v": "\u0003The Statistics\u0004"}, {"t": "li", "v": "<span class=\"lp\">Lifelong monogamy does not characterize the primary mating pattern of humans</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">American divorce rates have hovered in the 50% range over the past several decades, and remarriage is common</span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">85% of American adults have experienced at least one romantic breakup</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Ala, breaking up with one partner and re-mating with another —mate switching—may more accurately characterize the common, perhaps the primary, mating strategy of humans</span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Among married couples, estimates of infidelity rates are estimated to be 26% for women and 50% for men</span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">An estimated 79% of women who cheat fall in love (in contrast to only a third of men)</span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Most women who cheat are unhappy in their current relationship (seems like a no-brainer)</span>", "ord": false, "n": 2, "d": 1}, {"t": "li", "v": "<span class=\"lp\">But the kicker is that when men cheat, only half reported that they were “unhappy in their existing relationship”</span>", "ord": false, "n": 1, "d": 2}, {"t": "h4", "v": "\u0003The Explanations Given\u0004"}, {"t": "li", "v": "<span class=\"lp\"><strong>Dual Mating Strategy Hypothesis</strong></span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">“Woman's mate preferences shift to more bodily masculine and behaviorally dominant men when ovulating”</span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">TL;DR — women will (on average) tend to find Jason Momoa-esque figures <em>more attractive</em> during the height of their ovulation cycle and this has also been found to correspond with the time (and types of men) women will tend to cheat with</span>", "ord": false, "n": 1, "d": 2}, {"t": "li", "v": "<span class=\"lp\">The biological explanation for this is the acquiescence of “good genes” while also retaining “safety” and “care”  </span>", "ord": false, "n": 2, "d": 2}, {"t": "li", "v": "<span class=\"lp\"><strong>Mate Switching Hypothesis</strong></span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">“The mate switching hypothesis provides an alternative explanation for why women have affairs—namely to provide mate insurance, to cultivate backup mates, to assess the viability of a switch, to render the transition back into the mating market easier, or to trade up to a new partner who is less cost-inflicting, more benefit-bestowing, or higher in mate value than their current partner”</span>", "ord": false, "n": 1, "d": 1}, {"t": "p", "v": "I realize this is probably a “touchy” subject (especially for those in a committed relationship at present). I just find the whole subject interesting. Feel free to chastise me in person with your thoughts :D"}, {"t": "p", "v": "Buss’s Research Paper: \u0006https://labs.la.utexas.edu/buss/files/2013/02/The-Mate-Switching-Hypothesis-FINAL-PUBLISHED-2017.pdf\u0007"}, {"t": "p", "v": "And podcast link:"}, {"t": "img", "src": "img/april-e0.jpg", "w": 640, "h": 640, "cap": "Joe Rogan, “#1959 - David Buss”", "mw": 400, "mh": 440}, {"t": "h3", "v": "On the Reconciliation of Self-Interested Parties"}, {"t": "p", "v": "I’ve been slowly making my way through the Federalist Papers the past few months and find them to be very thought provoking. But before going any further — \u0001background\u0002. The Federalist Papers were a series of periodicals during the time of ratification of the United States Constitution where James Madison, John Jay, and Alexander Hamilton argued why the states should support such a proposal via anonymous publications under the pseudonym “Publius” which is Latin for “of the people” (which I find kinda badass). Thus far, I’ve found Hamilton + Madison to be the most eloquent. Jay argues things too practically."}, {"t": "p", "v": "Anyway, I recently read #10 which was written by James Madison and centers around the question of “how to reconcile citizens with interests contrary to the rights of others or inimical to the interests of the community as a whole”. Here’s my TL;DR to save you some time:"}, {"t": "p", "v": "The majority will always remain self-interested. This being the case, human good and private rights always remain at-risk. Ala - pure democracy isn’t the answer. Republican government ensures the self-interested majority cannot trample the private rights of minority factions.", "cls": "q"}, {"t": "h3", "v": "The Viability of Airbnb"}, {"t": "p", "v": "I’ve spoken to several friends about this and am of the opinion that Airbnb — and Vrbo by extension — are the way of the future. Sure, my parent’s (and grandparent’s) generation tend to opt for hotel stays when traveling, but from millennials downward no one wants to book a hotel when taking their vacation. Instead, they want to stay somewhere exorbitant, fully furnished, with the makings of a “home” such that they feel comfortable yet “outside their means”; which in my opinion tends to be at the heart of most vacationing spirit."}, {"t": "p", "v": "In summation, the emergence of vacation rentals as a modern day “timeshare” have opened the door to enlivening the stylization only glimpsed through the flash bulbs of movie cameras and the glib filters of your Instagram feed."}, {"t": "dept", "v": "Some Literature"}, {"t": "img", "src": "img/april-01.png", "w": 657, "h": 391, "cap": "", "mw": 400, "mh": 440}], "mode": "two"}, {"slug": "may", "title": "May ’23", "deck": "Disney's provincial beginnings, stone masonry nullification, and further iterations on \"California\"", "eyebrow": "May 20, 2023", "mov": "2023", "blocks": [{"t": "img", "src": "img/may-00.png", "w": 740, "h": 670, "cap": "The Blue Bird I, 2019 by Natalie Frank (b. 1980)\n(no - this image doesn’t have some hidden implications with my love life — lol — I just enjoy the thoughts it brings to mind :p)", "mw": 707.5, "mh": 520}, {"t": "dept", "v": "The News"}, {"t": "h3", "v": "Walt Disney World. An Idealistic Vision."}, {"t": "p", "v": "It’s been all over the news lately, Florida + DeSantis revoking Walt Disney World’s special governmental permissions in Florida. Frankly, I don’t really have an opinion one way or another on whether this is good or bad (see valid points on both sides) but the rumblings did bring to mind the history of Disney World’s construction back in the 1960s (which I had read about a longggg time ago)."}, {"t": "p", "v": "The crux of it:"}, {"t": "li", "v": "<span class=\"lp\">Walt Disney Productions buys some 27k acres near Orlando, Florida in the 60s</span>", "ord": true, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">All of which was done through a series of dummy corporations to avoid land speculation/<wbr/>rushes</span>", "ord": true, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Disney works with the state of Florida to get the Reedy Creek Improvement Act passed</span>", "ord": true, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">This basically established Walt Disney World as a “county-esque” entity with all the rights/<wbr/>liabilities/<wbr/>freedoms that come with it</span>", "ord": true, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Disney mostly wanted this in place so that they could build/<wbr/>iterate without the traditional governmental/<wbr/>zoning red tape</span>", "ord": true, "n": 2, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Part of getting this passed involved lobbying for Disney’s vision of EPCOT</span>", "ord": true, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Maybe I’m the only one, but I always thought EPCOT was just another district within Walt Disney World</span>", "ord": true, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Didn’t realize EPCOT stands for “Experimental Prototype Community of Tomorrow” which was intended to serve as a test bed for new city-living innovations (this sounds like some 1960s American idealism/<wbr/>sci-fi kinda of shit)</span>", "ord": true, "n": 2, "d": 1}, {"t": "p", "v": "I’m realizing now that I don’t really have a point to this Disney stuff. I just find the establishment/vision for Walt Disney World fascinating. It reminds of that movie that came out years ago called Tomorrowland."}, {"t": "dept", "v": "Ideas"}, {"t": "h3", "v": "Stone Masonry Nullification"}, {"t": "p", "v": "As several of my close friends are aware, I’m a big fan of the author Cormac McCarthy. What many may not know is that McCarthy is extremely reclusive and has only ever given a handful of interviews. One of which (supposedly forced upon him by his literary agent) took place back in El Paso, Texas in the early 90s. My favorite excerpt:"}, {"t": "p", "v": "\"Stacking up stone is the oldest trade there is,\" he says, sipping a Coke. \"Not even prostitution can come close to its antiquity. It's older than anything, older than fire. And in the last 50 years, with hydraulic cement, it's vanishing. I find that rather interesting.\"", "cls": "q"}, {"t": "p", "v": "I don’t have much to add — given McCarthy says it so eloquently — but imagine the scope of his supposition. Stone masonry predates even the trade of Jesus Christ (carpentry) and has virtually gone extinct in the last 80 years. What does that say about humanity? Have we lost touch with the beginnings of the world?"}, {"t": "p", "v": "Full interview: \u0006https://archive.nytimes.com/www.nytimes.com/books/98/05/17/specials/mccarthy-venom.html?_r=2\u0007"}, {"t": "h3", "v": "Ex Machina: Movie or Prophecy?"}, {"t": "p", "v": "I (re)watched the movie Ex Machina recently and purposefully made a point of taking notes. For those unaware, the movie involves a tech billionaire trying to create a sentient AI (who just so happens to be played by a stunning Swedish actress). Anyway, you tell me if any of these “notes” make sense:"}, {"t": "li", "v": "<span class=\"lp\">The magician’s assistant —&gt; misdirection</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">If you leave two AI alone, do they speak English? Or their own language? </span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">To act upon cascading ideals</span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">When we pass the Turing Test we become Gods — having created Men</span>", "ord": false, "n": 4, "d": 0}, {"t": "h3", "v": "Contextual Perception"}, {"t": "p", "v": "It is impossible for your brain to comprehend all the sensory data that it is being sent from your eyes. So naturally, your brain is really good at directing its computation to one thing at a time - think of this as “zooming in”. But why do we zoom in on some things and not others? For certain things the answer is obvious. You focus on the stop light when waiting for it to turn green so you know when you can release the brake. You look someone in the eye when they’re telling you a story in order to be polite. But what about when you’re walking out your front gate and zoom in on the clouds overhead? You stop, eyes raised, focusing on a single white cloud juxtaposed against the blue sky. Why? Why in that moment did your subconscious ask your eyes to stop — hold on a second — there’s something right there worth comprehending."}, {"t": "p", "v": "I recently watched “Before Sunrise” starring a young Ethan Hawke and one of his lines stuck with me on this:"}, {"t": "p", "v": "Why is it that a dog, you know, sleeping in the sun, is so beautiful, you know, it is, it's beautiful, you know, but a guy standing at a bank machine, trying to take some money out, looks like a complete moron?", "cls": "q"}, {"t": "p", "v": "It feels like its a matter of context. And your subconscious is the one driving your frame of perception in every waking moment."}, {"t": "h3", "v": "Suffering (in concept and in practice)"}, {"t": "p", "v": "You may have come to realize a lot of my “ideas” stem from either movies or books (and I willfully acknowledge that haha). And while on that note, I saw a movie called “Tree of Life” a few weeks back starring Brad Pitt and Jessica Chastain and it was really weird. Like, entire intervals during the film where it was nothing but volcanos erupting and deep sea organisms ebbing in the flow. However, there was this common theme of “suffering” throughout the movie surrounding the Book of Job from the Bible. I’ll give some background on the eternal story first:"}, {"t": "p", "v": "The Book of Job tells the story of a powerful, wealthy and genuinely upright man who loses everything through no fault of his own—his children, his health, his possessions—only to be reproached by his friends for stubbornly refusing to acknowledge his own guilt and maintaining his faith in God.", "cls": "q"}, {"t": "p", "v": "We have a man who has everything taken from him through the machinations of the world at work. All of us would hope we were as graceful as Job and take it in stride, but we all know we wouldn’t. We would question and curse the world and thereby God until we could come to grips with our immense suffering."}, {"t": "p", "v": "But Job’s story is a testament to who we \u0001could be\u0002. To what we \u0001ought to become\u0002. Maybe that’s the power of great stories?"}, {"t": "h3", "v": "Hollywood and Its Self Representation"}, {"t": "p", "v": "There’s this idea in the book/movie Fight Club that “…we've all been raised on television to believe that one day we'd all be millionaires, and movie gods, and rock stars…” And I think this applies not only to the modern psychology of “who we should be” but also to “where we think we should be”. Generations of permeable culture has its epicenter in Hollywood California. Its in the music, movies, and advertisements we so often absorb. Naturally as a result, we find ourselves at 25 or 30 having a “quarter life crisis” and thinking if only we moved to LA that the world would right itself. That the golden land holds promises our current setting does not. And while it may be true that the weather in Cali is nominally better than most parts of the country, I think its important to acknowledge the discrepancies in cultural representation before loading up the U-Haul and “heading west”. Your setting dictates only \u0001some \u0002of your opportunities. Whether you act to afford new ones is a matter of conscious resolve."}, {"t": "dept", "v": "Some Literature"}, {"t": "p", "v": "I called Dallas, and one hot afternoon we drove around the Hollywood hills and talked. Dallas had long blonde hair and a sundress and she was concerned about a run in her stockings and she did not hesitate when I asked what it meant to be a movie star. “It means being known all over the world,” she said. “And bringing my family a bunch of presents on Christmas Day, you know, like carloads, and putting them by the tree. And it means happiness, and living by the ocean in a huge house.”", "cls": "q"}, {"t": "p", "v": "- Joan Didion (The White Album)", "cls": "q"}], "mode": "two"}, {"slug": "june", "title": "June ’23", "deck": "Black holes, interpreting reality, and the Apple Vision Pro.", "eyebrow": "June 17, 2023", "mov": "2023", "blocks": [{"t": "img", "src": "img/june-00.jpg", "w": 1536, "h": 2048, "cap": "Film poster for Blade Runner 2049 by James Jean", "mw": 707.5, "mh": 520}, {"t": "dept", "v": "The News"}, {"t": "h3", "v": "Netflix: Summer 2023"}, {"t": "p", "v": "Its that time of year again. I usually only pay for a streaming service for a couple months at a time, then once I get bored with their content, I’ll switch (between HBO/Netflix/Hulu/etc). That said, Netflix is set to release two new seasons for shows I thoroughly enjoy:"}, {"t": "li", "v": "<span class=\"lp\">The Witcher (Season 3)</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Black Mirror (Season 6)</span>", "ord": false, "n": 2, "d": 0}, {"t": "p", "v": "This is just a PSA incase you forget (like I did) :p"}, {"t": "h3", "v": "Apple Vision Pro"}, {"t": "p", "v": "Speaking of Black Mirror, anyone else see the Apple Vision Pro expo a couple weeks ago? As someone who is familiar with the computer vision technical space, I did not think we were \u0001this \u0002close to some of the features Apple announced."}, {"t": "p", "v": "For example:"}, {"t": "li", "v": "<span class=\"lp\">Interacting with a visual interface using just your eyes</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">3D pictures + video</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Casting movies + shows in pretty much any physical context </span>", "ord": false, "n": 3, "d": 0}, {"t": "p", "v": "Feels like just yesterday we were talking about how this technology was 5-10 years away. Meanwhile, we’re a few short years (after Apple reduces the cost that is) from everyone owning a pair of these and spending the entirety of our time in the OASIS (reference to \u0001Ready Player One\u0002 if anyone else has seen that movie — great depiction of a virtual reality simulation dominating a society imo)."}, {"t": "p", "v": "For as much shit as virtual reality gets for being the epitome of a “future dystopian society” — I will say — some of these things are just plain cool."}, {"t": "dept", "v": "Ideas"}, {"t": "h3", "v": "One Liners"}, {"t": "p", "v": "Experimenting with a new “ideas” segment this month. Just a bunch of random one liners that I typically aggregate on my phone when they come to mind throughout the day/week."}, {"t": "li", "v": "<span class=\"lp\">The Gods envy us.</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Adam and Eve were the last to be created by the hands of God. </span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Road Work Ahead —&gt;<em> Gentrification </em>Work Ahead</span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">What are your obscure interests?</span>", "ord": false, "n": 4, "d": 0}, {"t": "h3", "v": "Black Holes Abduct Photons"}, {"t": "p", "v": "My interest in physics probably peaked by sophomore year in college (though it never completely waned) and more recently I tend to offset reading classic literature with some occasional scientific or economic work which scratches the itch. As of late, this focus has been on black holes."}, {"t": "p", "v": "Black holes are formed from collapsed stars and have such intense gravity that they warp time and space. And as you may already know, black holes get their name because at a certain point — referred to as the “horizon” — nothing escapes, not even light."}, {"t": "p", "v": "However, I learned recently that not all light is sucked into a black hole — some of it escapes. Yet, given how intense gravity is nearby, photons of light will sometimes spin around multiple times before finally escaping and shooting off into space (at the speed of light). This is what gives black holes the “ring of fire” look:"}, {"t": "img", "src": "img/june-01.png", "w": 985, "h": 568, "cap": "NASA’s Goddard Space Flight Center / Jeremy Schnittman", "mw": 400, "mh": 440}, {"t": "p", "v": "If you look closely, you can see that the “rings” spin faster near the event horizon and slower the farther away they get. This is a visual representation of how black holes “warp” space-time."}, {"t": "p", "v": "You can read more here if interested: The Photon Sphere \u0006nasa.gov/feature/goddard/2019/nasa-visualization-shows-a-black-hole-s-warped-world\u0007"}, {"t": "p", "v": "And I’d highly recommend this book on the entire subject: The Science of Interstellar \u0006amazon.com/Science-Interstellar-Kip-Thorne/dp/0393351378\u0007"}, {"t": "h3", "v": "How Your GPS Works (Trilateration)"}, {"t": "p", "v": "I think most people know the high level of how a GPS works. As in, you need a minimum of three points of reference to locate your exact position on Earth. This is often (wrongly) referred to as “triangulation”. Let me explain."}, {"t": "li", "v": "<span class=\"lp\">Satellite emits signal</span>", "ord": true, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">The signal contains one very important component: <em>the time it was sent</em></span>", "ord": true, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Your GPS on Earth receives signal</span>", "ord": true, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">The GPS notes <em>the time the signal was received</em></span>", "ord": true, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">It then compares the time the signal was sent to when it was received</span>", "ord": true, "n": 2, "d": 1}, {"t": "li", "v": "<span class=\"lp\">Using this time difference (and the speed at which the signal travels) the GPS receiver is able to determine the distance from the receiver to the satellite </span>", "ord": true, "n": 3, "d": 1}, {"t": "p", "v": "So thats the basics of how a GPS receiver determines how far away a given satellite is (essentially just using timestamps). But as we all know, a GPS needs three satellites to determine its exact position. Lets take the example we just walked through (one satellite):"}, {"t": "img", "src": "img/june-02.png", "w": 379, "h": 260, "cap": "", "mw": 400, "mh": 440}, {"t": "p", "v": "Your GPS doesnt know the angle at which the signal was propagated from the satellite — only the distance. Therefore, in relation to the satellite, you could be at any of the points on the above circle (which share the same distance from your GPS to the satellite). Hence, you need three distances (or three circles) to find your GPS’s exact location (the point which they all intersect):"}, {"t": "img", "src": "img/june-03.png", "w": 479, "h": 343, "cap": "", "mw": 400, "mh": 440}, {"t": "p", "v": "Closing out, I want to add that this method is actually called “trilateration” which is often confused with “triangulation” given its simply using distances (not angles). So if someone ever tells you that a GPS uses triangulation to find your exact location feel free to correct them :p"}, {"t": "h3", "v": "Interpreting Reality"}, {"t": "p", "v": "I’ve been rather interested in metaphysics recently and been doing a lot of pondering about the relationship between conscious experience and our innate human biology. That is — what is free will — if there be such a thing? Are we are simply neurons firing in concise intervals? If we make decisions because our neurons fire in accordance with some biological setting than how can we claim free will even exists? Does that mean life is deterministic?"}, {"t": "p", "v": "I know its a heavy subject and honestly still do believe in “will to power” as Nietzsche likes to put it. Or if you’ve read Ayn Ran her response would probably be “Who is John Galt?”"}, {"t": "p", "v": "But the crux of this argument (often made by Sam Harris) is that if we are beings that live a conscious experience based on predetermined biology and phycological disposition — then how can we condone someone for performing heinous acts? For example, if I steal a loaf of bread from a street vendor — the deterministic argument would be that if presented with that same decision a million times under the same exact biological/life conditions I would make the same (poor) decision regardless of morality/free-will."}, {"t": "p", "v": "And while its hard to argue with biology, no one truly believes this is the case right? We feel the gravity of making important decisions each and every day. And naturally you could argue that if someone were to \u0001honestly \u0002believe they did not have free will and that there decisions did not matter (given it was predetermined) then any decision to be made requires no stress, anxiety, or concern whatsoever. And do you know anyone like that? Where any decision, no matter the gravity, means nothing to them? That sounds like existential depression if you ask me."}, {"t": "p", "v": "I don’t know. Free will and human biology are an interesting paradigm when considered each in hand. Maybe they aren’t meant to be understood. Maybe that’s where faith lends a hand."}, {"t": "dept", "v": "Some Literature"}, {"t": "p", "v": "In honor of McCarthy passing away last week:"}, {"t": "p", "v": "In the years to come he would walk the beach all but daily. Sometimes he’d lie at night in the dry sand above the wrack-line and like the mariners of old study the stars. Perhaps to see how he might plot his course. Or to see what enterprise might be read as favorable in their slow crawl over the black and eternal vastness. - Cormac McCarthy (The Passenger)", "cls": "q"}], "mode": "two"}, {"slug": "july", "title": "July ’23", "deck": "Greek models, the ethics of Meta, and inter-galactic travel", "eyebrow": "July 15, 2023", "mov": "2023", "blocks": [{"t": "img", "src": "img/july-00.jpg", "w": 960, "h": 1200, "cap": "Greek model Theopisti Pourliotopoulou (who got famous after posing for the Venice soccer club Venizia). Welcome to the thirst trap :D", "mw": 707.5, "mh": 520}, {"t": "dept", "v": "The News"}, {"t": "h3", "v": "Meta Begs For “Ethos”"}, {"t": "p", "v": "Meta has been doing a series of PR announcements and feature releases to quell disquiet and explain how the “algorithm” works when catering Instagram & Facebook content to you. Albeit I think its a good thing when tech companies are forthcoming about what they are doing (yet harbor series doubts when they present their intentions). That said, Meta goes in depth and provides not only explanations for how their AI systems work, but also details as to what “signals” are used as primary drivers for their models. For example, they walk through the process of “ranking stories” here \u0006transparency.fb.com/features/explaining-ranking/ig-stories\u0007."}, {"t": "p", "v": "On top of this, Meta is even going as far as releasing datasets from their platform — warranted that its limited to their “public” profiles."}, {"t": "p", "v": "Now, I want to pause for a moment and let this serve as a warning to all those who have public profiles. As of this week, anyone on the internet (whether that be friend or nefarious dark web actor) now has access to your profile data. As someone who is a software engineer by trade if you were to ask me how I’d use “your data” my immediate thoughts would be:"}, {"t": "li", "v": "<span class=\"lp\">Your pictures could be used to generate fake passports + driver’s licenses + etc</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">The NSA can now attribute photos + social connections (aka your followers) to your identity (this fits in nicely with all the text messages, phone numbers, Google/<wbr/>Apple map data they already have harvested on you)</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Next time you get pulled over for speeding the officer will be able to pull up your license number, get your name, and have your date of birth + Insta photos + hobbies all linked in seconds.  </span>", "ord": false, "n": 3, "d": 0}, {"t": "p", "v": "Yeah — this is some Bladerunner-esque dystopian-ism — welcome to the brave new world everyone."}, {"t": "dept", "v": "Ideas"}, {"t": "h3", "v": "One Liners"}, {"t": "p", "v": "Just some random notes I keep on my phone each month."}, {"t": "li", "v": "<span class=\"lp\">If time is relative to the speed of light, then its no wonder summer flies by.</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">What if the old women cutting hair are sculpting us in styles they find attractive? Are we mere caricatures of a cougar’s desire? </span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Water across rock. Caffeine for the soul.</span>", "ord": false, "n": 3, "d": 0}, {"t": "li", "v": "<span class=\"lp\">Man’s reach exceeds his imagination</span>", "ord": false, "n": 4, "d": 0}, {"t": "h3", "v": "Generating Electricity"}, {"t": "p", "v": "My senior year of high school I was obsessed with electricity and was confounded as to how it was created. I understood what electricity was and how it moved through wires but could not wrap my head around how electricity is created by mechanical motion. Therefore, I’m gonna give you all the rundown."}, {"t": "p", "v": "When I say “power generation” you probably think of a power plant or maybe even one of those stationary bikes where you spin the peddles and it says on the screen how many watts of energy you are actively creating. The idea is the same. That spinning motion is at the root of how mechanical motion is transferred to electrical energy."}, {"t": "p", "v": "To start with, electricity is nothing more than electrons (the particles that spin around the nucleus of the atom) running through a given material. Things like metal (especially copper) are good conductors of electricity hence why there are often used. So to “create electricity” we can think of it as “how do I get these electrons in this piece of metal to start moving?” and the answer comes back to the “spinning” motion eluded to earlier."}, {"t": "p", "v": "You remember from middle school science class where you placed two magnets together and the ends repelled each other when the polarity was the same (N + N or S + S) and attracted when opposite (N + S)? Now imagine what happens when you put a magnet next to a piece of wire. One end of the magnet is going to “push” the electrons away (remember that electrons are negatively charged) and the other end is going to attract them."}, {"t": "p", "v": "So by pushing the magnet towards the wire and then pulling it away you create this steady flow of “pushing than pulling” on the electrons which ultimately results in them flowing steadily and hence we have electricity."}, {"t": "p", "v": "TL;DR — Spin a magnet around some metal and you create electricity."}, {"t": "img", "src": "img/july-01.jpg", "w": 400, "h": 231, "cap": "Solar Schools, “Magnets and Electricity”", "mw": 400, "mh": 440}, {"t": "p", "v": "And incase you’re wondering “how does electricity move my Tesla” or “how does electricity turn the blades on my fan” the idea is the exact same just in reverse. Aka, the electric current in the wire pushes on a magnet causing it to spin which can be thereby applied to any downstream mechanical process."}, {"t": "h3", "v": "Schoolteachers of Yesteryears"}, {"t": "p", "v": "Schoolteachers used to be the most educated members of the local community. Most folks, with whatever degree of schooling they had, dropped out early and took up work on the farm, with their family business, as a laborer, etc. Yet some graduated high school, went east, and came back well rounded and studied in mathematics, literature, and science. They than took up teaching at the local day school and brought forth the knowledge of the world to their community’s people."}, {"t": "p", "v": "What happened between then and now? Not to say the schoolteachers of today are uneducated, but they are instead trained on a specific subject (such as math or history) and are seldom the most educated in their community in comparison to the many others that go to college for various disciplines."}, {"t": "p", "v": "Is it simply that the common standard of today is that most folks go to college? Or is it the accessibility of information in today’s digital age? A combination of both? Just something to think about."}, {"t": "h3", "v": "The Practicalities of Inter-Galactic Travel"}, {"t": "p", "v": "If any of you (like me) watched Interstellar and oft-crave the investigation of far flung galaxies than you are in luck. Today, we deep dive the most “practical” means of reaching nearby galaxies."}, {"t": "h4", "v": "\u0003The Facts\u0004"}, {"t": "li", "v": "<span class=\"lp\">The nearest star (other than our Sun) thought to have a habitable planet is Tau Ceti which is 11.9 light-years from Earth</span>", "ord": false, "n": 1, "d": 0}, {"t": "li", "v": "<span class=\"lp\">We’d have to travel at the speed of light for 11.9 years to reach it</span>", "ord": false, "n": 1, "d": 1}, {"t": "li", "v": "<span class=\"lp\">The farthest humans have sent a spacecraft is the Voyager 1 which is now about 18 light hours from Earth</span>", "ord": false, "n": 2, "d": 0}, {"t": "li", "v": "<span class=\"lp\">It’s been traveling for 37 years</span>", "ord": false, "n": 1, "d": 1}, {"t": "h4", "v": "\u0003The Cool Shit \u0004"}, {"t": "h4", "v": "\u0003Option #1: Thermonuclear Fusion\u0004"}, {"t": "p", "v": "Put forth in 1968 by Freeman Dyson. Imagine setting off a hydrogen bomb (continuously) in order to propel a ship through space:"}, {"t": "img", "src": "img/july-02.jpg", "w": 970, "h": 1316, "cap": "NASA CR-185163, “The Gevaltig,” 1989", "mw": 400, "mh": 440}, {"t": "p", "v": "The estimated theoretical speed of such a spacecraft (assuming the science catches up in the next couple hundred years) is ~1/10th the speed of light. So it’d take 11.9 light years / (1/10) = 119 years to reach the nearest (possibly habitable) solar system. You can read more about “fusion rockets” here \u0006en.wikipedia.org/wiki/Fusion_rocket\u0007."}, {"t": "h4", "v": "\u0003Option #2: Laser Beam + Light Sail\u0004"}, {"t": "p", "v": "Proposed by Robert Forward in 1962. An assembled array of solar-powered lasers focus its beam through a lens at a massive “sail” — thereby pushing it forward."}, {"t": "img", "src": "img/july-03.jpg", "w": 1920, "h": 1271, "cap": "Sci.News", "mw": 707.5, "mh": 520}, {"t": "p", "v": "Theoretical estimates show the light sail could pull a ship through space at ~1/5th the speed of light. So traveling to Tau Ceti would take 11.9 / (1/5) = 59.5 years. That being said, laser and solar technologies are far from being close enough for this sort of technology in the 21st century."}, {"t": "h4", "v": "\u0003Option #3: Black Hole Gravitational Slingshot\u0004"}, {"t": "p", "v": "Proposed by Kip Thorne, is a “slingshot maneuver” around two black holes."}, {"t": "img", "src": "img/july-04.jpg", "w": 2800, "h": 2100, "cap": "Kip Thorne, The Science of Interstellar, 2014", "mw": 707.5, "mh": 520}, {"t": "p", "v": "The impracticality of such a method being that we’d have to find two black holes that are orbiting one another and aren’t too close together (otherwise the tidal gravity forces between the two would destroy the ship)."}, {"t": "p", "v": "\u0001Most of the above comes from referencing ‘Far-Future Technology’ per the book “The Science of Interstellar” by Nobel Prize Physicist Kip Thorne.\u0002"}, {"t": "h3", "v": "The Internet: A Temperature Check for the Masses"}, {"t": "p", "v": "Until the advent of the digital age, our understanding of “the people” was surfaced through lackluster means. The folks you went to high school with, the members of your church, and maybe your extended family. This was your immed
